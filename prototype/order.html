<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주문·결제·클레임 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  .changed b { color: var(--ink); }
  .crow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 0; }
  .crow + .crow { border-top: 1px solid var(--rule); }
  .crow > input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--spot); }
  .crow.is-off { opacity: .55; }
  .crow .nm { font-weight: 600; font-size: 14.5px; }
  .crow .meta { font-size: 12px; color: var(--ink-3); }
  .crow .ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .qty.sm button { width: 32px; height: 32px; font-size: 16px; color: var(--ink); }
  .qty.sm input { width: 46px; height: 32px; }
  .was { text-decoration: line-through; color: var(--ink-3); font-weight: 400; }
  .nudge { font-size: 12.5px; color: var(--spot); font-weight: 600; }
  .bfoot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding-top: 10px; border-top: 1px dashed var(--rule-strong); }
  .bfoot b { white-space: nowrap; }
  .sumrow { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .sumrow.total { font-size: 16px; font-weight: 700; border-top: 1px solid var(--rule); padding-top: 8px; }
  .sumrow .num { white-space: nowrap; }
  .coupon { text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; padding: 10px 12px; gap: 2px; }
  .ph2 { border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 10px 12px; }
  .ph2 .num { white-space: nowrap; }
  .app-sec > .seg, .app-sec > .btn { justify-self: start; }
  .olist .oitem { display: grid; gap: 6px; padding: 12px 0; }
  .olist .oitem + .oitem { border-top: 1px solid var(--rule); }
  .oitem .nm { font-weight: 600; font-size: 14px; }
  .linkish { border: 0; background: none; padding: 0; color: var(--c); font: inherit; cursor: pointer; text-decoration: underline; }
  .claimbox { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--sheet-2); font-size: 13px; }
  .steps-c { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .steps-c span { font-size: 10.5px; text-align: center; padding-top: 4px; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .steps-c span.done { border-color: var(--kraft); color: var(--ink-2); }
  .steps-c span.on { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .steps-c span.stop { border-color: var(--stop); color: var(--stop); font-weight: 600; }
  .acct { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .refund-big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .calc-line { font-size: 12px; color: var(--ink-2); background: var(--sheet-2); border-radius: 6px; padding: 8px 10px; line-height: 1.55; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .inline-form .field { min-width: 150px; flex: 1; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
  .tbl td.why { color: var(--ink-2); font-size: 12.5px; }
  .medlog td:nth-child(2) { white-space: nowrap; }
  .stk { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-items: center; }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate, DAY, HOUR } = GC;
  const esc = UI.esc, pv = UI.pv;
  const P = (k) => GC.Policy.get(k);

  /* ── 엔진 정책값 목록에 아직 없는 값: 이 페이지 안 상수(점선 표시) ── */
  const LOCAL = {
    cartKeepDays: { v: 90, t: '90일', label: '회원 장바구니 보관 (U-ORD-01)' },
    checkoutHoldMin: { v: 30, t: '30분', label: '주문서·임시 주문 유지 (U-ORD-02 · C-PAY-01)' },
    acceptRemindBd: { v: 1, t: '영업일 1일', label: '발주 확인 리마인드 (P-ORD-01)' },
    acceptAlertBd: { v: 2, t: '영업일 2일', label: '발주 확인 미처리 운영팀 알림 (P-ORD-01)' },
    pickupBd: { v: 2, t: '영업일 2일', label: '회수 미접수 시 자동 회수 접수 · claim.pickup_register_bd (C-STATE-02)' },
    changeMindDays: { v: 7, t: '받은 날부터 7일', label: '단순 변심 반품 기한 (U-MY-03)' },
    defectLimit: { v: 0, t: '3개월 · 안 날부터 30일', label: '불량 반품 기한 (U-MY-03)' },
    pointMin: { v: 1000, t: '1,000P 이상 · 10P 단위', label: '포인트 사용 조건 (U-ORD-02, 2차)' },
    mediationBd: { v: 5, t: '영업일 5일', label: '중재 판정 목표 기한 (A-ORD-02)' },
  };
  const lv = (k) => `<span class="pv" title="관리자 설정값(임시 기본값) · ${esc(LOCAL[k].label)} — 엔진 정책값 목록에 아직 없어 이 페이지 안 상수로 둠">${LOCAL[k].t}</span>`;
  const tv = (text, label) => `<span class="pv" title="파트너 배송비 템플릿 값(임시) · ${esc(label)} — 파트너가 상품 등록 때 정함(P-PRD-04)">${text}</span>`;

  /* ── 시나리오 데이터 (C-PRICE-01 · C-PRICE-03 예시) ── */
  const STORE = { name: '오늘밥상 강남점', who: '정○○', addr: '서울 강남구 테헤란로 ○○, 1층', time: '평일 10:00~15:00', unload: '1층 매장 앞 하차 · 계단 없음' };
  const PARTNERS = {
    A: { name: '대성포장', from: '경기 파주 출고', lead: 1, ship: { name: '대성포장', type: 'conditional', base: 4000, freeOver: 200000 }, retFee: 4000 },
    B: { name: '한빛컵', from: '경기 김포 출고', lead: 2, ship: { name: '한빛컵', type: 'perQty', base: 3000, per: 10 }, retFee: 3000 },
  };
  const PROD = {
    spoon: { name: '수저집 크라프트', short: '수저집', spec: '1,000매/박스', partner: 'A', tiers: [{ min: 1, price: 12000 }, { min: 10, price: 10000 }], instant: { type: 'rate', value: 10 }, moq: 1, qty: 10 },
    napkin: { name: '무형광 냅킨', short: '냅킨', spec: '3,000매/박스', partner: 'A', tiers: [{ min: 1, price: 30000 }, { min: 5, price: 28000 }], moq: 2, qty: 2 },
    cup: { name: '종이컵 6.5oz', short: '종이컵', spec: '1,000개/박스', partner: 'B', tiers: [{ min: 1, price: 21000 }, { min: 20, price: 20000 }, { min: 50, price: 19000 }], moq: 10, qty: 25, was: 19000 },
  };
  /* 결제 때 주문 항목 스냅샷에 남기는 상세 설명 버전(P-PRD-09 · U-PDP-07 · U-MY-01). nowVer는 주문 뒤 판매자가 고친 예시 */
  const DET_SNAP = {
    spoon: { ver: 2, nowVer: 3, imgs: 3, text: '크라프트지 40g 수저집이에요. 1박스에 1,000매가 들어 있고 식품용 기구 시험성적서를 갖췄어요. 숟가락·젓가락이 함께 들어가는 40×240mm 규격이에요.' },
    napkin: { ver: 1, nowVer: 1, imgs: 2, text: '형광증백제를 쓰지 않은 2겹 냅킨이에요. 1박스 3,000매, 23×23cm 규격이에요.' },
    cup: { ver: 3, nowVer: 3, imgs: 4, text: '무형광 원지로 만든 6.5oz 종이컵이에요. 1박스 1,000개, 뜨거운 음료에도 쓸 수 있어요.' },
  };
  const HQ_COUPONS = [
    { key: 'cart10', name: '장바구니 10%', type: 'rate', value: 10, max: 10000, minOrder: 100000, desc: '최대 10,000원 · 10만원 이상' },
    { key: 'first5', name: '첫 주문 5,000원', type: 'amount', value: 5000, minOrder: 30000, desc: '3만원 이상' },
  ];
  const P_COUPON = { name: '냅킨 5,000원', type: 'amount', value: 5000, minOrder: 50000, itemIds: ['napkin'] };
  const POINTS = 2000;
  const ORDER_NO = 'GC-20261012-0521';
  const subNo = (pid) => `${ORDER_NO}-${pid === 'A' ? '01' : '02'}`;
  const VBANK = { bank: '국민은행', acct: '940-2026-1012-0521', holder: '식업(토스페이먼츠)' };
  const REASON = { change: '단순 변심', defect: '불량·파손', wrong: '오배송' };
  const CLOSED = ['CANCELED', 'RETURNED'];

  /* 취소 클레임은 엔진 CLAIM_CANCEL(C-STATE-02, claim_type CANCEL)을 씀. 이의 제기는 상태가 아니라 '이의 제기됨' 표시(U-MY-01 · D8) */

  const app = UI.mount({
    domain: 'order',
    title: '주문·결제·클레임',
    lede: '사장님은 여러 판매자 상품을 한 번에 결제하고, 결제가 끝나면 판매자별 주문으로 나뉘어 파트너가 각자 발주 확인·출고합니다. 취소·반품은 결제 때 저장한 스냅샷으로 남은 항목을 처음부터 다시 계산해 환불해요.',
    meta: '근거: 기능 명세서 U-ORD-01~05 · U-MY-01~03 · U-PDP-07(주문 시점 상세 설명) · P-ORD-01~05 · C-PRICE-01~03 · C-PAY-01·02 · C-STATE-01·02 · A-ORD-02 · 디자인 요청서 S-20~S-26',
    actors: [
      { id: 'customer', title: '장바구니' },
      { id: 'partner', nav: ['주문', '클레임', '상품', '정산'], navOn: '주문', url: 'partner.sikup.co.kr/orders' },
      { id: 'system' },
      { id: 'hq', nav: ['대시보드', '주문', '분쟁 중재', '정산'], navOn: '주문', url: 'admin.sikup.co.kr/orders' },
    ],
    strips: [
      { id: 'order', machine: 'ORDER', label: '주문 항목 · 대표 상태', note: '항목마다 따로 움직이고, 여기엔 가장 앞 단계 항목을 보여줘요 · C-STATE-01' },
      { id: 'cancel', machine: 'CLAIM_CANCEL', label: '취소 클레임', note: 'claim_type CANCEL · C-STATE-02', hidden: true },
      { id: 'claim', machine: 'CLAIM_RETURN', label: '반품 클레임', note: 'claim_type RETURN · C-STATE-02', hidden: true },
    ],
    render: (actor, f) => VIEWS[actor](f),
    onReset: init,
    foot: '시나리오: 강남의 한식당 "오늘밥상"이 대성포장(수저집·냅킨)과 한빛컵(종이컵) 상품을 한 장바구니에 담아 주문합니다. 종이컵을 빼면 기능 명세서 C-PRICE-01 · C-PAY-02 예시와 같은 숫자가 나와요. 회사·계좌번호는 설명용 예시입니다.',
  });
  const S = () => app.S;
  const MAIN_CARD = ['PAID', 'ACCEPTED', 'SHIPPED', 'DELIVERED', 'CONFIRMED'];

  function init() {
    Object.assign(app.S, {
      cs: 'cart', cart: { spoon: { on: true, qty: 10 }, napkin: { on: true, qty: 2 }, cup: { on: true, qty: 25 } },
      ph2: true, hqKey: null, pay: 'card', proof: 'tax', memo: '', flags: {},
      order: null, recs: [], seq: 1, sheet: null, creq: null, ret: null, pv: 'A', fired: {}, csState: null,
    });
    app.strips.cancel.hidden = true; app.strips.claim.hidden = true;
    app.strips.order.main = MAIN_CARD.slice();
    syncStrip(); guide();
  }

  /* ── 금액 계산 입력 ── */
  function itemOf(b, qty) { const p = PROD[b]; return { id: b, name: p.name, partnerId: p.partner, shipKey: p.partner + '-일반', qty, unit: p.spec, tiers: p.tiers, instant: p.instant }; }
  const shippingTpl = () => ({ 'A-일반': PARTNERS.A.ship, 'B-일반': PARTNERS.B.ship });
  const selBases = () => Object.keys(PROD).filter((b) => S().cart[b].on);
  const baseInput = () => ({ items: selBases().map((b) => itemOf(b, S().cart[b].qty)), shipping: shippingTpl() });
  const shipCoupon = () => ({ name: '멤버십 무료배송', max: P('membership.free_ship_max'), minOrder: P('membership.free_ship_min_order') });
  function withPartner() { const b = baseInput(); return S().ph2 ? { ...b, partnerCoupons: { A: P_COUPON } } : b; }
  function hqOptions() { const w = withPartner(); return HQ_COUPONS.map((c) => ({ c, d: GC.price.calcOrder({ ...w, hqCoupon: c }).totals.hqDisc })); }
  function checkoutInput() {
    const s = S(); const w = withPartner();
    const opts = hqOptions(); const best = opts.reduce((a, b) => (b.d > a.d ? b : a));
    const input = { ...w, hqCoupon: s.hqKey ? HQ_COUPONS.find((c) => c.key === s.hqKey) : best.c };
    if (s.ph2) {
      input.shipCoupons = {};
      [...new Set(w.items.map((i) => i.shipKey))].forEach((k) => { input.shipCoupons[k] = shipCoupon(); });
      input.points = POINTS;
    }
    return input;
  }

  /* ── 주문 항목(분할 가능)과 환불 계산 ── */
  const recById = (id) => S().recs.find((r) => r.id === id);
  const isActive = (r) => !CLOSED.includes(r.st);
  const activeQty = (b) => S().recs.filter((r) => r.base === b && isActive(r)).reduce((a, r) => a + r.qty, 0);
  const totalActive = () => S().recs.filter(isActive).reduce((a, r) => a + r.qty, 0);
  const bal = () => { const o = S().order; return { pg: o.paid.pg - o.refunded.pg, points: o.paid.points - o.refunded.points }; };
  const balTotal = () => { const b = bal(); return b.pg + b.points; };
  const mName = () => (S().order && S().order.method === 'vbank' ? '가상계좌' : '카드');
  function splitRec(rec, k) {
    if (k >= rec.qty) return rec;
    const s = S(); s.seq += 1;
    const n = { ...rec, id: `${rec.base}-${s.seq}`, qty: k };
    rec.qty -= k;
    s.recs.splice(s.recs.indexOf(rec) + 1, 0, n);
    app.log('rule', `항목 분할(split): ${esc(PROD[rec.base].name)} ${rec.qty + k}박스 → ${rec.qty}박스 + ${k}박스 · 나뉜 항목은 각자 상태가 움직여요`);
    return n;
  }
  /** 결제 스냅샷으로 남은 수량을 다시 계산 (엔진 C-PAY-02). 같은 상품은 총수량으로 구간 단가를 정함 */
  function refundCalc(cancel, mode = 'before_ship') {
    const o = S().order; const items = [];
    Object.keys(PROD).forEach((b) => { const q = activeQty(b) - (cancel[b] || 0); if (q > 0) items.push(itemOf(b, q)); });
    const cb = Object.keys(cancel)[0];
    items.push({ ...itemOf(cb, cancel[cb]), id: '__cancel' });
    return GC.refund.partialCancel({ input: { ...o.snap, items }, paid: o.paid, refunded: o.refunded, cancelIds: ['__cancel'], mode });
  }
  /** 고객이 실제로 낸 몫(파트너 할인·본사 쿠폰 안분 뒤) */
  function paidShare(base, qty) { const o = S().order; const l = o.calc.lines.find((x) => x.id === base); return Math.floor(((l.afterPartner - l.hqAlloc) * qty) / o.origQty[base]); }
  function splitPay(refund) {
    const b = bal(); const t = b.pg + b.points;
    const pointRefund = t > 0 ? GC.floor10((refund * b.points) / t) : 0;
    return { refund, pointRefund, pgRefund: refund - pointRefund };
  }
  /** 파트너 귀책(품절·불량·오배송): 할인 회수 없이 낸 몫 그대로. 단 스냅샷 재계산보다 적게 주지 않음(묶음 배송비·쿠폰 재안분). 남은 항목이 없으면 잔액 전부 */
  function faultRefund(base, qty) {
    const b = bal(); const cr = refundCalc({ [base]: qty }, 'return');
    if (cr.last || totalActive() - qty <= 0) return { refund: b.pg + b.points, pointRefund: b.points, pgRefund: b.pg, last: true, bears: 0, cr };
    const recompute = cr.zeroRefund ? -cr.shortfall : cr.refund;
    const refund = Math.min(balTotal(), Math.max(paidShare(base, qty), recompute));
    return { ...splitPay(refund), bears: Math.max(0, refund - recompute), cr };
  }
  function returnRefund(base, qty, fault, pid) {
    const fee = PARTNERS[pid].retFee;
    if (fault === 'partner') return { ...faultRefund(base, qty), fee, feeBy: 'partner' };
    const cr = refundCalc({ [base]: qty }, 'return');
    if (cr.zeroRefund) return { refund: 0, pointRefund: 0, pgRefund: 0, zero: true, shortfall: cr.shortfall, fee, feeBy: 'customer', cr };
    const net = cr.refund - fee;
    if (net <= 0) return { refund: 0, pointRefund: 0, pgRefund: 0, zero: true, shortfall: 0, fee: cr.refund, feeBy: 'customer', cr };
    return { ...splitPay(net), fee, feeBy: 'customer', gross: cr.refund, cr };
  }
  function recalcText(r) {
    if (r.last) return `남은 상품이 없어 결제 잔액 ${won(r.balance)}을 모두 돌려드려요(마지막 취소는 계산 없이 잔액 전부).`;
    const o = S().order; const t = r.recalc.totals;
    const parts = r.recalc.lines.map((l) => `${PROD[l.id].short} ${l.qty}박스 ${won(l.afterPartner)}`).join(' + ');
    const hq = t.hqDisc ? ` − 본사 쿠폰 ${won(t.hqDisc)}` : o.calc.totals.hqDisc ? ' · 본사 쿠폰 최소 주문 미달 → 0원' : '';
    return `남은 주문 다시 계산: ${parts}${hq} + 배송비 ${won(t.shipping)}${t.shipCoupon ? ` − 무료배송 쿠폰 ${won(t.shipCoupon)}` : ''} = <b>${won(r.remainingTotal)}</b><br>환불액 = 결제 잔액 ${won(r.balance)} − ${won(r.remainingTotal)} = <b>${won(r.balance - r.remainingTotal)}</b>`;
  }
  function couponBack(r, partnerFault) {
    const o = S().order; const out = []; const t = o.calc.totals;
    const gone = (k) => !o.restored[k];
    const rc = r && r.recalc;
    if (t.partnerCouponDisc && gone('pc') && (!rc || !rc.totals.partnerCouponDisc)) out.push(['pc', `파트너 쿠폰 ${P_COUPON.name}`]);
    if (!partnerFault || !rc) {
      if (t.hqDisc && gone('hq') && (!rc || !rc.totals.hqDisc)) out.push(['hq', `본사 쿠폰 ${o.snap.hqCoupon.name}`]);

      app.clock.pass(20 * HOUR);
      s.recs.filter((r) => r.st === 'SHIPPED').forEach((r) => { move(r, 'deliver', '택배 조회 · 배송 완료'); r.deliveredAt = now(); });
      app.notify('NOTI_DELIVERED', '고객', ['푸시'], `배송 완료 · ${P('order.auto_confirm_days')}일 뒤 자동 구매 확정`);
      if (s.creq && s.creq.done === 'won' && s.creq.collect === 'wait' && recById(s.creq.recId).st === 'DELIVERED') startCancelCollect();
      refresh();
    },
    async collected() {
      if (cancelCollecting()) { await cancelWonRefund(); return; }
      const s = S(); await app.ext({ service: '스윗트래커', what: '회수 택배 도착 확인', lines: ['회수 송장으로 판매자 도착을 확인해요'] });
      app.clock.pass(30 * HOUR);
      app.go('claim', 'collected', { by: '회수 완료' }); s.ret.inspectDue = GC.addBusinessDays(now(), P('claim.inspect_bd'));
      app.notify('NOTI_PARTNER_CLAIM_DUE', PARTNERS[recById(s.ret.recId).pid].name, ['알림톡'], `검수 기한 ${fmtDate(s.ret.inspectDue)}`); refresh();
    },

    /* 본사 */
    async mediate(b) {
      const s = S(); const r = s.ret; const pid = recById(r.recId).pid;
      if (b.dataset.r === 'customer') {
        app.go('claim', 'mediation_customer', { by: '본사 중재 · 고객 주장 인정(최종)' });
        await approveReturnCore(null, false);
      } else {
        app.go('claim', 'mediation_partner', { by: '본사 중재 · 판매자 거부 유지(최종)' });
        r.done = 'mediated';
        app.log('rule', '거부 확정 → 회수한 상품을 고객에게 다시 보내고 배송비는 고객 부담');
      }
      mediationNotify(pid); refresh();
    },
    /* 취소 거부 이의 중재(C-STATE-02 이의 제기·중재 줄 · A-ORD-02). 결과는 최종 */
    async mediateCancel(b) {
      const s = S(); const c = s.creq; const rec = recById(c.recId);
      if (b.dataset.r === 'customer') {
        if (!app.go('cancel', 'mediation_customer', { by: '본사 중재 · 고객 주장 인정(최종)' })) return;
        c.done = 'won'; c.collect = 'wait';
        app.log('rule', '이미 나간 상품이라 판매자 비용으로 회수한 뒤 환불해요(회수 배송비 판매자 부담 · 환불 금액은 취소 요청 때 안내한 스냅샷 재계산). 주문 항목은 C-STATE-01 표 안에서 배송 완료 → 반품 완료로 닫혀요');
        if (rec.st === 'DELIVERED') startCancelCollect();
      } else {
        if (!app.go('cancel', 'mediation_partner', { by: '본사 중재 · 판매자 거부 유지(최종)' })) return;
        c.done = 'kept';
        app.log('rule', '거부 확정 → 클레임이 닫혀 이 항목도 자동 구매 확정 대상으로 돌아가요. 받은 상품은 일반 반품 절차(U-MY-03)로만 돌려보낼 수 있어요');
      }
      mediationNotify(rec.pid); refresh();
    },
  });

  function objectionNotify(pid, what) {
    app.notify('NOTI_OBJECTION_RECEIVED', '고객', ['알림톡', '이메일'], '이의 접수');
    app.notify('NOTI_PARTNER_OBJECTION_RECEIVED', PARTNERS[pid].name, ['알림톡'], '고객 이의 · 본사 중재');
    app.notify('NOTI_INT_MEDIATION_NEW', '운영팀(CS)', ['관리자 알림', 'Slack'], what);
  }
  function mediationNotify(pid) {
    app.notify('NOTI_MEDIATION_DECIDED', '고객', ['알림톡', '이메일'], '중재 결과(최종)');
    app.notify('NOTI_PARTNER_MEDIATION_DECIDED', PARTNERS[pid].name, ['알림톡', '이메일'], '중재 결과(최종)');
  }
  /** 취소 인정 건 회수 접수: 플랫폼이 계약 택배사로 접수하고 회수 배송비는 판매자 부담 */
  function startCancelCollect() {
    const c = S().creq; c.collect = 'collecting';
    app.log('ext', '계약 택배사 · 회수 접수(본사 중재로 취소 인정 · 회수 배송비 판매자 부담)');
    app.notify('NOTI_CLAIM_UPDATED', '고객', ['알림톡', '푸시'], '취소 인정 · 회수 기사 방문 안내');
  }
  /** 회수 확인 → 취소 요청 때 안내한 금액(스냅샷 재계산)을 환불 → 주문 항목 반품 완료 · 클레임 완료 */
  async function cancelWonRefund() {
    const s = S(); const c = s.creq; const rec = recById(c.recId);
    await app.ext({ service: '스윗트래커', what: '회수 택배 도착 확인', lines: ['회수 송장으로 판매자 도착을 확인해요', '본사가 취소를 인정한 건이라 판매자 검수 없이 환불해요'] });
    app.clock.pass(30 * HOUR);
    const x = refundCalc({ [rec.base]: rec.qty }, 'return'); const back = couponBack(x);
    await payRefund(x, `${PROD[rec.base].short} 취소 인정(본사 중재) · 회수 뒤 환불`, ['회수 배송비는 판매자 부담']);
    move(rec, 'return_done', '취소 인정 상품 회수 완료');
    rec.refunded = x.refund; rec.viaCancel = true;
    restoreCoupons(back);
    app.go('cancel', 'refund', { by: '환불 완료' });
    Object.assign(c, { done: 'refunded', refund: x.refund, collect: null });
    refresh();
  }

  async function approveCancelCore(auto) {
    const s = S(); const c = s.creq; const rec = recById(c.recId);
    const r = refundCalc({ [rec.base]: rec.qty });
    const by = auto ? `영업일 ${P('claim.cancel_auto_approve_bd')}일 미처리 → 자동 승인` : '판매자 취소 승인';
    if (r.blocked) { app.log('warn', '지금 다시 계산하면 환불액이 0원 이하라 부분 취소를 할 수 없어요 → 전체 취소 안내'); return; }
    const back = couponBack(r);
    app.go('cancel', auto ? 'auto_approve' : 'approve', { by });
    move(rec, 'cancel_approved', by);
    if (auto) { refundApply(r, '취소 요청 자동 승인', true); app.notify('NOTI_PARTNER_CLAIM_AUTO_APPROVED', PARTNERS[rec.pid].name, ['알림톡'], '취소 요청 자동 승인 · 평가 기록'); }
    else await payRefund(r, `${PROD[rec.base].short} 취소 요청 승인`);
    rec.refunded = r.refund;
    app.go('cancel', 'refund', { by: '환불 완료' });
    restoreCoupons(back);
    s.creq = null;
    if (!auto) refresh();
  }
  async function approveReturnCore(by, silent) {
    const s = S(); const r = s.ret; const rec = recById(r.recId);
    const x = returnRefund(rec.base, rec.qty, r.fault, rec.pid);
    if (by) app.go('claim', 'approve', { by });
    const back = r.fault === 'customer' ? couponBack(x.cr) : [];
    if (x.zero) app.log('money', `0원 환불 · 차액 ${won(x.shortfall)}은 고객이 동의한 방식(추가 결제 또는 혜택 포기)으로 정리 · 반품 배송비 ${won(x.fee)} 고객 부담`);
    else if (silent) refundApply(x, '반품 환불(검수 기한 초과 자동 승인)', true);
    else await payRefund(x, `${PROD[rec.base].short} 반품 환불 · ${REASON[r.reason]}`, [x.feeBy === 'partner' ? '반품 배송비는 판매자 부담' : `반품 배송비 ${won(x.fee)}을 환불액에서 뺐어요`]);
    if (x.bears) bear(rec.pid, x.bears, '판매자 귀책이라 할인 회수 면제');
    restoreCoupons(back);
    app.go('claim', 'refund', { by: '환불 완료' });
    move(rec, rec.st === 'CONFIRMED' ? 'defect_return_done' : 'return_done', '반품 완료');
    if (rec.st === 'RETURNED') rec.refunded = x.refund;
    r.done = 'refunded'; r.result = x;
  }

  /* ── 시간이 흐를 때: 입금 기한·자동 승인·자동 회수·자동 확정 ── */
  app.onAdvance((prev, t) => {
    const s = S(); const o = s.order; if (!o) return;
    if (o.vbDue && s.recs.some((r) => r.st === 'PAYMENT_PENDING')) {
      if (!s.fired.vbSoon && t.getTime() >= o.vbDue.getTime() - DAY) { s.fired.vbSoon = true; app.notify('NOTI_VBANK_DUE_SOON', '고객', ['알림톡', '푸시'], `입금 기한 하루 전 · ${fmtDate(o.vbDue)}까지`); }
      if (t >= o.vbDue) {
        app.log('ext', '토스페이먼츠 · 가상계좌 마감 확인');
        s.recs.filter((r) => r.st === 'PAYMENT_PENDING').forEach((r) => move(r, 'vbank_expire', `입금 기한 ${P('payment.vbank_due_days')}일 경과`));
        app.log('rule', '쿠폰·포인트·재고를 되돌려요. 기한 뒤 들어온 입금은 주문을 되살리지 않고 자동 환불해요');
        app.notify('NOTI_VBANK_EXPIRED', '고객', ['알림톡', '푸시'], '입금 기한이 지나 주문 취소');
      }
    }
    if (o.paidAt) ['A', 'B'].forEach((pid) => {
      if (!s.recs.some((r) => r.pid === pid && r.st === 'PAID')) return;
      if (t >= GC.addBusinessDays(o.paidAt, LOCAL.acceptRemindBd.v) && !s.fired['a1' + pid]) { s.fired['a1' + pid] = true; app.notify('NOTI_PARTNER_ACCEPT_LATE', PARTNERS[pid].name, ['알림톡'], '발주 확인 리마인드'); }
      if (t >= GC.addBusinessDays(o.paidAt, LOCAL.acceptAlertBd.v) && !s.fired['a2' + pid]) { s.fired['a2' + pid] = true; app.log('warn', `${PARTNERS[pid].name} 발주 확인 영업일 2일 지연 → 운영팀 알림`); }
    });
    if (s.creq && app.state('cancel') === 'CANCEL_REQUESTED' && t >= s.creq.due && recById(s.creq.recId).st === 'ACCEPTED') approveCancelCore(true);
    /* 이의 기한(GC.claim.canObject = 거부 통지 + claim.objection_days)이 지나고 이의가 없으면 거부 확정. 이의가 있으면 중재를 기다림 */
    const expired = (type, state, rejAt) => !GC.claim.canObject({ claimType: type, state, rejectedAt: rejAt, now: t });
    if (s.creq && app.state('cancel') === 'CANCEL_REJECTED' && !s.creq.objection && expired('CANCEL', 'CANCEL_REJECTED', s.creq.rejAt)) {
      app.go('cancel', 'no_objection', { by: `${P('claim.objection_days')}일 동안 이의 없음 → 거부 확정` }); s.creq.done = 'expired';
      app.log('rule', '이의 기한이 지나 [이의 제기] 버튼을 숨겨요. 클레임이 닫혀 이 항목도 자동 구매 확정 대상으로 돌아가요');
    }
    if (retOpen()) {
      const r = s.ret; const st = app.state('claim');
      if (st === 'RETURN_REQUESTED' && r.method === 'pickup' && t >= r.pickupDue) { app.log('ext', '계약 택배사 · 자동 회수 접수'); app.go('claim', 'pickup', { by: '영업일 2일 미접수 → 플랫폼 자동 회수 접수' }); app.log('rule', '판매자 기한 초과 자동 처리 → 평가 기록(페널티는 2차)'); }
      if (st === 'RETURN_REQUESTED' && r.method === 'self' && t >= r.shipDue) { app.go('claim', 'withdraw', { by: '7일 안 미발송 → 자동 철회' }); r.done = 'withdrawn'; app.notify('NOTI_CLAIM_WITHDRAWN', '고객', ['알림톡', '푸시'], '반품 자동 철회'); }
      if (st === 'RETURN_INSPECTING' && r.inspectDue && t >= r.inspectDue) approveReturnCore(`검수 기한 영업일 ${P('claim.inspect_bd')}일 초과 → 자동 승인`, true);
      if (st === 'RETURN_REJECTED' && !r.objection && expired('RETURN', st, r.rejAt)) { app.go('claim', 'no_objection', { by: `${P('claim.objection_days')}일 동안 이의 없음 → 거부 확정` }); r.done = 'rejected'; }
    }
    const days = P('order.auto_confirm_days');
    s.recs.forEach((r) => {
      if (r.st !== 'DELIVERED' || !r.deliveredAt || hasOpenClaim(r)) return;
      const due = r.deliveredAt.getTime() + days * DAY;
      if (t.getTime() >= due - DAY && t.getTime() < due && !s.fired['cd' + r.pid]) { s.fired['cd' + r.pid] = true; app.notify('NOTI_CONFIRM_DUE', '고객', ['푸시'], '내일 자동 구매 확정'); }
      if (t.getTime() >= due) { move(r, 'confirm', `자동 구매 확정 배치 · 확정 시각 ${fmtDate(new Date(due))}(배송 완료 + ${days}일)`); app.log('money', `정산 이벤트: ${esc(recLabel(r))} 구매 확정 → ${PARTNERS[r.pid].name} 다음 주 정산 대상`); }
    });
    syncStrip(); guide();
  });
})();
</script>
