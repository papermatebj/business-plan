<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주문·결제·클레임 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  .changed b { color: var(--ink); }
  .crow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 0; }
  .crow + .crow { border-top: 1px solid var(--rule); }
  .crow > input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--spot); }
  .crow.is-off { opacity: .55; }
  .crow .nm { font-weight: 600; font-size: 14.5px; }
  .crow .meta { font-size: 12px; color: var(--ink-3); }
  .crow .ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .qty.sm button { width: 32px; height: 32px; font-size: 16px; color: var(--ink); }
  .qty.sm input { width: 46px; height: 32px; }
  .was { text-decoration: line-through; color: var(--ink-3); font-weight: 400; }
  .nudge { font-size: 12.5px; color: var(--spot); font-weight: 600; }
  .bfoot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding-top: 10px; border-top: 1px dashed var(--rule-strong); }
  .bfoot b { white-space: nowrap; }
  .sumrow { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .sumrow.total { font-size: 16px; font-weight: 700; border-top: 1px solid var(--rule); padding-top: 8px; }
  .sumrow .num { white-space: nowrap; }
  .coupon { text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; padding: 10px 12px; gap: 2px; }
  .ph2 { border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 10px 12px; }
  .ph2 .num { white-space: nowrap; }
  .app-sec > .seg, .app-sec > .btn { justify-self: start; }
  .olist .oitem { display: grid; gap: 6px; padding: 12px 0; }
  .olist .oitem + .oitem { border-top: 1px solid var(--rule); }
  .oitem .nm { font-weight: 600; font-size: 14px; }
  .linkish { border: 0; background: none; padding: 0; color: var(--c); font: inherit; cursor: pointer; text-decoration: underline; }
  .claimbox { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; background: var(--sheet-2); font-size: 13px; }
  .steps-c { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .steps-c span { font-size: 10.5px; text-align: center; padding-top: 4px; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .steps-c span.done { border-color: var(--kraft); color: var(--ink-2); }
  .steps-c span.on { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .steps-c span.stop { border-color: var(--stop); color: var(--stop); font-weight: 600; }
  .acct { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .refund-big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .calc-line { font-size: 12px; color: var(--ink-2); background: var(--sheet-2); border-radius: 6px; padding: 8px 10px; line-height: 1.55; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .inline-form .field { min-width: 150px; flex: 1; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
  .tbl td.why { color: var(--ink-2); font-size: 12.5px; }
  .medlog td:nth-child(2) { white-space: nowrap; }
  .stk { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-items: center; }
  /* 추가 구성품: 본 상품 줄 아래 붙은 줄 (U-ORD-01·02 · U-MY-01) */
  .crow.addon { margin-left: 32px; padding: 6px 0 10px 10px; border-top: 0; border-left: 2px solid var(--rule-strong); }
  .olist .oitem.addon { margin-left: 14px; padding: 4px 0 10px 10px; border-top: 0; border-left: 2px solid var(--rule-strong); }
  .co-addon { padding-left: 14px; color: var(--ink-2); }
  .tag.tag-sm { font-size: 10.5px; padding: 0 5px; }
  /* 쿠폰 자리(D21): 상품 할인 1장 · 디자인비 1장 · 배송비 묶음당 1장 */
  .slot { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .slot-h { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: 13px; }
  /* 시작 장면 고르기 */
  .scn { display: grid; gap: 10px; }
  .scn-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .scn-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
  .scn-card { text-align: left; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--sheet); color: var(--ink-2); cursor: pointer; display: grid; gap: 4px; align-content: start; font: inherit; font-size: 12.5px; line-height: 1.5; }
  .scn-card:hover { border-color: var(--rule-strong); }
  .scn-card .scn-t { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .scn-card[aria-pressed="true"] { border-color: var(--spot); box-shadow: 0 0 0 1px var(--spot); background: var(--spot-weak); color: var(--ink); }
  .scn-card .scn-on { display: none; }
  .scn-card[aria-pressed="true"] .scn-on { display: inline-flex; }
  /* 제작 판매자 변경 카드 (U-MY-01 · A-ORD-01) */
  .swap s { color: var(--ink-3); }
  .pc-acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tbl tr.is-pick td { background: var(--spot-weak); }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate, DAY, HOUR } = GC;
  const esc = UI.esc, pv = UI.pv;
  const P = (k) => GC.Policy.get(k);
  /* 반품 사유와 귀책(엔진 GC.claim.RETURN_REASONS · C-STATE-02): 화면 키 change·defect·late */
  const RKEY = { CHANGE_MIND: 'change', DEFECT: 'defect', LATE: 'late' };
  const REASON = Object.fromEntries(GC.claim.RETURN_REASONS.map((r) => [RKEY[r.code], r]));

  /* ── 정책값: 장바구니 보관·주문서 유지·발주 확인 리마인드·운영팀 알림·회수 접수·중재 목표·'늦게 받음' 기한은
     2026-10-17 S12 ⑫·㉑·㉒로 엔진 키가 생겨 GC.Policy.get / UI.pv로 읽음(order.cart_keep_days · order.checkout_hold_minutes ·
     order.accept_remind_bd · order.accept_alert_bd · claim.pickup_register_bd · claim.mediation_bd · claim.late_return_days) ── */
  const lateDays = () => P('claim.late_return_days'); // = GC.claim.RETURN_REASONS LATE의 days
  const lateTxt = () => pv('claim.late_return_days', `받은 날부터 ${lateDays()}일`);
  /* ── 법정 값: 정책값 키로 두지 않음(고객에게 불리하게 바꿀 수 없음 · S12 ⑫). 엔진 RETURN_REASONS CHANGE_MIND의 legal ── */
  const LEGAL = {
    changeMind: { v: REASON.change.days, t: `받은 날부터 ${REASON.change.days}일`, label: '단순 변심 반품 기한(전자상거래법 청약철회, U-MY-03)' },
    defect: { t: '받은 날부터 3개월 · 안 날부터 30일', label: '불량·표시와 다름 반품 기한(전자상거래법, U-MY-03)' },
  };
  const lg = (k) => `<span title="법정 값 · ${esc(LEGAL[k].label)} — 고객에게 불리하게 바꿀 수 없어 관리자 설정값이 아니에요">${LEGAL[k].t}</span>`;
  /* ── 2차 기능 값(정책값, 2차에 키): 이 페이지 안 상수(점선 표시) ── */
  const LOCAL = {
    pointMin: { t: '1,000P 이상 · 10P 단위', label: '포인트 사용 조건 (U-ORD-02, 2차 기능이라 키는 2차에)' },
    /* 명세 문장에만 있는 기간(따로 키 없음) — 2026-10-17 D71 · S12 맞춤 ⑳ */
    rbRemind: { v: 3, t: '기한 3일 전', label: '거부 수량 [되돌려 받기]·[폐기] 기한 전 다시 알림 (P-ORD-05 · D71 — claim.return_back_pay_days 설명 안의 값)' },
    acctRemind: { v: 7, t: '7일', label: '지연배상금 환불 계좌 입력 요청 뒤 다시 알림 · 모니터링 송금 대기 (C-PAY-02 · A-ORD-01 · S12 맞춤 ⑳)' },
  };
  const lv = (k) => `<span class="pv" title="관리자 설정값(임시 기본값) · ${esc(LOCAL[k].label)} — 엔진 정책값 목록에 아직 없어 이 페이지 안 상수로 둠">${LOCAL[k].t}</span>`;
  const tv = (text, label) => `<span class="pv" title="파트너 배송비 템플릿 값(임시) · ${esc(label)} — 파트너가 상품 등록 때 정함(P-PRD-04)">${text}</span>`;

  /* ── 알림 채널: C-NOTI-01 표 그대로(2026-10-17 맞춤 ⑩ — 이메일 칸의 조건 없는 ○가 없어짐). 이메일 ● 행만 이메일을 넣고,
     조건 ○(NOTI_CLAIM_UPDATED '거부·환불 완료 때')는 조건이 맞을 때만(nt의 mail). 앱 푸시 ○는 앱 설치·알림 권한이 있을 때 ── */
  const KT = '알림톡', SMS = 'SMS 대체', PU = '앱 푸시', EM = '이메일', NC = '알림센터', ANC = '관리자 알림센터', SL = 'Slack';
  const CUST5 = [KT, SMS, PU, EM, NC], CUST4 = [KT, SMS, PU, NC], PT4 = [KT, SMS, EM, NC], PT3 = [KT, SMS, NC];
  const CH = {
    NOTI_ORDER_PAID: CUST5, NOTI_VBANK_ISSUED: CUST5, NOTI_VBANK_DUE_SOON: CUST4, NOTI_VBANK_DEPOSITED: CUST4, NOTI_VBANK_EXPIRED: CUST5,
    NOTI_ITEM_STOCKOUT_CANCELED: CUST5, NOTI_ITEM_PARTNER_CHANGE_PROPOSED: CUST5, NOTI_ITEM_PARTNER_CHANGED: CUST5, NOTI_ITEM_PARTNER_CHANGE_REFUNDED: CUST5,
    NOTI_SHIPPED: CUST4, NOTI_SHIP_OVERDUE: CUST4, NOTI_BULK_DELAY_NOTICE: CUST4, NOTI_DELIVERED: [PU, NC], NOTI_CONFIRM_DUE: [PU, NC],
    NOTI_CLAIM_UPDATED: CUST4, NOTI_RETURN_BACK_DUE: CUST5, NOTI_CLAIM_WITHDRAWN: CUST4, NOTI_OBJECTION_RECEIVED: CUST5, NOTI_MEDIATION_DECIDED: CUST5,
    NOTI_REFUND_ACCOUNT_REQUIRED: CUST5, NOTI_REFUND_DELAY_PAID: CUST5,
    NOTI_PARTNER_ORDER_NEW: PT4, NOTI_PARTNER_ACCEPT_LATE: PT3, NOTI_PARTNER_SHIP_OVERDUE: PT3, NOTI_PARTNER_ITEM_CANCELED: PT3, NOTI_PARTNER_BULK_DELAY_NOTICE: PT3,
    NOTI_PARTNER_CLAIM_NEW: PT4, NOTI_PARTNER_CLAIM_DUE: PT3, NOTI_PARTNER_RETURN_BACK: PT3, NOTI_PARTNER_CLAIM_AUTO_APPROVED: PT4,
    NOTI_PARTNER_OBJECTION_RECEIVED: PT4, NOTI_PARTNER_MEDIATION_DECIDED: PT4, NOTI_PARTNER_PACKAGE_HANDED_OFF: PT4,
    NOTI_INT_MEDIATION_NEW: [ANC, SL], NOTI_INT_REFUND_DUE: [EM, ANC, SL], NOTI_INT_REFUND_OVER: [EM, ANC, SL],
  };
  const MAIL_IF = { NOTI_CLAIM_UPDATED: '거부·환불 완료 때' };
  /** 알림(채널은 위 표에서). mail = 조건부 이메일의 조건이 맞음(예: NOTI_CLAIM_UPDATED 거부·환불 완료) */
  function nt(code, to, text, mail = false) {
    const ch = [...(CH[code] || [KT, NC])];
    if (mail && MAIL_IF[code] && !ch.includes(EM)) ch.splice(ch.indexOf(NC), 0, EM);
    app.notify(code, to, ch, text);
  }

  /* ── 시나리오 데이터 (C-PRICE-01 · C-PRICE-03 예시) ── */
  const STORE = { name: '오늘밥상 강남점', who: '정○○', addr: '서울 강남구 테헤란로 ○○, 1층', time: '평일 10:00~15:00', unload: '1층 매장 앞 하차 · 계단 없음' };
  /* retFee = 반품 배송비(편도) · exFee = 교환 배송비(왕복, 무료배송으로 받은 묶음을 단순 변심으로 모두 반품할 때도 이 금액 — C-PRICE-03) — 파트너 배송비 템플릿 값 */
  const PARTNERS = {
    A: { name: '대성포장', from: '경기 파주 출고', lead: 1, ship: { name: '대성포장', type: 'conditional', base: 4000, freeOver: 200000 }, retFee: 4000, exFee: 8000 },
    B: { name: '한빛컵', from: '경기 김포 출고', lead: 2, ship: { name: '한빛컵', type: 'perQty', base: 3000, per: 10 }, retFee: 3000, exFee: 6000 },
  };
  /* pick = 추가 구성품(P-PRD-02 · D24): 정해진 가격 × 수량, 파트너 할인 없음, 본 상품(addonOf)과 같은 배송 묶음. '추가 구성품' 예시에서만 장바구니에 있음 */
  const PROD = {
    spoon: { name: '수저집 크라프트', short: '수저집', spec: '1,000매/박스', partner: 'A', tiers: [{ min: 1, price: 12000 }, { min: 10, price: 10000 }], instant: { type: 'rate', value: 10 }, moq: 1, qty: 10 },
    pick: { name: '이쑤시개 1,000개', short: '이쑤시개', spec: '1,000개/봉 · 개별 포장', partner: 'A', tiers: [{ min: 1, price: 3000 }], moq: 1, qty: 2, u: '봉', addonOf: 'spoon' },
    napkin: { name: '무형광 냅킨', short: '냅킨', spec: '3,000매/박스', partner: 'A', tiers: [{ min: 1, price: 30000 }, { min: 5, price: 28000 }], moq: 2, qty: 2 },
    cup: { name: '종이컵 6.5oz', short: '종이컵', spec: '1,000개/박스', partner: 'B', tiers: [{ min: 1, price: 21000 }, { min: 20, price: 20000 }, { min: 50, price: 19000 }], moq: 10, qty: 25, was: 19000 },
  };
  /* 결제 때 주문 항목 스냅샷에 남기는 상세 설명 버전(P-PRD-09 · U-PDP-07 · U-MY-01). nowVer는 주문 뒤 판매자가 고친 예시 */
  const DET_SNAP = {
    spoon: { ver: 2, nowVer: 3, imgs: 3, text: '크라프트지 40g 수저집이에요. 1박스에 1,000매가 들어 있고 식품용 기구 시험성적서를 갖췄어요. 숟가락·젓가락이 함께 들어가는 40×240mm 규격이에요.' },
    pick: { ver: 2, nowVer: 3, imgs: 3, text: '수저집 크라프트 상세에 함께 실린 추가 구성품이에요. 개별 포장 이쑤시개 1,000개가 1봉에 들어 있어요.' },
    napkin: { ver: 1, nowVer: 1, imgs: 2, text: '형광증백제를 쓰지 않은 2겹 냅킨이에요. 1박스 3,000매, 23×23cm 규격이에요.' },
    cup: { ver: 3, nowVer: 3, imgs: 4, text: '무형광 원지로 만든 6.5oz 종이컵이에요. 1박스 1,000개, 뜨거운 음료에도 쓸 수 있어요.' },
  };
  const HQ_COUPONS = [
    { key: 'cart10', name: '장바구니 10%', type: 'rate', value: 10, max: 10000, minOrder: 100000, desc: '최대 10,000원 · 10만원 이상' },
    { key: 'first5', name: '첫 주문 5,000원', type: 'amount', value: 5000, minOrder: 30000, desc: '3만원 이상' },
  ];
  /* 쿠폰함의 디자인비 쿠폰(D21 · A-MKT-01): 디자인비에만 걸림. 일반 상품 주문에는 쓸 곳이 없어 쿠폰함에 남음 */
  const DESIGN_COUPON = { name: '첫 디자인 무료', type: 'free', desc: '맞춤 디자인비 1건 무료' };
  const P_COUPON = { name: '냅킨 5,000원', type: 'amount', value: 5000, minOrder: 50000, itemIds: ['napkin'] };
  const POINTS = 2000;
  const UW = (b) => (PROD[b] && PROD[b].u) || '박스';
  const isAddon = (b) => !!(PROD[b] && PROD[b].addonOf);
  /* 조사: 받침 있으면 a, 없으면 b (로/으로는 ㄹ 받침도 '로') */
  const jong = (w) => { const c = String(w).charCodeAt(String(w).length - 1) - 0xAC00; return c >= 0 && c <= 11171 ? c % 28 : 0; };
  const ro = (w) => `${w}${jong(w) && jong(w) !== 8 ? '으로' : '로'}`;
  const iga = (w) => `${w}${jong(w) ? '이' : '가'}`;
  const wa = (w) => `${w}${jong(w) ? '과' : '와'}`;
  const eul = (w) => `${w}${jong(w) ? '을' : '를'}`;
  const eun = (w) => `${w}${jong(w) ? '은' : '는'}`;

  /* ── 시작 장면: 기본(명세서 예시) · 추가 구성품 · 제작 판매자 변경(싼 상품 / 비싼 상품) ── */
  let scenario = 'base';
  const SCN = {
    base: { t: '기본 주문', tag: '명세서 예시', d: '장바구니부터 · 카드·가상계좌 결제, 부분 취소(낸 금액 그대로 · 구간 단가가 바뀌면 막힘), 반품, 취소 거부 이의 제기(출고 뒤 인정되면 회수 뒤 환불)' },

  const scnBox = document.createElement('section');

  function itemOf(b, qty) { const p = PROD[b]; return { id: b, name: p.name, partnerId: p.partner, shipKey: p.partner + '-일반', qty, unit: p.spec, tiers: p.tiers, instant: p.instant, addonOf: p.addonOf }; }

  const selBases = () => Object.keys(PROD).filter(inCart);
  const baseInput = () => ({ items: selBases().map((b) => itemOf(b, S().cart[b].qty)), shipping: shippingTpl() });
  const shipCoupon = () => ({ name: '멤버십 무료배송', max: P('membership.free_ship_max'), minOrder: P('membership.free_ship_min_order') });

  const recById = (id) => S().recs.find((r) => r.id === id);
  const isActive = (r) => !CLOSED.includes(r.st);
  const activeQty = (b) => S().recs.filter((r) => r.base === b && isActive(r)).reduce((a, r) => a + r.qty, 0);
  const totalActive = () => S().recs.filter(isActive).reduce((a, r) => a + r.qty, 0);
  const bal = () => { const o = S().order; return { pg: o.paid.pg - o.refunded.pg, points: o.paid.points - o.refunded.points }; };

  function splitRec(rec, k) {

  /* ── 환불 계산(C-PAY-02 · 2026-10-16 D53): 취소·반품하는 항목에 낸 금액(결제 스냅샷의 줄 결제 금액) 그대로.

  /** 결제 시점 스냅샷(결제 때 수량 그대로) */

  /** 이미 취소·반품한 수량(상품별) = 결제 때 수량 − 아직 살아 있는 수량 */
  function goneQty() { const o = S().order; const m = {}; Object.keys(o.origQty).forEach((b) => { const g = o.origQty[b] - activeQty(b); if (g > 0) m[b] = g; }); return m; }
  /** cancel = { base: 수량 } — 본 상품과 함께 취소되는 추가 구성품도 같이 넣음.
   *  mode: before_ship(출고 전 — 남은 수량의 구간 단가가 바뀌면 막음, 배송 묶음 전부 취소면 배송비 환불) | return(반품 — 막지 않음)
   *  deduction = 고객 부담 반품 배송비(환불액보다 크면 refund 0 + shortfall 추가 결제)
   *  fault = 반품이 파트너 귀책(불량·오배송·늦게 받음 · 출고 뒤 취소 이의 인정)인지 — 묶음에 남는 항목이 없게 되면 처음 낸 배송비를 돌려줌(D70)
   *  keptBefore = 앞선 취소·반품에서 돌려주지 않고 남긴 금액(결과 kept의 누적, 주문 기록 o.kept) — 마지막 건의 잔액 정리에서 다시 돌려주지 않게(D70) */
  function refundCalc(cancel, mode = 'before_ship', deduction = 0, fault = false) {
    const o = S().order;
    const list = Object.entries(cancel).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
    return GC.refund.partialCancel({ input: snapInput(), paid: o.paid, refunded: o.refunded, cancel: list, alreadyCanceled: goneQty(), deduction, mode, fault, keptBefore: o.kept || 0 });
  }
  /** 본 상품을 이 수량만큼 취소하면 같이 가는 추가 구성품(GC.order.addonCascade · C-STATE-01 · 2026-10-16 D39).
   *  엔진이 본 상품의 남은 수량(qty − canceledQty)과 취소 수량을 비교: 일부만 취소하면 그대로(partialParents),
   *  남은 수량이 모두 빠질 때만 출고 전 구성품은 함께 취소(recs) · 이미 출고된 구성품은 같은 취소 클레임으로 함께 회수·환불(ret).
   *  구매 확정된 구성품은 끝난 항목이라 넣지 않음 */
  function cascadeOf(base, qty) {
    const none = { recs: [], ret: [] };
    if (isAddon(base)) return none;
    const kids = S().recs.filter((r) => isActive(r) && r.st !== 'CONFIRMED' && PROD[r.base].addonOf === base);
    if (!kids.length) return none;
    const shipped = kids.filter((k) => ['SHIPPED', 'DELIVERED'].includes(k.st)).map((k) => k.id);
    const out = GC.order.addonCascade([{ id: base, qty: activeQty(base) }, ...kids.map((k) => ({ id: k.id, addonOf: base }))], [{ id: base, qty }], shipped);
    return { recs: out.cascade.map(recById), ret: out.toReturn.map(recById) };
  }
  /** 환불 계산에 넣을 수량: 본 상품 + 함께 취소되는 구성품. withRet = 출고된 구성품도(출고 뒤 취소 이의 인정의 같은 회수, D39) */
  function cancelMap(base, qty, casc, withRet = false) {
    const m = { [base]: qty };
    [...casc.recs, ...(withRet ? casc.ret : [])].forEach((k) => { m[k.base] = (m[k.base] || 0) + k.qty; });
    return m;
  }
  const kidsText = (list) => list.map((k) => `${PROD[k.base].name} ${k.qty}${UW(k.base)}`).join(' · ');
  /** 열린 취소 클레임에 함께 들어 있는 붙은 구성품(본 상품의 남은 수량 전부를 취소 요청한 경우). 클레임이 열린 동안 구매 확정·자동 확정에서 빠짐 */
  function creqKids() {
    const c = S().creq; if (!c || !creqOpen()) return [];
    const rec = recById(c.recId); const k = cascadeOf(rec.base, rec.qty);
    return [...k.recs, ...k.ret];
  }
  const inCreq = (rec) => { const c = S().creq; return !!(c && creqOpen() && (c.recId === rec.id || creqKids().includes(rec))); };
  /** 취소 인정(회수) 건의 환불: 본 상품 + 같은 상자로 간 붙은 구성품에 낸 금액(D53 · 회수 배송비는 판매자 부담이라 공제 없음).
   *  요청 뒤에 보낸 판매자 귀책이라 fault — 이 회수로 묶음이 비면 처음 낸 배송비도 돌려줌(출고 전 전부 취소와 같게, D70 판단) */
  function wonRefund(rec) { const casc = cascadeOf(rec.base, rec.qty); return { casc, kids: [...casc.ret, ...casc.recs], x: refundCalc(cancelMap(rec.base, rec.qty, casc, true), 'return', 0, true) }; }
  /** 고객이 실제로 낸 몫(결제 스냅샷의 줄 결제 금액을 수량 비율로, 원 단위 내림) */
  function paidShare(base, qty) { const o = S().order; const l = o.calc.lines.find((x) => x.id === base); return Math.floor((GC.refund.linePaid(l) * qty) / o.origQty[base]); }
  /** 판매자 품절 취소: 일반 취소와 같은 '낸 금액 그대로'(D53). 판매자 사정이라 구간 단가가 바뀌는 수량이어도 막지 않음 */
  function faultRefund(map) { const r = refundCalc(map, 'before_ship'); return r.blocked ? refundCalc(map, 'return', 0, true) : r; }
  /** 이 반품으로 판매자 배송 묶음에 남는 항목이 없게 되는지(구매 확정된 항목도 남은 것으로 셈 — D70) */

  function settleFor(pid) {
    const o = S().order; let sale = 0; let disc = 0;
    o.calc.lines.filter((l) => l.partnerId === pid).forEach((l) => { const q = activeQty(l.id); sale += l.unitPrice * q; disc += Math.round(((l.instantDisc + l.partnerCouponDisc) * q) / l.qty); });
    const sl = o.calc.shippingLines.find((x) => x.shipKey === pid + '-일반');
    const ship = sale > 0 && sl ? sl.base : 0;
    /* '중재 판정' 정산 이벤트(−): 판매자 거부가 중재에서 뒤집혀 늦어진 환불의 지연배상금(C-STL-01 · D57) */
    const med = o.medEv.filter((e) => e.pid === pid).reduce((a, e) => a + e.amt, 0);
    /* ‘클레임 완료’ 정산 이벤트(+): 고객 부담 반품 배송비 · 고객 사정으로 묶음을 모두 반품해 돌려주지 않은 처음 배송비(D70 — 구매 확정 이벤트에 붙지 못하므로) */
    const claims = (o.claimEv || []).filter((e) => e.pid === pid);
    const claimSum = claims.reduce((a, e) => a + e.amt, 0);
    return { sale, disc, ship, ev: GC.settle.confirmEvent({ sale, partnerDisc: disc, rate: P('commission.default_rate'), shipping: ship }), med, claims, claimSum };
  }

    /* 취소 거부 이의 중재(C-STATE-02 이의 제기·중재 줄 · A-ORD-02). 결과는 최종 */
    async mediateCancel(b) {

        if (rec.st === 'DELIVERED') startCancelCollect();
      } else {
        const wk = creqKids();
        if (!goClaim('cancel', 'mediation_partner', '본사 중재 · 판매자 거부 유지(최종)', c, [rec, ...wk])) return;
        c.done = 'kept'; c.kidsBack = kidsText(wk);
        app.log('rule', `거부 확정 → 클레임이 닫혀 이 항목${wk.length ? `과 붙은 ${esc(c.kidsBack)}` : ''}도 자동 구매 확정 대상으로 돌아가요(원래 흐름, D52). 받은 상품은 일반 반품 절차(U-MY-03)로만 돌려보낼 수 있어요`);
      }

  /** 일괄 공지 시작·끝 알림(D72): 범위에 드는 진행 중 주문(송장 전)이 있는 고객 · 그 판매자 주문 담당자 */
  function noticeNotify(phase) {

  /** 거부가 확정된 반품 물건(D56 · D71, 법률 자문 전 초안): 고객이 claim.return_back_pay_days 안에 [되돌려 받기](되돌림 배송비 따로 결제 → 파트너가 claim.return_back_ship_bd 안에 송장)
   *  또는 [폐기]를 고름. 고르지 않으면 3일 전 다시 알리고 기한이 지나면 폐기로 봄. 중재에서 파트너 귀책(partnerPays)이면 결제 없이 보냄.
   *  그 수량은 고객이 가진 것으로 보고 원래 흐름(구매 확정·정산)으로 */
  function rejectedBack(r, partnerPays = false) {
    const rec = recById(r.recId); const u = UW(rec.base); const pa = PARTNERS[rec.pid]; const q = `${PROD[rec.base].short} ${r.qty}${u}`;
    const at = now(); const due = new Date(at.getTime() + P('claim.return_back_pay_days') * DAY);
    r.rb = { at, due, remindAt: new Date(due.getTime() - LOCAL.rbRemind.v * DAY), reminded: false, fee: pa.retFee, choice: partnerPays ? 'send' : null, by: partnerPays ? 'partner' : null, paidAt: null, shipDue: partnerPays ? GC.addBusinessDays(at, P('claim.return_back_ship_bd')) : null, shippedAt: null, disposedAt: null };
    app.log('rule', '거부된 수량은 고객이 가진 것으로 보고 원래 흐름(구매 확정·정산)으로 돌아가요 · 반품 배송비는 일부 승인 때 한 번만 뺐어요(다시 빼지 않음)');
    if (partnerPays) {
      app.log('rule', `거부 확정(중재 · 귀책 파트너) → ${eul(q)} 판매자 부담으로 되돌려 보내요(고객 결제 없음) · 송장 기한 ${fmtDate(r.rb.shipDue)}(claim.return_back_ship_bd)`);
      nt('NOTI_PARTNER_RETURN_BACK', pa.name, `거부한 ${esc(q)} 되돌려 보내기 · 중재 판정으로 배송비 판매자 부담 · ${fmtDate(r.rb.shipDue)}까지 송장 등록`);
    } else {
      app.log('rule', `거부 확정 → 고객이 ${fmtDate(due)}까지 [되돌려 받기](배송비 ${won(pa.retFee)} 따로 결제) 또는 [폐기]를 골라요 · 고르지 않으면 ${LOCAL.rbRemind.v}일 전 다시 알리고 기한이 지나면 폐기로 봐요(claim.return_back_pay_days · D71, 법률 자문 전 초안)`);
      nt('NOTI_RETURN_BACK_DUE', '고객', `거부 확정 · ${esc(q)} [되돌려 받기](배송비 ${won(pa.retFee)}) 또는 [폐기]를 ${fmtDate(due)}까지 골라 주세요 · 지나면 판매자가 폐기해요`);
    }
  }
  /** 출고 뒤 취소 이의 인정(D23 · 2026-10-16 D39): 회수 확인 → 파트너 검수 없이 그 항목에 낸 금액(D53) 환불
   *  → 주문 항목 DELIVERED → RETURNED(ORDER cancel_objection_return) · 클레임 CANCEL_APPROVED → 완료(collected_refund, 결과 REFUNDED)
   *  같은 송장으로 간 붙은 추가 구성품은 같은 취소 클레임으로 함께 회수(회수 배송비 한 번) → ORDER parent_collected(DELIVERED → RETURNED), 환불액에 구성품 결제 몫 포함 */
  async function cancelWonRefund() {
    const s = S(); const c = s.creq; const rec = recById(c.recId); const short = PROD[rec.base].short;
    const { casc, kids, x } = wonRefund(rec); const kt = kidsText(kids);
    await app.ext({ service: '스윗트래커', what: '회수 택배 도착 확인', lines: ['회수 송장으로 판매자 도착을 확인해요', '본사가 취소를 인정한 건이라 판매자 검수 없이 환불해요', ...(kids.length ? [`같은 상자로 간 붙은 추가 구성품(${esc(kt)})도 같은 회수에 들어 있어요 · 회수 배송비는 한 번`] : [])] });
    app.clock.pass(30 * HOUR);
    const back = couponBack(x);
    logRefundCalc(x);
    await payRefund(x, `${short} 취소 인정(본사 중재) · 회수 뒤 환불${kids.length ? ` + 붙은 ${kt}` : ''}`, ['회수 배송비는 판매자 부담(한 번)', '판매자 검수 없이 환불(취소 클레임 그대로)', `회수 완료 때 환불 기한(+ 영업일 ${P('claim.refund_due_bd')}일)을 저장하고 바로 환불해 지연배상금 없음`]);
    move(rec, 'cancel_objection_return', '취소 이의 인정 · 플랫폼 회수 완료 · 판매자 검수 없음');
    casc.ret.forEach((k) => { move(k, 'parent_collected', `${short} 취소 이의 인정 · 같은 회수로 함께 · 검수 없음`); k.viaCancel = true; k.refundNote = `${wa(short)} 함께 회수 · 환불 ${won(x.refund)}에 포함`; });
    casc.recs.forEach((k) => { move(k, 'parent_canceled', `${short} 취소 인정으로 함께 취소(출고 전)`); k.refundNote = `${wa(short)} 함께 취소 · 환불 ${won(x.refund)}에 포함`; });
    if (kids.length) { rec.refundIncl = `붙은 ${kt} 포함`; app.log('rule', `붙은 추가 구성품 ${esc(kt)}도 같은 취소 클레임으로 함께 회수해 검수 없이 환불했어요 · 따로 반품하지 않고 자동 구매 확정에서도 빠져요(D39)`); }
    rec.refunded = x.refund; rec.viaCancel = true;
    restoreCoupons(back);
    goClaim('cancel', 'collected_refund', '회수 완료 뒤 환불', c, [rec, ...kids]);
    Object.assign(c, { done: 'refunded', refund: x.refund, collect: null, kidsTxt: kids.length ? kt : '' });
    refresh();
  }

  async function approveCancelCore(auto) {
    const s = S(); const c = s.creq; const rec = recById(c.recId);
    const casc = cascadeOf(rec.base, rec.qty);
    const r = refundCalc(cancelMap(rec.base, rec.qty, casc));
    const by = auto ? `영업일 ${P('claim.cancel_auto_approve_bd')}일 미처리 → 자동 승인` : '판매자 취소 승인';
    if (r.blocked) { app.log('warn', '남은 수량의 구간 단가가 바뀌는 출고 전 부분 취소라 승인할 수 없어요 → 전체 취소 후 재주문 안내(D53)'); return; }
    const back = couponBack(r);
    app.go('cancel', auto ? 'auto_approve' : 'approve', { by });
    move(rec, 'cancel_approved', by);
    cascadeApply(casc, rec, r);
    logRefundCalc(r);
    if (auto) { refundApply(r, '취소 요청 자동 승인', true); nt('NOTI_PARTNER_CLAIM_AUTO_APPROVED', PARTNERS[rec.pid].name, '취소 요청 자동 승인 · 평가 기록'); }
    else await payRefund(r, `${PROD[rec.base].short} 취소 요청 승인`);
    rec.refunded = r.refund;
    goClaim('cancel', 'refund', '환불 완료', c, [rec, ...casc.recs]);
    restoreCoupons(back);
    s.creq = null;
    if (!auto) refresh();
  }
  /** 반품 승인 → 환불(D53: 반품한 수량에 낸 금액 − 고객 부담 반품 배송비, 모자라면 추가 결제).
   *  viaMediation = 판매자 거부가 중재에서 뒤집힌 건 → 환불 기한을 넘겼으면 지연배상금을 판매자가 부담(D57). 자동 승인은 배치가 검수 기한에 돈 것으로 봄 */
  async function approveReturnCore(by, silent, viaMediation = false) {
    const s = S(); const r = s.ret; const rec = recById(r.recId);
    const x = returnRefund(rec.base, rec.qty, r.fault, rec.pid, r.feeTaken);
    if (by) app.go('claim', 'approve', { by });
    const back = couponBack(x);
    logRefundCalc(x);
    const label = `${PROD[rec.base].short} 반품 환불 · ${REASON[r.reason].label}${r.partial ? ` · 거부했던 ${r.qty}${UW(rec.base)}` : ''}`;
    if (x.shortfall) { noteKept(x); app.log('money', `환불 0원 · 반품 배송비 ${won(x.deduction)}이 반품한 수량에 낸 금액보다 커서 모자란 ${won(x.shortfall)}은 고객이 추가 결제해요(D53 · 혜택 포기 동의 없음)`); }
    else if (silent) refundApply(x, `${label}(검수 기한 초과 자동 승인)`, true);
    else await payRefund(x, label, [x.feeBy === 'partner' ? '반품 배송비는 판매자 부담' : x.deduction ? `반품 배송비 ${won(x.deduction)}을 환불액에서 뺐어요` : '반품 배송비는 승인 수량 환불에서 이미 뺐어요']);
    restoreCoupons(back);
    goClaim('claim', 'refund', '환불 완료', r, [rec]);
    move(rec, rec.st === 'CONFIRMED' ? 'defect_return_done' : 'return_done', '반품 완료');
    if (rec.st === 'RETURNED') rec.refunded = x.refund;
    r.done = 'refunded'; r.paidOut = x;
    const doneAt = silent ? r.inspectDue : now();
    if (r.refundDue && x.refund && doneAt > r.refundDue) r.comp = await payDelayComp({ amount: x.refund, dueAt: r.refundDue, doneAt, pid: rec.pid, burden: viaMediation ? 'partner' : 'hq', label });
  }

  /* ════════ 제작 판매자 변경(D33 · A-ORD-01 · U-MY-01 · C-PAY-02 예외 · C-STATE-01·03 · C-NOTI-01) ════════

      if (r.st !== 'DELIVERED' || !r.deliveredAt || hasOpenClaim(r)) return;
      const due = r.deliveredAt.getTime() + days * DAY;
      if (t.getTime() >= due - DAY && t.getTime() < due && !s.fired['cd' + r.pid]) { s.fired['cd' + r.pid] = true; nt('NOTI_CONFIRM_DUE', '고객', '내일 자동 구매 확정'); }
      if (t.getTime() >= due) { move(r, 'confirm', `자동 구매 확정 배치 · 확정 시각 ${fmtDate(new Date(due))}(배송 완료 + ${days}일)`); app.log('money', `정산 이벤트: ${esc(recLabel(r))} 구매 확정 → ${PARTNERS[r.pid].name} 다음 주 정산 대상`); }
    });
    syncStrip(); guide();
  });
})();
