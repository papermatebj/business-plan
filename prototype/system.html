  .acct .who { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
  .seg-sm button { padding: 5px 10px; font-size: 12.5px; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: thin; }
  .subtabs button { flex: none; border: 0; background: none; padding: 8px 12px; font-size: 14px; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .code { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
  .diff { color: var(--warn); font-size: 12px; }
  .chg { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rbac th.sym, .rbac td.sym, .mx th.sym, .mx td.sym { text-align: center; padding-inline: 4px; }
  .rbac td.sym { width: 50px; }
  .rbac .on { background: var(--spot-weak); }
  .rbac th.on { color: var(--ink); }
  .pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .pipe span { font-size: 12px; text-align: center; padding: 6px 2px 0; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .pipe span.done { border-color: var(--kraft); color: var(--ink-2); }
  .pipe span.now { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .pipe span.bad { border-color: var(--stop); color: var(--stop); font-weight: 600; }
  .sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .nw { white-space: nowrap; }
  .tbl td.act { width: 1%; white-space: nowrap; }
  .inbox .li { grid-template-columns: 10px minmax(0, 1fr); align-items: start; cursor: pointer; }
  .inbox .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--spot); margin-top: 7px; }
  .inbox .dot.read { background: transparent; }
  .inbox .t { font-weight: 600; display: block; }
  .inbox .b { display: block; font-size: 12.5px; color: var(--ink-2); }
  .flag { color: var(--stop); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .file-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

  .tbl td.tv { text-align: right; min-width: 7em; }
  .pol td:first-child { min-width: 9em; }
  .tbl td.tv .code { text-align: right; }

  function pipeHtml(fst) {
    const steps = [['UPLOADING', '업로드'], ['SCANNING', '검사 중'], ['CONVERTING', '격리 변환'], ['READY', '사용 가능']];
    const idx = { UPLOADING: 0, SCANNING: 1, RESCANNING: 1, CONVERTING: 2, READY: 3, QUARANTINED: 1, UNSCANNABLE: 1, SCAN_FAILED: 1, NO_PREVIEW: 2 }[fst];
    return `<div class="pipe">${steps.map(([k, t], i) => {
      let cls = i < idx ? 'done' : i === idx ? 'now' : '';
      let label = t;
      if (fst === 'RESCANNING' && i === 1) label = '재검사 중';
      if (fst === 'QUARANTINED' && i === 1) { cls = 'bad'; label = '악성코드 → 격리'; }
      if (fst === 'UNSCANNABLE' && i === 1) { cls = 'bad'; label = '검사 불가 → 격리'; }
      if (fst === 'SCAN_FAILED' && i === 1) { cls = 'bad'; label = '재검사 실패 → 격리'; }
      if (fst === 'NO_PREVIEW' && i === 2) { cls = 'bad'; label = '미리보기 없음'; }
      if (fst === 'READY' && i === 3) cls = 'done';
      return `<span class="${cls}">${label}</span>`;
    }).join('')}</div>`;
  }
  const QUAR = ['QUARANTINED', 'UNSCANNABLE', 'SCAN_FAILED'];
  function openText(fst) {
    if (fst === 'READY') return `권한 확인 뒤 ${ppv(K.PRESIGN_DOWN + '분', '다운로드 서명 주소 유효')}짜리 서명 주소로만 · files.sikup.co.kr · attachment`;

    },
    acctEdit() { block(`정산 계좌는 어떤 역할도 관리자 화면에서 고칠 수 없어요. 파트너가 본인 인증 후 바꾸고 첫 지급은 ${GC.Policy.get('settlement.account_change_hold_hours')}시간 보류해요`, '정산 계좌 수정', '대성포장'); refresh(); },

          else { deliver(r.ev, r.send, r.at); if (r.sms) { g.sms = true; app.log('ext', '솔라피 · 알림톡 실패 → SMS 대체 발송'); } }

    umReason(b) { const s = S(); s.umReason = b.dataset.t; s.umErr = null; refresh(); },
    unmask(b) {
      const s = S(); if (guardLock()) return;

      if (level('마스킹 해제(사유 입력)') === '—' || !grant('unmask')) { block(`${who()} 계정에는 마스킹 해제 권한이 없어요`, '마스킹 해제', mem.id); refresh(); return; }
      if (!s.umReason) { s.umErr = '해제 사유를 먼저 골라 주세요. 사유 없이는 가림을 풀 수 없어요.'; app.toast('해제 사유를 골라 주세요'); refresh(); return; }

    piiDown() {

      app.log('rule', '엑셀 생성 · 파일 암호 설정 · 개인정보 열 기본 가림 · 다운로드 사유·기록 저장');

    },
    lookup20() {

      app.clock.pass(4 * 60000);

      audit('회원 상세 조회', '회원 20명', '', '', '업무 조회(시연)', n >= K.PII_MAX * 0.6 ? '조회 몰림 주의' : '');
      app.log('user', `${esc(who())} 회원 상세 20건 조회 · 최근 1시간 ${n}건`);

        app.log('warn', `${esc(who())} 1시간 ${n}건 조회 → 계정 잠금`);
        app.notify('NOTI_INT_PII_ACCESS_LOCKED', '보안 담당', ['이메일', '관리자 알림센터', 'Slack'], `${esc(ACCT[s.role].name)} 계정 1시간 ${n}건 조회 → 잠금`);
      }

    },
    unlock(b) {
      const s = S(); const r = b.dataset.r;
      if (s.role !== '최고관리자') { block('잠긴 계정은 최고관리자만 풀 수 있어요', '계정 잠금 해제', ACCT[r].name); refresh(); return; }
      s.locked[r] = false; s.lookups[r] = []; s.unlockDone = true;
      audit('계정 잠금 해제', who(r), '잠김', '사용 중', '본인 확인 · 업무상 조회로 확인');

    },
    auditDel() { block('감사 로그는 쓰고 나면 고칠 수 없는 저장소에 있어 최고관리자도 지우거나 고칠 수 없어요', '감사 로그 삭제', '감사 로그'); refresh(); },
    async fileUp(b) {
      const s = S(); if (guardLock()) return;
      const fst = app.state('file');
      if (['SCANNING', 'RESCANNING', 'CONVERTING'].includes(fst)) { app.toast('처리 중인 파일이 끝나면 올릴 수 있어요'); return; }
      const smp = FILES.find((x) => x.id === b.dataset.id); const big = smp.size > smp.limit;
      await app.ext({ service: 'AWS S3', what: `${smp.name} 업로드 주소 발급`, lines: [`서버가 권한·형식을 확인하고 ${K.PRESIGN_UP}분짜리 presigned POST를 줘요`, `크기 조건 content-length-range ${smp.limit}MB 이하 (${esc(smp.kind)})`, '파일 이름은 무작위 키로 바꿔 저장하고, 원래 이름은 표시용으로만 둬요'], result: big ? 'S3가 크기 조건으로 거부한 것으로 처리해요' : '업로드가 끝난 것으로 처리해요' });
      const rec = { ...smp, at: app.clock.now(), key: storeKey(smp.name), result: '' };
      if (big) {
        rec.result = '업로드 거부(크기 초과)'; s.files.unshift(rec);
        app.log('warn', `${esc(smp.name)} ${smp.size}MB · 한도 ${smp.limit}MB를 넘어 S3가 업로드를 거부했어요(서버까지 오지 않음)`);

      rec.result = '검사 중'; rec.scanAt = app.clock.now(); rec.tries = 0; rec.trail = [];
      app.log('rule', `검사 시작 · ${GC.Policy.get('file.scan_timeout_minutes')}분 안에 결과가 없으면 실패로 보고 한 번 다시 검사해요 · 그동안 이 파일을 기다리는 디자인 SLA는 멈춰요`);

    },
    async fileScan() {
      const s = S(); const f = s.file; const fst = app.state('file'); if (!f || !['SCANNING', 'RESCANNING'].includes(fst)) return;
      const re = fst === 'RESCANNING';
      const res = { malware: '악성코드가 발견된 것으로 처리해요', unscannable: '암호가 걸려 검사할 수 없다는 결과로 처리해요', error: re ? '재검사도 검사 엔진 오류로 끝난 것으로 처리해요' : '검사 엔진 오류(결과 없음)로 처리해요' }[f.outcome] || '깨끗한 것으로 처리해요';
      await app.ext({ service: 'AWS GuardDuty', what: `S3 악성코드 ${re ? '재검사' : '검사'} 결과`, lines: [`${esc(f.name)} · 업로드 버킷에서 검사`, '결과는 통과·발견·검사 불가·실패 넷 중 하나예요. 통과가 아니면 누구에게도 다운로드 주소를 주지 않아요'], result: res });
      app.clock.pass(3 * 60000);
      if (app.state('file') !== fst) { refresh(); return; } // 기다리는 사이 시간 초과로 이미 넘어감
      if (f.outcome === 'malware') {
        app.go('file', 'malware', { by: 'GuardDuty: 악성코드 발견' }); f.result = '격리'; s.fileQuar = true;
        app.log('rule', '파일을 격리 영역으로 옮기고 다운로드 주소를 막았어요 · 미리보기 변환도 하지 않아요');
        app.notify('C-NOTI-01 표에 코드 없음', '올린 사람', ['알림센터', '이메일'], `${esc(f.name)}에서 악성코드가 발견돼 격리했어요. 다시 올려 주세요`);
      } else if (f.outcome === 'unscannable') {
        app.go('file', 'unscannable', { by: 'GuardDuty: 검사 불가(암호 걸린 PDF)' }); f.result = '검사 불가 · 격리'; s.fileLock = true;
        app.log('rule', "'발견이 아니면 통과'로 보지 않아요 → 격리 · 다운로드 주소 막음 · 디자인 SLA는 고객 대기로");
        app.notify('C-NOTI-01 표에 코드 없음', '올린 사람', ['알림센터', '이메일'], `${esc(f.name)} 파일은 암호가 걸려 검사할 수 없어요. 암호를 풀거나 나눠서 다시 올려 주세요`);

        app.log('rule', 'convert 작업에는 이 파일 읽기 주소 1개와 결과 쓰기 주소만 넘겨요 · DB·Redis·PG 키·S3 권한 없음');

  /* 검사 실패·시간 초과(C-FILE-01): 첫 실패는 자동 재검사 1회, 재검사도 실패면 격리 + 운영 알림 */
  const scanDeadline = (f) => new Date(f.scanAt.getTime() + GC.Policy.get('file.scan_timeout_minutes') * 60000);
  function scanError(why) {
    const s = S(); const f = s.file; const t = app.clock.now();
    f.tries += 1; f.trail.push(`${GC.fmtTime(t)} ${f.tries === 1 ? '검사' : '재검사'} ${why}`);
    if (app.state('file') === 'SCANNING') {
      app.go('file', 'scan_error', { by: `${why} → 자동 재검사 1회` });
      f.scanAt = t; f.result = '재검사 중';
      app.log('rule', `${why} → 한 번 다시 검사해요 · 아직 아무도 못 열고, 디자인 SLA도 계속 멈춰 있어요`);
      return;
    }
    app.go('file', 'scan_error', { by: `재검사도 ${why}` });
    f.result = '검사 실패 · 격리'; s.fileFail = true;
    app.log('warn', `재검사도 ${why} → 격리한 채 운영 확인 · 올린 사람에게는 '확인 중'으로 보여요`);
    app.notify('NOTI_INT_FILE_SCAN_FAILED', '개발 · 운영팀', ['이메일', '관리자 알림센터', 'Slack'], `${esc(f.name)} · 재검사 뒤에도 검사 실패 → 격리`);
  }
  function approveBlock(c) {
    const s = S();
    if (c.high) return s.role === '최고관리자' ? null : `영향이 큰 값(${meta(c.key).label})이라 최고관리자만 승인할 수 있어요. 지금 계정: ${who()}`;
    if (s.role === '최고관리자') return null;
    const lv = level(GROUP_ROW[meta(c.key).group]);
    if (lv === '●' || (lv === '◐' && s.lead[s.role])) return null;
    return lv === '◐' ? '승인은 팀장 플래그가 켜진 계정만 할 수 있어요' : `${who()} 계정은 이 정책값을 승인할 권한이 없어요`;
  }
  function postNotice(c) {
    const s = S(); const toPartner = /^(commission|partner|settlement)\./.test(c.key);
    const body = `${fmtDate(c.startAt, false)}부터 ${fmtV(c.key, c.from)} → ${fmtV(c.key, c.to)}`;
    if (!toPartner) s.inbox.unshift({ tab: '공지', title: `${meta(c.key).label} 변경 안내`, body, at: app.clock.now(), read: false });
    c.noticed = `${toPartner ? '파트너 센터' : '고객 알림 센터'} 공지를 게시했어요.`;
    app.log('rule', `공지 자동 게시(A-MKT-04) · 대상 ${toPartner ? '파트너' : '고객'} · ${esc(meta(c.key).label)} ${body}`);
  }
  function applyChange(by, at) {
    const s = S(); const c = s.change;
    GC.Policy.set(c.key, c.to);
    c.appliedAt = new Date(at || app.clock.now());
    app.go('policy', 'apply', { by });
    s.appliedOnce = true;
    pushHist(c, '적용');
    audit('정책값 적용', c.key, fmtV(c.key, c.from), fmtV(c.key, c.to), `${c.id} ${by}`, '', '예약 적용(batch)');
    app.log('rule', `${esc(meta(c.key).label)} ${fmtV(c.key, c.from)} → <b>${fmtV(c.key, c.to)}</b> · 이 브라우저(localStorage)에 저장돼 다른 화면 계산에 바로 쓰여요`);
    app.toast('다른 화면에 바로 반영돼요');
  }

  /* ── 시간이 흐를 때: 예약 적용 · 08시 발송 · 다시 가림 ── */
  app.onAdvance((prev, now) => {
    const s = S(); const c = s.change;
    if (c && app.state('policy') === 'SCHEDULED' && now >= c.startAt) applyChange(`${fmtDate(c.startAt)} 예약 배치`, c.startAt);
    const due = s.queue.filter((q) => q.sendAt <= now);
    if (due.length) { due.forEach((q) => deliver(q.ev, q.send, q.sendAt)); s.queue = s.queue.filter((q) => q.sendAt > now); app.log('rule', `08:00 예약 큐 ${due.length}건 발송`); }
    if (s.unmask && now - prev >= GC.HOUR) { s.unmask = null; app.log('rule', '마스킹 해제 화면을 벗어나 다시 가렸어요'); }
    /* 검사 시간 초과: 정해진 시간 안에 결과가 없으면 감시 배치가 실패로 보고 그때 재검사를 시작 → 재검사도 넘기면 격리 */
    if (s.file && ['SCANNING', 'RESCANNING'].includes(app.state('file')) && now >= scanDeadline(s.file)) {
      scanError(`시간 초과(${GC.Policy.get('file.scan_timeout_minutes')}분 안에 결과 없음)`);
    }
    guide();
  });
})();
</script>
