  const catKinds = (s) => CATS.filter((c) => s.cats[c.k]).map((c) => c.kind);

  function ratePreview() {

    const base = r.exc || cat;
    const payAt = r.when === 'later' ? addMonths(app.clock.now(), 4) : app.clock.now();

      }
      s.round += 1; s.appNo = `PA-${String(now.getFullYear()).slice(2)}${String(now.getMonth() + 1).padStart(2, '0')}-00${40 + s.round}`;
      Object.assign(s, { step: 2, nts: null, ntsSim: 'ok', sup: null, supSel: {}, docChk: {}, md: null, agree: {}, submittedAt: null, sampleReqAt: null, sampleAt: null, sampleHold: false, sampleEval: {}, rejected: null, rejectedFrom: null, draftAt: now, trail: [] });
      app.setState('app', 'DRAFT', { by: `재신청 · 새 신청서 ${s.appNo}(이전 입력값 불러옴)` });
      refresh();
    },
  });

  /* ── 파트너 주문 도우미 ── */
  const findOrder = (id) => S().orders.find((o) => o.id === id);
  function orderGo(o, ev, by) {
    const to = GC.sm.next(omc(o), o.st, ev);
    app.log('state', `주문 ${o.id}: ${stLabel(o)} → ${GC.sm.stateName(omc(o), to)} · ${by}`);
    o.st = to;
  }
  /* 정지·계약 종료 뒤 남은 주문이 모두 배송 완료되면 고객 정보를 바로 가림(한 번만 기록) */
  function checkMask() {
    const s = S(); const ac = app.state('acct');
    if (!RESTRICTED(ac)) { s.maskedLogged = false; return; }
    if (s.orders.length && !remaining(s).length && !s.maskedLogged) {
      s.maskedLogged = true; s.shipOpen = null;
      app.log('rule', `남은 주문이 모두 배송 완료 → 배송 완료 후 ${L('ship_info_days')}일을 기다리지 않고 고객 정보를 바로 가렸어요(${GC.sm.stateName('PARTNER_ACCOUNT', ac)})`);
    }
  }

  async function confirmReject() {
    const s = S();
    const ok = await app.confirm({ title: '이 신청을 반려할까요?', body: `<p>사유 분류: <b>${esc(s.rejectSel)}</b></p><p class="small">파트너에게는 사유와 안내 문구만 보내요. 반려 뒤 ${GC.Policy.get('partner.reapply_days')}일 동안 같은 사업자등록번호로 다시 신청할 수 없어요.</p>`, ok: '반려하기', danger: true });
    if (!ok) return;
    doReject(s.rejectSel, REASONS[s.rejectSel], `${s.md ? s.md.name : 'MD'} 반려`);
    refresh();
  }
  function doReject(reason, memo, by, direct) {
    const s = S(); const from = app.state('app');
    if (direct) app.setState('app', 'REJECTED', { by }); else if (!app.go('app', 'reject', { by })) return;
    const now = app.clock.now();
    s.rejectedFrom = from;
    s.rejected = { at: now, reason, memo, reapplyAt: addDays(now, GC.Policy.get('partner.reapply_days')) };
    s.sup = null;
    trail(by, `반려 · ${reason}`);
    app.notify('NOTI_PARTNER_ONBOARD_RESULT', '파트너 담당자', ['알림톡', '이메일'], `입점 심사 반려 · ${reason} · 재신청 ${fmtDate(s.rejected.reapplyAt, false)}부터`);
    app.log('rule', `재신청 제한 ${GC.Policy.get('partner.reapply_days')}일 → ${fmtDate(s.rejected.reapplyAt, false)}부터 같은 사업자등록번호로 다시 신청 가능`);
  }

  /* ── 시간이 흐를 때: 보완 기한·샘플·서명 리마인드·재신청·유보 ── */
  app.onAdvance((prev, now) => {
    const s = S(); const st = app.state('app'); const ac = app.state('acct');
    if (st === 'DRAFT' && s.draftAt && now - s.draftAt >= L('draft_keep_days') * DAY) {
      app.log('warn', `임시 저장 신청서를 ${L('draft_keep_days')}일 보관한 뒤 삭제했어요 · 신청용 로그인은 남아요`);
      app.strips.app.current = null; app.strips.app.lastMainIdx = null; s.step = 0; s.draftAt = null; s.docs = {};
    }
    if (st === 'SUPPLEMENT' && s.sup && now >= s.sup.due) doReject('서류 미비', `보완 요청에 ${GC.Policy.get('partner.supplement_days')}일 동안 응답이 없어 자동으로 반려했어요`, '시스템 · 보완 기한 지남 자동 반려');
    if (s.custom && s.sampleReqAt && !s.sampleAt && !s.sampleHold && ['REVIEWING', 'SAMPLE_CHECK'].includes(st) && now - s.sampleReqAt >= L('sample_wait_days') * DAY) {
      s.sampleHold = true;
      app.log('warn', `인쇄 샘플이 ${L('sample_wait_days')}일 안에 오지 않았어요 → 담당 MD 연락 · 도착할 때까지 심사 보류`);
      app.notify('코드 없음', `담당 ${s.md ? s.md.name : 'MD'}`, ['관리자 알림'], '인쇄 샘플 미도착 · 파트너 연락 필요');
    }
    if (st === 'CONTRACT' && s.contractAt) {
      const days = Math.floor((now - s.contractAt) / DAY);
      while (s.reminded < REMIND_DAYS.length && days >= REMIND_DAYS[s.reminded]) {
        s.reminded += 1;
        app.notify('NOTI_PARTNER_ONBOARD_RESULT', '파트너 대표·담당자', ['알림톡', '이메일'], `전자 계약 서명 리마인드 ${s.reminded}/${REMIND_DAYS.length}`);
      }
      if (!s.mdCall && days >= L('contract_sign_days')) {
        s.mdCall = true;
        app.log('warn', `서명 기한 ${L('contract_sign_days')}일 지남 · 리마인드 ${REMIND_DAYS.length}회 뒤 MD 연락 할 일 생성 · 상태는 계약 진행 유지`);
        app.notify('코드 없음', `담당 ${s.md ? s.md.name : 'MD'}`, ['관리자 알림'], '계약 미서명 · 파트너 연락 필요');
      }
    }
    if (st === 'REJECTED' && s.rejected && !s.rejected.opened && now >= s.rejected.reapplyAt) { s.rejected.opened = true; app.log('rule', '재신청 제한 기간이 끝났어요 · 이제 다시 신청할 수 있어요'); }
    if (s.activeAt && !s.newEnded && now >= newUntil()) { s.newEnded = true; app.log('rule', `신규 입점 인하 기간 끝 → 일반 ${GC.Policy.get('commission.default_rate')}% · 맞춤 ${GC.Policy.get('commission.custom_rate')}%`); }
    if (s.inv && !s.inv.decided && !s.inv.replied && !s.inv.lapsedLogged && now >= s.inv.due) { s.inv.lapsedLogged = true; app.log('warn', '소명 기한이 지났어요 → 운영팀이 받은 자료로 판단해요'); }
    if (ac === 'TERMINATED' && s.term && !s.term.released && now >= s.term.release) {
      s.term.released = true;
      app.log('money', `유보 기간 ${L('holdback_days')}일 끝 · 그 사이 반품·분쟁 0원 → 유보금 ${won(s.term.hold)} 지급`);
      app.notify('NOTI_PARTNER_PAYOUT_DONE', '파트너 정산 담당', ['알림톡', '이메일'], `계약 종료 유보금 ${won(s.term.hold)} 지급`);
    }
    /* 파트너 주문: 배송 완료(다음 날) · 교환품 배송 완료 → 클레임 끝 · 정지·종료 뒤 가림 */
    if (ac) {
      s.orders.forEach((o) => {
        if (o.st === 'SHIPPED' && o.shippedAt && now - o.shippedAt >= DAY) { orderGo(o, 'deliver', '택배 조회'); o.deliveredAt = new Date(o.shippedAt.getTime() + DAY); }
      });
      if (s.claim && !s.claim.done && s.claim.stage === 'SHIPPED' && now - s.claim.shippedAt >= DAY) {
        const o = findOrder(s.claim.id); s.claim.done = true;
        orderGo(o, 'exchange_done', '교환품 배송 완료 · 클레임 끝');
        app.log('rule', `교환 클레임이 끝나 ${o.id} 배송 정보도 다시 가렸어요`);
      }
      checkMask();
      /* 로그인 보안: 30분 동안 쓰지 않으면 자동 로그아웃 (P-ONB-04) */
      if (s.mfa && !s.sec.out && s.sec.lastAt && now - s.sec.lastAt >= L('idle_logout_min') * MIN) {
        Object.assign(s.sec, { out: true, why: 'idle', step: 'pw' });
        app.log('rule', `파트너 센터를 ${L('idle_logout_min')}분 동안 쓰지 않아 자동 로그아웃했어요 · 다시 로그인하려면 비밀번호 + OTP`);
      }
    }
    syncChrome(); guide();
  });
})();
</script>
