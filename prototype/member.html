  .row-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .demo { border: 1px dashed var(--ink-3); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .demo-h { font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .chipbtn { display: inline-flex; align-items: center; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; line-height: 1.4; }

  .chan { display: flex; flex-wrap: wrap; gap: 0 14px; padding-left: 28px; }
  .rules-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
  .rules-list li { display: flex; gap: 8px; align-items: center; color: var(--ink-3); }
  .rules-list li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--rule-strong); flex: none; }
  .rules-list li.ok { color: var(--ink); }
  .rules-list li.ok::before { background: var(--spot); border-color: var(--spot); }
  .rules-list li.bad { color: var(--stop); }
  .rules-list li.bad::before { background: var(--stop); border-color: var(--stop); }
  .steps-mini { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .steps-mini span { font-size: 11.5px; text-align: center; padding: 4px 0; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .steps-mini span.on { border-color: var(--spot); color: var(--ink); font-weight: 600; }

  .cmp { display: grid; gap: 6px; }
  .cmp-label { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .warn-banner { border: 2px solid var(--warn); background: var(--warn-weak); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
  .hold-banner { border: 2px solid var(--stop); background: var(--stop-weak); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
  .cert { border: 1px solid var(--rule-strong); background: var(--sheet-2); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; }
  .cert h4 { text-align: center; font-family: var(--display); font-size: 17px; letter-spacing: .3em; }
  .blk { display: grid; }
  .blk .li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 13.5px; align-items: center; }
  .blk .li:first-child { border-top: 0; }
  ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .split.wrap { flex-wrap: wrap; align-items: center; }
  .result-mark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--display); font-size: 22px; background: var(--stop-weak); color: var(--stop); }

  .demo .seg { justify-self: start; }
  .tbl td.nw, .nw { white-space: nowrap; }

  /* ── 도우미 ── */

  function fmtBizNo(d) { d = digitsOf(d); return d.length <= 3 ? d : d.length <= 5 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}`; }

  function bizNoState(d) {
    if (!d) return { ok: false, msg: '숫자 10자리를 넣으면 하이픈은 자동으로 들어가요' };

  const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());
  function manAge(birth, now) {
    const [y, m, d] = birth.split('-').map(Number); let age = now.getFullYear() - y;

      s.rechecks.unshift({ at: now, by, res: s.revoked ? '혜택이 해제된 개인 회원 · 대상 아님(고객이 다시 인증 신청)' : '우리 시나리오 회원은 대상 아님' });

      return;
    }
    const closed = s.ntsAnswer === 'closed';
    if (closed && a === 'BIZ') {
      goAcct('closure_detected', `${by} · 국세청 응답 폐업`);
      s.grace = { at: now, until: new Date(now.getTime() + graceDays() * GC.DAY) };
      app.log('rule', `사업자 혜택은 ${fmtDate(s.grace.until, false)}까지 유지 · 세금계산서 발행은 지금부터 막고 현금영수증·카드 전표로 안내 · 진행 중 주문은 영향 없음`);

      s.grace = null; s.revoked = true;
      app.log('rule', '사업자 혜택 해제: 사업자가·세금계산서 끔 · 회원 유형 개인 · 진행 중 주문은 결제 때 가격 그대로');
      app.notify('NOTI_BIZ_STATUS_CHECK', '고객', ['알림톡', '이메일', '알림센터'], '사업자가 적용 중지(혜택 해제) · 다시 개업했다면 새로 인증');
    }
    if (s.withdrawn && !s.withdrawn.expired && now >= s.withdrawn.until) {
      s.withdrawn.expired = true;
      app.log('rule', `재가입 제한(${GC.Policy.get('member.rejoin_block_days')}일) 끝 · 보관하던 CI 해시 파기 → 같은 사람이 다시 가입할 수 있어요`);
    }
    if (s.member && !s.out && s.sessions.length) {
      s.sessions.filter((x) => now >= sessUntil(x)).forEach((x) => {
        app.log('rule', x.kind === 'web' ? `${x.name}: 웹 "로그인 유지" ${GC.Policy.get('member.web_keep_login_days')}일이 지나 로그아웃됐어요` : `${x.name}: 마지막으로 쓴 뒤 ${GC.Policy.get('member.app_keep_login_days')}일이 지나 자동 로그인이 끝났어요`);
      });
      s.sessions = s.sessions.filter((x) => now < sessUntil(x));
      if (!s.sessions.some((x) => x.kind === 'app')) { s.out = 'expired'; s.cs = 'login'; }
    }
    const o = s.order;
    if (o && o.status === 'SHIPPED' && now - o.at >= GC.DAY) { o.status = 'DELIVERED'; o.deliveredAt = new Date(o.at.getTime() + GC.DAY); app.log('state', '주문: 배송 완료(택배 조회)'); }
    if (o && o.status === 'DELIVERED' && now - o.deliveredAt >= GC.Policy.get('order.auto_confirm_days') * GC.DAY) { o.status = 'CONFIRMED'; app.log('state', `주문: 자동 구매 확정(배송 완료 + ${GC.Policy.get('order.auto_confirm_days')}일)`); }
    if (s.manual && !s.manual.decided && !s.manual.warned && now > s.manual.due) {
      s.manual.warned = true;
      app.log('warn', `서류 심사 처리 목표(${fmtDate(s.manual.due)} · 영업일 ${bizManualBd()}일)를 넘겼어요 → 운영팀 알림`);
      app.notify('NOTI_INT_BIZ_VERIFY_LATE', '운영팀(사업자 인증 담당)', ['관리자 알림센터'], `사업자 인증 수동 검토 처리 목표 초과 · BV-3312 · 목표 ${fmtDate(s.manual.due)} · 대기열에서 바로 처리해 주세요`);
    }
    guide();
  });
})();
</script>
