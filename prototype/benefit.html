<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쿠폰·멤버십 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  /* 쿠폰 카드: 왼쪽 할인 금액 · 절취선 · 오른쪽 조건 */
  .cp { display: grid; grid-template-columns: 82px minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); overflow: hidden; }
  .cp .amt { display: grid; place-content: center; text-align: center; background: var(--spot-weak); border-right: 1px dashed var(--rule-strong); font-weight: 700; font-size: 15px; padding: 10px 4px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .cp .amt small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
  .cp .bd { padding: 10px 12px; display: grid; gap: 3px; min-width: 0; align-content: start; }
  .cp .nm { font-weight: 700; font-size: 14px; }
  .cp .cond { font-size: 12px; color: var(--ink-2); }
  .cp .bd .btn { justify-self: start; margin-top: 4px; }
  .cp.is-off { opacity: .55; }
  .cp.is-off .amt { background: var(--sheet-3); }
  .codebox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .linkrow { background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
  /* 라디오처럼 고르는 줄 (쿠폰 선택·요금제) */
  .opt { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet); cursor: pointer; font-size: 13.5px; }
  .opt::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rule-strong); box-sizing: border-box; }
  .opt[aria-checked="true"] { border-color: var(--spot); background: var(--spot-weak); }
  .opt[aria-checked="true"]::before { border-color: var(--spot); background: radial-gradient(circle, var(--spot) 0 38%, transparent 42%); }
  .opt .num { white-space: nowrap; }
  .opt-list { display: grid; gap: 6px; }
  /* 조건이 안 맞아 못 고르는 쿠폰(맞춤 품목 부족 등): 흐리게 + 이유 한 줄 */
  .opt.is-off { cursor: not-allowed; background: var(--sheet-2); border-style: dashed; }
  .opt.is-off > span:first-of-type b, .opt.is-off .num { color: var(--ink-3); }
  .opt.is-off::before { border-style: dashed; }
  .opt .why { display: block; margin-top: 2px; color: var(--warn); font-weight: 600; }
  .seg-sm button { padding: 6px 10px; font-size: 12.5px; }
  /* 체험 구성 4개는 2×2로(폰 폭에서 한 칸만 둘째 줄에 남지 않게) */
  .seg.seg-mix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg.seg-mix button:nth-child(odd) { border-left: 0; }
  .seg.seg-mix button:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .mixline { border-top: 1px dashed var(--rule-strong); padding-top: 8px; margin-top: 2px; }
  .save-big { font-size: 22px; font-weight: 700; color: var(--spot); font-variant-numeric: tabular-nums; }
  .benefits { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
  .judge { display: grid; gap: 6px; }
  .jrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; }
  .jrow .lno { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--ink-3); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .jrow.on { border-color: var(--spot); background: var(--spot-weak); }
  .jrow.on .lno { background: var(--spot); border-color: var(--spot); color: var(--spot-ink); }
  .jrow.skip, .jrow.na { color: var(--ink-3); }
  /* 관리자 */
  .hq-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
  .acct { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .form2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  @media (max-width: 720px) { .form2 { grid-template-columns: minmax(0, 1fr); } }
  .form2 .field { align-content: start; }
  .nw { white-space: nowrap; }
  .unit-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .unit-in span { font-size: 13px; color: var(--ink-2); }
  .est { border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 10px 12px; }
  .bar { height: 8px; background: var(--sheet-3); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--spot); }
  .bar.is-full i { background: var(--warn); }
  .range { width: 100%; accent-color: var(--spot); }
  .tbl td .btn-sm { min-height: 28px; padding: 2px 8px; }
  /* 좁은 화면: 표의 최소 폭이 패널 밖으로 밀어내지 않게(표는 .tbl-wrap 안에서 가로 스크롤) */
  #gc-device .desk-main > *, #gc-device .desk-main .stack-lg > *, #gc-device .panel-b.stack > * { min-width: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate, fmtTime, DAY } = GC;
  const esc = UI.esc, pv = UI.pv;
  const P = (k) => GC.Policy.get(k);

  /* ── 이 페이지에만 둔 정책값(엔진 정책값에 아직 없음 · 최종 보고에 목록) ── */
  const PC = { codeFailMax: 5, codeLockMin: 10, expireNoticeDays: 7, pointNoticeDays: 30, withdrawDays: 7, retry: [1, 3], autoCancelDay: 7, noticeMonthly: 3, noticeYearly: 7, avgOrder: 150000 };
  const pc = (text, label) => `<span class="pv" title="관리자 설정값(임시 기본값) · ${esc(label)} — 엔진 정책값에 아직 없어 이 페이지 상수로 둠">${text}</span>`;
  /* 기획서 멤버십 손익 가정(11장 멤버십 손익 · 연간 회원 한 줄 포함) */
  const PL = { base: 200000, pgRate: 3, shipUse: 50, designUse: 5, designCost: 53125 };
  const asm = (text, label) => `<span class="pv" title="기획서 가정값 · ${esc(label)}">${text}</span>`;

  /* ── 상태 머신(페이지 안 정의) ── */
  GC.sm.define('BENEFIT_COUPON', {
    name: '본사 쿠폰',
    states: { DRAFT: { name: '작성 중' }, PENDING: { name: '승인 대기' }, ACTIVE: { name: '게시 중' }, ENDED: { name: '종료' }, PAUSED: { name: '일시 중지' }, EXHAUSTED: { name: '예산 소진' } },
    main: ['DRAFT', 'PENDING', 'ACTIVE', 'ENDED'],
    branch: ['PAUSED', 'EXHAUSTED'],
    stop: ['EXHAUSTED'],
    transitions: [
      { from: 'DRAFT', event: 'submit', to: 'PENDING', actor: 'hq', label: '승인 요청(작성자)' },
      { from: 'PENDING', event: 'reject', to: 'DRAFT', actor: 'hq', label: '반려(팀장) 또는 요청 회수' },
      { from: 'PENDING', event: 'approve', to: 'ACTIVE', actor: 'hq', label: '승인·게시(팀장 플래그, 요청자 아닌 계정)' },
      { from: 'ACTIVE', event: 'pause', to: 'PAUSED', actor: 'hq', label: '일시 중지(사유)' },
      { from: 'PAUSED', event: 'resume', to: 'ACTIVE', actor: 'hq', label: '재개' },
      { from: 'ACTIVE', event: 'exhaust', to: 'EXHAUSTED', actor: 'system', label: '예산 상한 도달 → 발행 자동 중지' },
      { from: ['ACTIVE', 'PAUSED', 'EXHAUSTED'], event: 'end', to: 'ENDED', actor: 'hq', label: '종료(받은 쿠폰은 유효기간까지)' },
    ],
  });
  GC.sm.define('BENEFIT_MEMBERSHIP', {
    name: '사장님 멤버십',
    states: {
      NONE: { name: '미가입', customer: '가입 전' }, ACTIVE: { name: '이용 중', customer: '이용 중' }, ENDED: { name: '종료', customer: '종료' },
      PAY_FAILED: { name: '결제 실패', customer: '결제 확인 필요' }, CANCEL_RESERVED: { name: '해지 예약', customer: '해지 예정' },
    },
    main: ['NONE', 'ACTIVE', 'ENDED'],
    branch: ['PAY_FAILED', 'CANCEL_RESERVED'],
    stop: [],
    transitions: [
      { from: ['NONE', 'ENDED'], event: 'join', to: 'ACTIVE', actor: 'customer', label: '첫 결제 성공(빌링키)' },
      { from: 'ACTIVE', event: 'pay_fail', to: 'PAY_FAILED', actor: 'system', label: '정기결제 실패 → 혜택 정지' },
      { from: 'PAY_FAILED', event: 'pay_ok', to: 'ACTIVE', actor: 'system', label: '재시도·카드 변경 결제 성공 → 혜택 복구' },
      { from: 'PAY_FAILED', event: 'auto_cancel', to: 'ENDED', actor: 'system', label: 'D+7까지 실패 → 자동 해지' },
      { from: 'ACTIVE', event: 'withdraw', to: 'ENDED', actor: 'customer', label: '결제 후 7일 안·혜택 미사용 → 전액 환불' },
      { from: 'ACTIVE', event: 'reserve_cancel', to: 'CANCEL_RESERVED', actor: 'customer', label: '월간 해지·연간 갱신 안 함' },
      { from: 'CANCEL_RESERVED', event: 'undo', to: 'ACTIVE', actor: 'customer', label: '해지 취소' },
      { from: 'CANCEL_RESERVED', event: 'expire', to: 'ENDED', actor: 'system', label: '기간 끝 → 갱신 안 함' },
      { from: 'ACTIVE', event: 'annual_cancel', to: 'ENDED', actor: 'customer', label: '연간 중도 해지 → 비례 환불·혜택 즉시 중단' },
    ],
  });

  /* ── 시나리오 데이터 ── */
  const D = (m, d) => new Date(2026, m - 1, d, 23, 59).getTime();
  // 명세서 C-PRICE-01 예시 주문(엔진 테스트 TC-01·02): 수저집 10박스(즉시 할인 10%) + 냅킨 2박스
  const ITEMS = [
    { id: 'spoon', name: '수저집 크라프트 1,000매', partnerId: 'DS', shipKey: 'DS', qty: 10, tiers: [{ min: 1, price: 12000 }, { min: 5, price: 12000 }, { min: 10, price: 10000 }], instant: { type: 'rate', value: 10 } },
    { id: 'napkin', name: '무형광 냅킨', partnerId: 'DS', shipKey: 'DS', qty: 2, tiers: [{ min: 1, price: 30000 }, { min: 5, price: 28000 }] },
  ];
  const SHIP = { DS: { name: '대성포장 기본 배송', type: 'conditional', base: 4000, freeOver: 200000 } };
  const CODES = { GAGE3000: { name: '배송비 3,000원', kind: 'ship', max: 3000, minOrder: 30000, until: D(10, 31), how: '쿠폰 코드' } };
  const HISTORY = [{ m: '7월', amount: 180000, shipOrders: 2, design: 0 }, { m: '8월', amount: 210000, shipOrders: 2, design: 1 }, { m: '9월', amount: 250000, shipOrders: 3, design: 0 }];
  const KIND = { cart: '장바구니', product: '상품', ship: '배송비', design: '디자인비', voucher: '이용권' };
  const ISSUE = { auto: '자동 지급', download: '다운로드', code: '코드', direct: '직접 지급' };
  const MEMBERS = { all: '전체', personal: '개인', biz: '사업자', new: '신규', member: '멤버십', grade: '등급' };
  const TARGET = { all: '전체 상품 (PB 제외)', category: '카테고리: 일회용품', partner: '파트너: 대성포장', product: '상품 지정' };
  /* 디자인비 쿠폰은 적용 대상 칸을 쓰지 않고 '맞춤 디자인비'로 고정 · 제외 대상도 없음(2026-10-16 D50) */
  const DC_TARGET = '맞춤 디자인비';
  const targetText = (d) => (d.kind === 'design' ? `${DC_TARGET} (고정 · 제외 대상 없음)` : TARGET[d.target]);
  /* 최소 주문 표기(D51): 디자인비 쿠폰 = 그 디자인 요청(묶음)의 맞춤 품목 금액 '맞춤 품목 N원 이상', 그 밖의 쿠폰 = 'N원 이상 주문' */
  const minText = (x) => (x.kind === 'design' ? `맞춤 품목 ${won(x.minOrder)} 이상` : `${won(x.minOrder)} 이상 주문`);
  const TEAM = { yoon: { name: '윤마케', role: '마케터', lead: false }, seo: { name: '서팀장', role: '마케터', lead: true } };
  const OTHER = [
    ['HC-2609-01', '신규가입 5,000원', '장바구니', '자동 지급(가입)', 'ACTIVE', '412 / 1,380'],
    ['HC-2609-02', '첫 디자인 무료', '디자인비', '자동 지급(가입)', 'ACTIVE', '37 / 1,380'],
    ['HC-2610-03', '배송비 3,000원 · 코드 GAGE3000', '배송비', '코드', 'ACTIVE', '88 / 240'],
    ['HC-2609-05', '추석 기획전 3,000원', '장바구니', '다운로드', 'ENDED', '205 / 600'],
  ];
  const DUP = () => [
    ['파트너 즉시 할인', 'MVP', '파트너 100%', '상품(옵션)당 1개', '뺌'],
    ['파트너 쿠폰', '2차', '파트너 100%', '주문당 파트너별 1장', '뺌'],
    ['공동 프로모션 쿠폰', '2차', '비율(예 50:50)', '파트너 쿠폰 자리 공유 · 본사 상품 할인 쿠폰과 함께 못 씀(디자인비 쿠폰과는 함께 씀)', '파트너 분담분만 뺌'],
    ['맞춤 디자인비 면제', 'MVP', '본사 100%', '요청당 1개(50만원 → 멤버십 이용권 순) · 이용권은 첫 품목 디자인비만 0원, 같은 콘셉트 추가 품목 디자인비는 그대로 냄', '해당 없음'],
    ['본사 상품 할인 쿠폰(장바구니·상품)', 'MVP', '본사 100%', '주문당 1장(장바구니·상품 중 하나) · 판비·추가 구성품 포함, 디자인비 제외', '빼지 않음'],
    ['본사 디자인비 쿠폰(정액·정률 · 첫 디자인 무료 = 정률 100%)', 'MVP', '본사 100%', '주문당 1장 · 디자인비에만(묶음은 품목별 디자인비 비율로 안분) · 최소 주문은 그 디자인 요청(묶음)의 맞춤 품목 금액, 요청이 여럿이면 할인이 가장 큰 요청 1곳 · 50만원 무료·멤버십 이용권으로 이미 무료면 쿠폰함에 남김 · 이용권을 쓴 묶음은 남는 추가 품목 디자인비에도 쓰지 않음 · 첫 시안 뒤 취소 공제는 낸 디자인비만(쿠폰 몫은 공제 안 함, 쿠폰은 사용 처리)', '해당 없음(본사 매출)'],
    ['본사·멤버십 배송비 쿠폰', 'MVP·2차', '본사 100%', '배송 묶음(같은 판매자·출고지·출고 유형)당 1장 · 파트너 배송비 쿠폰과 둘 중 하나', '해당 없음'],
    ['파트너 배송비 쿠폰', '2차', '파트너 100%', '배송 묶음당 1장', '배송비 정산에서 뺌'],
    ['포인트 사용', '2차', '본사 100%', '1,000P 이상 · 10P 단위', '빼지 않음'],
    ['멤버십 추가 적립', '2차', '본사 100%', `월 한도 ${pv('membership.extra_point_cap')}`, '해당 없음'],
  ];

  /* ── 날짜 도우미 ── */
  const addMonths = (d, n) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
  const morning = (d) => { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate(), 9, 0).getTime(); };
  function monthsBetween(a, b) { let m = 0; while (addMonths(a, m + 1).getTime() <= b) m += 1; return { months: m, extraDays: Math.floor((b - addMonths(a, m).getTime()) / DAY) }; }
  const SIM0 = new Date(2026, 9, 12, 9, 0).getTime();
  const daysOf = (m, d) => Math.round((addMonths(SIM0, m).getTime() - SIM0) / DAY) + d;
  const TC14 = [
    { label: '결제 후 5일, 혜택 안 씀', days: 5, used: false },
    { label: '2개월 10일, 혜택 안 씀', days: daysOf(2, 10), used: false },
    { label: '2개월 10일, 혜택 57,000원 사용', days: daysOf(2, 10), used: true },
    { label: '8개월 5일, 혜택 20,000원 사용', days: daysOf(8, 5), used: true },
    { label: '10개월 15일, 혜택 안 씀', days: daysOf(10, 15), used: false },
  ];

  const app = UI.mount({
    domain: 'benefit',

    },
    resumeCoupon() { app.go('coupon', 'resume', { by: `${TEAM[S().acct].name} 재개` }); refresh(); },
    async endCoupon() {
      if (!(await app.confirm({ title: '쿠폰을 종료할까요?', body: '<p class="small">더는 발급하지 않아요. 이미 받은 쿠폰은 유효기간까지 쓸 수 있고, 즉시 회수하려면 사유가 필요해요.</p>', ok: '종료하기', danger: true }))) return;
      app.go('coupon', 'end', { by: `${TEAM[S().acct].name} 종료` }); refresh();
    },
    cs(b) {
      const s = S(); s.cs = b.dataset.to;
      if (s.cs === 'dfee') s.df.voucher = memBenefits() && s.wallet.some((x) => x.kind === 'voucher' && x.status === 'avail');
      refresh();
    },
    boxTab(b) { S().boxTab = b.dataset.v; refresh(); },
    download() {
      const s = S(); const x = asWallet(s.coupon); x.isNew = true; s.wallet.unshift(x); s.stats.issued += 1; s.boxTab = 'avail';
      app.log('user', `고객이 "${esc(x.name)}" 쿠폰을 받았어요 · ${fmtDate(x.until, false)}까지`);
      app.log('rule', '1인 1회 · 본인인증(CI) 값으로 같은 사람의 다른 계정 발급을 막아요');
      refresh();
    },
    codeType(t) { S().code = t.value; },
    redeem() {
      const s = S(); if (locked()) return;
      const inp = app.lastFrame.querySelector('#cpCode'); const raw = (inp ? inp.value : s.code).trim(); const code = raw.toUpperCase();
      s.code = '';
      if (!code) { s.codeOk = false; s.codeMsg = '코드를 넣어 주세요.'; refresh(); return; }
      const def = CODES[code];
      if (def && s.wallet.some((x) => x.code === code)) { s.codeOk = false; s.codeMsg = '이미 등록한 코드예요. 사용 가능 탭에서 확인해 주세요.'; refresh(); return; }
      if (!def) {
        s.codeFails += 1; const left = PC.codeFailMax - s.codeFails;
        if (left <= 0) { s.lockUntil = nowT() + PC.codeLockMin * 60000; s.codeMsg = ''; app.log('warn', `쿠폰 코드 ${PC.codeFailMax}회 오입력 → ${PC.codeLockMin}분 잠금(무작위 대입 방지)`); }
        else { s.codeOk = false; s.codeMsg = `"${esc(raw)}"은(는) 없는 코드예요. 철자를 확인해 주세요. ${left}번 더 틀리면 ${PC.codeLockMin}분 동안 입력이 막혀요.`; app.log('user', `쿠폰 코드 오입력 ${s.codeFails}회`); }
        refresh(); return;
      }
      s.codeFails = 0; s.codeOk = true; s.codeMsg = `"${esc(def.name)}" 쿠폰을 받았어요.`; s.boxTab = 'avail';
      s.wallet.unshift({ id: 'code-' + code, code, src: 'hq', status: 'avail', type: 'amount', value: 0, isNew: true, ...def });
      app.log('user', `쿠폰 코드 ${esc(code)} 등록 → ${esc(def.name)}`);
      refresh();
    },
    pickHq(b) { S().pickHq = b.dataset.id; refresh(); },
    pickShip(b) { S().pickShip = b.dataset.id; refresh(); },
    pickDc(b) { S().pickDc = b.dataset.id; refresh(); },
    async pay() {
      const s = S(); const k = checkoutCalc(); const r = k.r;
      await app.ext({ service: '토스페이먼츠', what: '결제창 호출', lines: [`결제 금액 ${won(r.totals.pay)}`, '서버가 쿠폰 조건과 금액을 다시 계산해 같을 때만 결제창을 열어요', '쿠폰은 결제 승인과 함께 "사용"으로 바꿔요(두 주문에 동시에 못 씀)'], result: '결제가 승인된 것으로 처리해요' });
      const t = app.clock.now(); const no = `GC-${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}-0${512 + s.orders.length}`;
      [k.hq, k.ship].filter(Boolean).forEach((x) => { x.status = 'used'; x.note = `${no} 주문에 사용`; });
      s.orders.push({ no, at: t, r, hq: k.hq, ship: k.ship, canceled: false });
      app.log('money', `결제 ${won(r.totals.pay)} = 상품 ${won(r.totals.gross)} − 파트너 할인 ${won(r.totals.instantDisc)}${r.totals.hqDisc ? ` − 본사 쿠폰 ${won(r.totals.hqDisc)}` : ''} + 배송비 ${won(r.totals.shipping)}${r.totals.shipCoupon ? ` − 배송비 쿠폰 ${won(r.totals.shipCoupon)}` : ''}`);
      if (k.hq) app.log('rule', `본사 쿠폰 안분: 수저집 ${won(r.lines[0].hqAlloc)} · 냅킨 ${won(r.lines[1].hqAlloc)} (항목 금액 비율, 끝전은 큰 항목에)`);
      if (k.hq && k.hq.id === 'new') { s.stats.used += 1; s.stats.disc += r.totals.hqDisc; s.stats.gmv += r.totals.pay; checkBudget(); }
      if (k.ship && k.ship.src === 'mem') { s.mem.used = true; s.mem.saved += r.totals.shipCoupon; app.log('rule', '멤버십 혜택을 썼어요 → 이번 결제분은 7일 전액 환불 대상에서 빠져요'); }
      const ev = settleOf(r); app.log('money', `파트너 정산 예정 ${won(ev.amount)} · 판매 수수료 ${won(ev.fee)}(본사 쿠폰 전 ${won(ev.base)} 기준)`);
      app.notify('NOTI_ORDER_PAID', '고객', ['알림톡', '푸시'], `주문·결제 완료 ${won(r.totals.pay)}`);
      s.pickHq = undefined; s.pickShip = undefined; s.cs = 'paid'; refresh();
    },
    async cancelOrder() {
      const s = S(); const o = s.orders[s.orders.length - 1];
      if (!(await app.confirm({ title: '주문을 취소할까요?', body: `<p>${won(o.r.totals.pay)}을 전액 환불해요. 쓴 쿠폰은 유효기간이 남았으면 돌려드려요.</p>`, ok: '취소하기', cancel: '그대로 두기', danger: true }))) return;
      await app.ext({ service: '토스페이먼츠', what: '결제 취소(전액)', lines: [`환불 ${won(o.r.totals.pay)}`] });
      const t = nowT(); const msgs = [];
      [o.hq, o.ship].filter(Boolean).forEach((x) => {
        if (t <= x.until) { x.status = 'avail'; x.note = '주문 취소로 돌려받음'; msgs.push(`${x.name}: 쿠폰함으로 돌아왔어요`); }
        else { x.status = 'expired'; x.note = '취소했지만 기간이 지나 소멸'; msgs.push(`${x.name}: 유효기간이 지나 소멸했어요`); }
      });
      if (o.hq && o.hq.id === 'new') { s.stats.used -= 1; s.stats.disc -= o.r.totals.hqDisc; s.stats.gmv -= o.r.totals.pay; }
      if (o.ship && o.ship.src === 'mem') s.mem.saved -= o.r.totals.shipCoupon;
      o.canceled = true; o.restoreMsg = msgs.join(' · ') || '쓴 쿠폰이 없어요.';
      app.log('money', `주문 취소 · 환불 ${won(o.r.totals.pay)} · 파트너 정산 대상에서 빠져요`);
      app.log('rule', `쿠폰 복원(C-PAY-02): ${esc(o.restoreMsg)}`);
      refresh();
    },
    dfAmt(b) { S().df.amount = b.dataset.v; refresh(); },
    // 체험 구성을 바꾸면 담긴 상품이 바뀐 것과 같아 디자인비 쿠폰을 다시 자동으로 고름
    dfMix(b) {
      const s = S(); s.df.mix = b.dataset.v; s.pickDc = undefined;
      if (s.df.mix === 'mixed') app.log('rule', '디자인비 쿠폰 최소 주문은 그 디자인 요청(묶음)의 맞춤 품목 금액과 비교해요. 일반 상품은 들어가지 않아요(D51)');
      if (s.df.mix === 'two') app.log('rule', '디자인비 쿠폰 1장은 조건을 채운 요청 가운데 할인이 가장 큰 요청에 써요(같으면 앞 요청, D51)');
      if (s.df.mix === 'bundle') {
        s.df.voucher = true; // 이 장면은 이용권을 쓴 묶음부터 보여 줌(조절판에서 끌 수 있음)
        app.log('rule', `멤버십 이용권은 첫 품목 디자인비 ${won(P('design.fee'))}만 0원 · 추가 품목 디자인비 ${won(P('design.multi_item_fee'))}씩은 그대로 내고, 이용권을 쓴 묶음에는 디자인비 쿠폰을 쓰지 않아 쿠폰함에 남겨요(D60)`);
      }
      refresh();
    },
    dfVoucher(b) { S().df.voucher = b.dataset.v === 'on'; refresh(); },
    memPlan(b) { S().mem.plan = b.dataset.v; refresh(); },
    async memCard() {
      await app.ext({ service: '토스페이먼츠', what: '카드 등록 · 빌링키 발급', lines: ['카드 번호는 식업 서버에 저장하지 않아요', 'PG가 준 빌링키만 암호화해 보관해요', '개인·법인 카드 모두 가능'], result: '빌링키를 받은 것으로 처리해요' });
      S().mem.card = true; refresh();
    },
    memChk(t) { S().mem.checks[t.dataset.k] = t.checked; refresh(); },
    async memJoin() {
      const s = S(); const M = s.mem; const price = planPrice();
      await app.ext({ service: '토스페이먼츠', what: '빌링키로 첫 결제', lines: [`${planName()} ${won(price)} (VAT 포함)`, '결제 요청 ID로 같은 결제가 두 번 나가지 않게 막아요', '본사가 파는 상품이라 본사 매출이에요(파트너 정산과 무관)'], result: '결제가 승인된 것으로 처리해요' });
      Object.assign(M, { start: nowT(), payK: 0, grantK: 1, used: false, refund: null, failedAt: null, retried: {}, everFailed: false });
      app.go('mem', 'join', { by: `${planName()} 첫 결제 성공` });
      app.log('rule', `정기결제 동의 기록: 금액 ${won(price)} · 주기 ${planName()} · 해지 방법(마이 > 멤버십)`);
      charge(M.start, '첫 결제');
      M.checks = {}; s.cs = 'memhome'; refresh();
    },
    async memChangeCard() {
      await app.ext({ service: '토스페이먼츠', what: '카드 변경 · 새 빌링키로 바로 재결제', lines: ['재시도 날짜를 기다리지 않고 바로 결제해요', `${won(planPrice())}`], result: '새 카드로 결제가 승인된 것으로 처리해요' });
      S().mem.failMode = false; recover('카드 변경 후 즉시 재결제'); refresh();
    },
    async memWithdraw() {
      const s = S(); const M = s.mem; const q = cancelQuote();
      if (!(await app.confirm({ title: '멤버십을 해지하고 전액 환불할까요?', body: `<p>결제 후 ${q.days}일이고 혜택을 쓰지 않아 ${won(q.price)}을 모두 돌려드려요.</p>`, ok: '해지하고 환불받기', cancel: '그대로 두기', danger: true }))) return;
      await app.ext({ service: '토스페이먼츠', what: '결제 취소(전액)', lines: [`환불 ${won(q.price)}`, '빌링키 삭제 · 다음 결제 없음'] });
      app.go('mem', 'withdraw', { by: `결제 후 ${q.days}일 · 혜택 미사용 · 청약철회` });
      expireMem('해지로 회수'); M.refund = q.price;
      app.log('money', `멤버십 전액 환불 ${won(q.price)}`);
      app.notify('NOTI_MEMBERSHIP_CANCELED', '고객', ['알림톡', '이메일'], `멤버십 해지 · 환불 ${won(q.price)}`);
      s.cs = 'memhome'; refresh();
    },
    async memReserve() {
      const s = S(); const M = s.mem;
      if (!(await app.confirm({ title: M.plan === 'monthly' ? '해지를 예약할까요?' : '다음 해에 갱신하지 않을까요?', body: `<p>${fmtY(M.next, false)}까지 혜택을 그대로 쓰고, 그 뒤로 결제하지 않아요. 환불은 없어요.</p>`, ok: '해지 예약', cancel: '그대로 두기', danger: true }))) return;
      app.go('mem', 'reserve_cancel', { by: M.plan === 'monthly' ? '월간 해지 예약 · 다음 결제일부터 갱신 안 함' : '연간 갱신 안 함 · 만료일까지 유지' });
      app.notify('NOTI_MEMBERSHIP_CANCELED', '고객', ['알림톡', '이메일'], `해지 예약 · ${fmtY(M.next, false)}까지 이용`);
      s.cs = 'memhome'; refresh();
    },
    async memAnnualCancel() {
      const s = S(); const M = s.mem; const q = cancelQuote();
      if (!(await app.confirm({ title: '연간 멤버십을 중도 해지할까요?', body: `<p>${won(q.a.refund)}을 돌려드리고, 해지하는 즉시 남은 혜택이 멈춰요.</p><p class="small">${won(P('membership.price_yearly'))} − ${won(P('membership.price_monthly'))} × ${q.a.usedMonths}개월(올림)</p>`, ok: '중도 해지', cancel: '그대로 두기', danger: true }))) return;
      await app.ext({ service: '토스페이먼츠', what: '결제 부분 취소', lines: [`환불 ${won(q.a.refund)}`, '빌링키 삭제'] });
      app.go('mem', 'annual_cancel', { by: `사용 ${q.mb.months}개월 ${q.mb.extraDays}일 → 올림 ${q.a.usedMonths}개월` });
      expireMem('중도 해지로 혜택 즉시 중단'); M.refund = q.a.refund;
      app.log('money', `연간 중도 해지 환불 ${won(q.a.refund)} (쓴 혜택 금액은 빼지 않음)`);
      app.notify('NOTI_MEMBERSHIP_CANCELED', '고객', ['알림톡', '이메일'], `멤버십 중도 해지 · 환불 ${won(q.a.refund)}`);
      s.cs = 'memhome'; refresh();
    },
    memUndo() { app.go('mem', 'undo', { by: '고객이 해지 취소' }); refresh(); },
    sysFail(t) { S().mem.failMode = t.checked; app.log('user', t.checked ? '체험: 등록 카드를 한도 초과 상태로 바꿨어요' : '체험: 카드 한도 초과를 풀었어요'); refresh(); },
    sysJump() { const ev = nextEvent(); if (!ev) return; const ms = Math.max(0, ev.at - nowT()); app.clock.advance(ms, `시간을 ${ev.name}까지 보냈어요 → ${fmtY(ev.at)}`); },
    sysFlood() {
      const s = S(); const avg = avgDisc(s.coupon); const n = Math.max(1, Math.ceil((s.coupon.budget - s.stats.disc) / avg));
      s.stats.issued += n; s.stats.used += n; s.stats.disc += n * avg; s.stats.gmv += n * 140000;
      app.log('user', `체험: 다른 사장님 ${GC.num(n)}명의 쿠폰 사용을 반영했어요`);
      checkBudget(); refresh();
    },
    simGrowthLive(t) { const o = app.lastFrame.querySelector('#simGrowthOut'); if (o) o.textContent = `${t.value}%`; },
    simGrowth(t) { S().sim.growth = Number(t.value); refresh(); },
    simDaysLive(t) { const o = app.lastFrame.querySelector('#simDaysOut'); if (o) o.textContent = annualSim(Number(t.value), S().sim.used).label; },
    simDays(t) { S().sim.days = Number(t.value); refresh(); },
    simUsed(t) { S().sim.used = t.checked; refresh(); },
    simPreset(b) { const p = TC14[Number(b.dataset.i)]; Object.assign(S().sim, { days: p.days, used: p.used }); refresh(); },
  });
})();
</script>
</body>
