<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정산·지급 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  .hq-head { flex-wrap: wrap; align-items: center; }
  .row-pick { cursor: pointer; }
  .row-pick:hover td { background: var(--sheet-2); }
  .tbl tr.is-held td { color: var(--ink-3); }
  .tbl tr.is-sub td { color: var(--ink-2); font-size: 12.5px; }
  .tbl tr.is-zero td { color: var(--ink-3); }
  .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 720px) { .sum-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* 다온인쇄 중재 판정 (a)·(b) 설명 카드: 넓으면 두 칸, 좁으면 한 칸 */
  .sum-grid.med-grid { grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .med-grid .scard .lb { font-weight: 600; color: var(--ink); }
  .seg.med-seg button { flex: 1 1 auto; }
  .scard { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; background: var(--sheet); align-content: start; }
  .scard .lb { font-size: 12px; color: var(--ink-2); }
  .scard .am { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scard .sb { font-size: 11.5px; color: var(--ink-3); }
  .scard.is-on { border-color: var(--spot); box-shadow: 0 0 0 1px var(--spot); }
  .scard.is-warn { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .rv { border: 1px solid var(--warn); border-radius: 8px; background: var(--warn-weak); padding: 6px 12px; display: grid; }
  .rv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13px; }
  .rv-row:first-of-type { border-top: 0; }
  .lviz { display: grid; gap: 8px; }
  .lrow-v { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; }
  .ltrack { display: grid; gap: 3px; }
  .lb-bar { display: block; height: 9px; border-radius: 2px; min-width: 3px; }
  .lb-pos { background: var(--spot); }
  .lb-neg { background: var(--stop); }
  .lb-pay { background: var(--kraft); }
  .lb-recv { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 6px); border: 1px solid var(--warn); }
  .lkey { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--ink-2); }
  .lkey i { display: inline-block; width: 14px; height: 8px; margin-right: 4px; vertical-align: middle; border-radius: 2px; }
  .days { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 2px; min-width: 400px; }
  .tbl-nw td, .tbl-nw th { white-space: nowrap; }
  .day { border: 1px solid var(--rule); border-radius: 4px; padding: 4px 2px; text-align: center; font-size: 11px; line-height: 1.35; background: var(--sheet); }
  .day b { display: block; font-size: 11.5px; }
  .day.ev { border-color: var(--c); background: var(--c-weak); }
  .day.cl { border-color: var(--k); background: var(--k-weak); }
  .day.cf { border-color: var(--kraft); background: var(--kraft-weak); }
  .day.pay { border-color: var(--spot); background: var(--spot-weak); font-weight: 600; }
  .calc-out { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .formula { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .denied { border: 2px solid var(--stop); background: var(--stop-weak); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .who { font-size: 12px; color: var(--ink-3); }
  /* 정산 예시 고르기(예시 1 MVP ↔ 예시 2 · 2차·3차) */
  .scn-panel { margin-top: 18px; }
  .scn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: stretch; }
  .scn-h { display: grid; gap: 4px; align-content: center; font-size: 13px; color: var(--ink-2); }
  .scn-h b { font-size: 15px; color: var(--ink); }
  .scn-card { text-align: left; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--sheet); color: var(--ink-2); cursor: pointer; display: grid; gap: 4px; align-content: start; font-size: 12.5px; line-height: 1.5; }
  .scn-card:hover { border-color: var(--rule-strong); }
  .scn-card .scn-t { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .scn-card .scn-am { font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .scn-card[aria-pressed="true"] { border-color: var(--spot); box-shadow: 0 0 0 1px var(--spot); background: var(--spot-weak); color: var(--ink); }
  .scn-card .scn-on { display: none; }
  .scn-card[aria-pressed="true"] .scn-on { display: inline-flex; }
  @media (max-width: 900px) { .scn { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .scn-h { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .scn { grid-template-columns: minmax(0, 1fr); } .tbl-ev td:first-child { min-width: 168px; } }
  /* 좁은 화면: 넓은 표가 패널을 밀어내지 않고 표 안에서만 가로로 움직이게 */
  #gc-device .stack-lg, #gc-device .stack, #gc-device .stack-sm { grid-template-columns: minmax(0, 1fr); }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate, DAY, HOUR } = GC;
  const esc = UI.esc, pv = UI.pv;
  const P = (k) => GC.Policy.get(k);
  const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + f(x), 0);

  /* ── 엔진에 없는 정책값: 이 페이지 안 상수(관리자 설정값 · 임시 기본값) ── */
  const LOCAL = {
    schedule: { v: '화 마감 · 수~목 정산 확정 · 금 지급', label: '정산 주기·마감·정산 확정·지급 요일' },
    plan_fee_pro: { v: 99000, label: '프로 플랜 월 구독료(VAT 별도)', fmt: (v) => won(v) },
    recv_due_days: { v: 14, label: '미수금 청구서 납부 기한', fmt: (v) => v + '일' },
    recv_weeks: { v: 4, label: '연속 미수 주 수(청구서 발행 기준)', fmt: (v) => v + '주' },
    stop_notice_days: { v: 3, label: '판매 중지 예고(납부 기한 며칠 전)', fmt: (v) => v + '일 전' },
    holdback_days: { v: 90, label: '계약 종료 파트너 최종 정산 유보 기간', fmt: (v) => v + '일' },
    recon_escalate_days: { v: 3, label: '대사 불일치 팀장 알림', fmt: (v) => v + '일' },
    plan_downgrade_cycles: { v: 2, label: '플랜료 연속 미수 → 베이직 전환', fmt: (v) => v + '주기' },
  };
  const L = (k) => LOCAL[k].v;
  const lpv = (k, text) => `<span class="pv" title="관리자 설정값(임시 기본값) · ${esc(LOCAL[k].label)} — 엔진 정책값에 아직 없어 이 페이지에만 둔 값">${text != null ? text : LOCAL[k].fmt(LOCAL[k].v)}</span>`;

  /* ── 상태 머신(엔진에 없는 것만 페이지에서 정의) ── */
  GC.sm.define('SETTLEMENT_RECEIVABLE', {
    name: '미수금 청구',
    states: { ACCRUING: { name: '미수 누적' }, INVOICED: { name: '청구서 발행' }, PAID: { name: '납부 완료' }, SALES_STOPPED: { name: '판매 중지' } },
    main: ['ACCRUING', 'INVOICED', 'PAID'], branch: ['SALES_STOPPED'], stop: ['SALES_STOPPED'],
    transitions: [
      { from: 'ACCRUING', event: 'invoice', to: 'INVOICED', actor: 'system', label: '미수금 기준 초과 · 청구서 발행' },
      { from: ['INVOICED', 'SALES_STOPPED'], event: 'pay', to: 'PAID', actor: 'partner', label: '청구서 납부(가상계좌)' },
      { from: 'INVOICED', event: 'overdue', to: 'SALES_STOPPED', actor: 'system', label: '납부 기한 경과 → 판매 중지' },
    ],
  });
  GC.sm.define('SETTLEMENT_HOLDBACK', {
    name: '계약 종료 유보',
    states: { FINAL_CALC: { name: '최종 정산 계산' }, HOLDING: { name: '30% 유보 중' }, RELEASED: { name: '유보분 지급 등록' } },
    main: ['FINAL_CALC', 'HOLDING', 'RELEASED'], branch: [], stop: [],
    transitions: [
      { from: 'FINAL_CALC', event: 'pay_partial', to: 'HOLDING', actor: 'system', label: '지급일에 70% 지급 · 30% 유보 시작' },
      { from: 'HOLDING', event: 'release', to: 'RELEASED', actor: 'system', label: '90일 경과 · 클레임 차감 뒤 지급 목록 자동 등록' },
    ],
  });

  /* ── 시나리오 (C-STL-01 예시 1·2·3) ──
     예시 1 = MVP 기능만(플랜 없음, 기본) · 예시 2 = 프로 플랜, 2차·3차 기능 포함(위쪽 토글) · 예시 3 = 이월·미수금 원장.
     토글은 [처음부터]를 눌러도 유지돼요(보는 렌즈라서 진행 상태와 따로 둠). */
  let scenario = 'mvp';
  const isPro = () => scenario === 'pro';
  const SCN_NAME = { mvp: '예시 1 · MVP 기능만', pro: '예시 2 · 2차·3차 기능 포함' };
  const PLATE = { print: 250000, fee: 50000, cost: 30000 }; // 확정 후 취소 건: 인쇄 대금 · 고객이 낸 판비 · 파트너가 증빙한 판 제작 실비
  const STMT_ID = 'STL-20261013-DS'; // 대성포장 10월 2주차 정산서 ID(지급 요청 키 = 정산서 ID + 지급 회차)
  const PERIOD = { from: new Date(2026, 9, 6), to: new Date(2026, 9, 12) };
  const CLOSE_AT = new Date(2026, 9, 13, 0, 0);
  const NOV1 = new Date(2026, 10, 1, 0, 0);
  const payDayOf = (k) => new Date(2026, 9, 16 + 7 * k, 0, 0);
  const confirmFrom = (k) => new Date(payDayOf(k).getTime() - 2 * DAY);
  const confirmBy = (k) => payDayOf(k);
  const payDayEnd = (k) => new Date(payDayOf(k).getTime() + DAY);
  const LAST_WEEK = 188200;
  const ACCOUNT_OLD = { mask: '국민 1234**-**-***678', holder: '대성포장(주)' };
  const ACCOUNT_NEW = { mask: '신한 110-***-***321', holder: '대성포장(주)' };
  const ACCOUNT_FIXED = { mask: '국민 1234**-**-***687', holder: '대성포장(주)' };
  const ACCTS = {
    choi: { id: 'choi', name: '최정산', role: '정산·재무', lead: false },
    han: { id: 'han', name: '한재무', role: '정산·재무 · 팀장 플래그', lead: true },
  };
  const LATE_CLAIM = 28000, LATE_CLAIM_DAY = 40;
  /* 중재 판정 정산(C-STL-01 '중재 판정' 이벤트 · 2026-10-16 D57·D59) — 다온인쇄(맞춤 인쇄 파트너) 갈래 예시.
     (a) 생산 지연 취소(DELAY_CANCEL) 승인: 고객에게 돌려준 디자인비를 파트너 부담 · (b) 반품 거부가 중재에서 뒤집혀 늦어진 환불의 지연배상금 */
  const MED_DELAY = { order: 'GC-20260921-0288', item: '맞춤 컵홀더 인쇄 250,000 + 판비 50,000', print: 250000, plate: 50000, at: new Date(2026, 9, 8, 14, 10) };
  const MED_LATE = { order: 'GC-20260914-0151', item: '종이 도시락 용기 20박스 반품(파트너 검수 거부 → 고객 이의 → 중재에서 고객 인정)', amount: 480000, collectedAt: new Date(2026, 8, 28, 15, 0), doneAt: new Date(2026, 9, 8, 10, 40) };
  /* 체험 조절(실제 화면에는 없음): 이번 주 다른 정산 이벤트 · 고객이 낸 디자인비. 집계 표·지급 목록은 늘 기본값(real · paid)으로 계산 */
  const MED_WEEKS = { real: { label: '이번 주 그대로', item: '일반 주문 · 종이 도시락 용기 2박스', sale: 30000, custom: false }, rich: { label: '구매 확정이 많은 주라면', item: '맞춤 주문 · 수저집 인쇄 250,000 + 판비 50,000', sale: 300000, custom: true } };

  function rates() {
    const plan = isPro() ? 'PRO' : 'BASIC';
    const fr = (base, reorder) => GC.settle.finalRate({ base, plan, reorder });
    return { plan, normal: fr(P('commission.default_rate')), custom: fr(P('commission.custom_rate')), reorder: fr(P('commission.custom_rate'), true) };
  }
  /* 확정 후 취소(본사 중재)에서 공제한 판비 = 파트너 '취소 보상' = min(증빙 실비, 낸 판비) — C-PAY-02 */
  const cancelComp = () => GC.refund.designCancel({ type: 'CUSTOM', stage: 'APPROVED', itemsAmount: PLATE.print + PLATE.fee, paidDesignFee: P('design.fee'), plateFee: PLATE.fee, plateCost: PLATE.cost });
  function events() {
    const r = rates();
    const mk = (o) => ({ kind: '구매 확정', ...o, ...GC.settle.confirmEvent({ sale: o.sale, partnerDisc: o.disc, rate: o.rate, shipping: o.ship || 0 }) });
    const cup = mk({ id: 'cup', short: '종이컵', order: 'GC-20261009-0533', item: '종이컵 6.5oz 2박스', sale: 48000, disc: 0, rate: r.normal.rate, claim: true, at: new Date(2026, 9, 11, 11, 30) });
    if (isPro()) {
      return [
        mk({ id: 'e1', short: '수저집', order: 'GC-20261006-0201', item: '일반 주문 · 수저집 크라프트 10박스', sale: 100000, disc: 10000, discType: 'instant', discNote: '즉시 할인 10%', rate: r.normal.rate, general: true, at: new Date(2026, 9, 8, 14, 20) }),
        mk({ id: 'e2', short: '냅킨', order: 'GC-20261006-0201', item: '일반 주문 · 무형광 냅킨 2박스 · 묶음 마지막 확정', sale: 60000, disc: 5000, discType: 'coupon', discNote: '파트너 쿠폰', discPhase: '2차', rate: r.normal.rate, ship: 4000, shipNote: '고객 1,000 + 멤버십 배송비 쿠폰 보전 3,000', shipPhase: '2차', general: true, at: new Date(2026, 9, 9, 10, 5) }),
        mk({ id: 'e3', short: '맞춤 주문', order: 'GC-20261007-0412', item: '맞춤 수저집 인쇄 250,000 + 판비 50,000', sale: 300000, disc: 0, rate: r.custom.rate, big: true, at: new Date(2026, 9, 10, 16, 40) }),
        cup,
      ];
    }
    const cc = cancelComp();
    /* 일반 주문은 주문 항목마다 정산 이벤트 하나(2026-10-15 D22): 수수료 내림·공급가·VAT를 이벤트마다 나눠 저장. 배송비는 묶음의 마지막 확정 항목(냅킨) 행 */
    return [
      mk({ id: 'm1', short: '수저집', order: 'GC-20261006-0201', item: '일반 주문 · 수저집 크라프트 10박스', sale: 100000, disc: 10000, discType: 'instant', discNote: '즉시 할인', hqNote: '본사 쿠폰 안분 6,000은 플랫폼 보전', rate: r.normal.rate, general: true, at: new Date(2026, 9, 8, 14, 20) }),
      mk({ id: 'm1n', short: '냅킨', order: 'GC-20261006-0201', item: '일반 주문 · 무형광 냅킨 2박스 · 묶음 마지막 확정', sale: 60000, disc: 0, hqNote: '본사 쿠폰 안분 4,000은 플랫폼 보전', rate: r.normal.rate, ship: 4000, shipNote: '고객이 낸 배송비', general: true, at: new Date(2026, 9, 9, 10, 5) }),
      mk({ id: 'm2', short: '맞춤 주문', order: 'GC-20261007-0412', item: '맞춤 수저집 인쇄 250,000 + 판비 50,000', sale: 300000, disc: 0, rate: r.custom.rate, big: true, at: new Date(2026, 9, 10, 16, 40) }),
      cup,
      mk({ id: 'm3', short: '같은 판 재주문', order: 'GC-20261008-0455', item: '같은 판 재주문 인쇄 250,000 · 판비 면제', sale: 250000, disc: 0, rate: r.reorder.rate, reorder: true, big: true, at: new Date(2026, 9, 12, 9, 20) }),
      { id: 'm4', short: '취소 보상', kind: '클레임 완료', order: 'GC-20260929-0318', item: '확정 후 취소의 취소 보상(판 제작 실비)', comp: cc, sale: null, disc: 0, base: null, fee: 0, feeSupply: 0, feeVat: 0, rate: 0, shipping: 0, amount: cc.plateToPartner, at: new Date(2026, 9, 12, 15, 10) },
    ];
  }
  const compNote = (e) => `판 실비 ${won(PLATE.cost)} 증빙 · 고객이 낸 판비 ${won(PLATE.fee)} → min = ${won(e.amount)} · 수수료 0%`;
  function charges() {
    if (!isPro()) return []; // MVP의 본사 청구는 위약금·분쟁 조정뿐 — 이번 주는 없음
    const plan = L('plan_fee_pro'); const vat = Math.round(plan * 0.1);
    return [
      { type: 'PLAN', amount: plan + vat, label: `프로 플랜 10월 구독료 ${won(plan)} + VAT ${won(vat)}`, phase: '2차' },
      { type: 'AD', amount: 16500, label: '광고비 유상분(사용 45,000 − 무상 캐시 30,000) + VAT 1,500', phase: '3차' },
    ];
  }
  function mainCalc() {
    const s = S(); const ev = events(); const ch = charges();
    const inc = ev.filter((e) => !(e.claim && s.heldItem));
    const res = GC.settle.payout({ events: inc.map((e) => e.amount), carryIn: 0, charges: ch.map(({ type, amount }) => ({ type, amount })) });
    return { ev, inc, ch, res, fee: sum(inc, (e) => e.fee), feeSupply: sum(inc, (e) => e.feeSupply), feeVat: sum(inc, (e) => e.feeVat), ded: sum(res.deductions, (d) => d.amount), held: ev.filter((e) => e.claim && s.heldItem) };
  }
  /* 명세 예시의 지급액(클레임 진행 1건을 정산 보류한 뒤) — 토글 카드에 표시 */

    recv: () => [{ k: '청구서 기준', policy: 'settlement.receivable_limit' }, { k: '또는 연속 미수', v: lpv('recv_weeks') }, { k: '납부 기한', v: lpv('recv_due_days') }, { k: '판매 중지 예고', v: lpv('stop_notice_days') }, ...(isPro() ? [{ k: '플랜료 연속 미수', v: `${lpv('plan_downgrade_cycles')} → 베이직 ${tag('tag-phase', '2차')}` }] : [{ k: 'MVP 미수금 청구', v: '분쟁 조정·위약금' }])],
    hb: () => [{ k: '유보율', policy: 'settlement.final_holdback' }, { k: '유보 기간', v: lpv('holdback_days') }, { k: '그 사이 클레임', v: '유보분에서 차감' }],
    med: () => [{ k: '중재 판정 이벤트(수수료 없음)', v: '파트너 부담 −' }, { k: '생산 지연 취소 승인', v: '돌려준 디자인비' }, { k: `환불 기한(회수 완료·승인 뒤) ${tag('tag-phase', '법률 자문 전 초안')}`, policy: 'claim.refund_due_bd' }, { k: `지연배상금 연 이율 ${tag('tag-phase', '법률 자문 전 초안')}`, policy: 'claim.refund_delay_rate' }, { k: '정산액이 모자라면', v: '미수금(분쟁 조정)' }, { k: '청구서 기준', policy: 'settlement.receivable_limit' }, { k: '제작 파트너 변경 전액 환불', v: '자동 차감 없음' }],

  /* ── 지금 차례 ── */
  function guide() {
    const s = S();
    if (s.branch === 'SB') return guideRecv();
    if (s.branch === 'BR') return guideHb();
    if (s.branch === 'DO') return guideMed();
    return guideMain();
  }
  function guideMed() {
    const s = S(); const back = '대성포장을 고르면 기본 흐름 안내로 돌아가요.';

    return app.done(`다온인쇄 중재 판정 정산을 봤어요. 이번 주 지급 ${won(d.res.payout)} · 미수금(분쟁 조정) ${won(d.recv)}은 다음 주기에 먼저 빼요.`, { next: back });
  }
  function guideMain() {
    const s = S(); const st = app.state('settle'); const now = app.clock.now(); const k = s.cycle; const a = ACCTS[s.acct];
    if (!s.closed) return app.turn('system', '화요일 0시 마감 배치를 기다려요. 위쪽 [+1일]을 누르거나 시스템 화면에서 [마감 배치 지금 실행]을 누르세요', { rules: R.close(), hint: '마감 전에는 구매 확정 같은 정산 이벤트가 쌓이기만 해요. 이벤트는 기록될 때 열려 있는 주기에 들어가고, 화요일 0시 그날 자동 구매 확정 배치가 끝난 뒤 마감해요. 그 뒤 기록된 이벤트는 다음 주기로 가요.' });
    if (st === 'SCHEDULED') {
      if (k === 0 && (!s.heldItem || !s.review.spike)) return app.turn('hq', '대성포장 정산서의 이상 건 2개를 검토하세요. 클레임이 진행 중인 항목은 정산 보류하고, 급변은 사유를 확인해요', { rules: R.review(), hint: '마감 배치가 이상 건에 표시만 해 두었어요. 정산 보류는 클레임·분쟁 항목에만 걸고 나머지는 그대로 정산 확정해요.' });
      if (!s.recon) return app.turn('hq', '[대사] 메뉴에서 토스페이먼츠 정산 파일을 올려 내부 결제 기록·은행 입금과 맞춰 보세요', { rules: R.recon() });
      if (now < confirmFrom(k)) return app.turn('hq', `정산 확정은 ${fmtDate(confirmFrom(k), false)}부터예요. 위쪽 [+1일]로 수요일까지 시간을 보내세요`, { rules: R.confirm(), hint: '화요일은 마감 결과를 검토하고 대사하는 날이에요. 목요일까지 정산 확정하지 않으면 지급일이 다음 금요일로 밀려요.' });
      if (!a.lead) return app.turn('hq', '정산 확정은 팀장 플래그 계정만 할 수 있어요. 화면 위 계정을 "한재무 · 팀장"으로 바꾸세요', { rules: R.confirm() });
      return app.turn('hq', '[정산 확정]을 누르세요. 정산 확정하면 파트너 센터에 정산서가 공개돼요', { rules: R.confirm() });
    }
    if (st === 'CONFIRMED') {
      const pgHint = 'PG 응답을 "대성포장 계좌 오류"로 바꾸면 지급 실패 갈래를, "응답 없음"으로 바꾸면 지급 결과를 모르는 갈래(확인 중)를 볼 수 있어요.';
      if (s.payCheck) {
        if (s.payCheck.escalated) return app.turn('hq', 'PG 조회로도 결과를 몰라 재무·개발 담당에게 알렸어요. 담당자가 PG와 확인한 뒤 [지급] 메뉴에서 [PG 지급 조회]로 다시 확인하세요', { rules: R.check(), hint: '확인 전에는 다시 보내지 않아요. 첫 송금이 이미 나갔을 수 있어서예요.' });
        return app.turn('hq', '대성포장 지급 결과를 몰라요(PG 응답 없음). 다시 보내지 말고 [지급] 메뉴에서 [PG 지급 조회]로 결과를 확인하세요', { rules: R.check(), hint: '조회 결과(체험용)를 "송금 안 됨"이나 "조회 안 됨"으로 바꾸면 다른 갈래를 볼 수 있어요.' });
      }
      if (!s.partnerSeen) return app.turn('partner', '정산서가 공개됐어요. 파트너 센터 [정산서] 메뉴에서 이번 주 항목을 확인하세요', { rules: R.stmt() });
      if (now < payDayOf(k)) return app.turn('hq', `지급일 ${fmtDate(payDayOf(k), false)}까지 시간을 보내세요(+1일)`, { rules: R.pay(), hint: s.released ? `${fmtDate(s.released.at)}에 정산 보류(${esc(s.released.label)})를 풀어 정산 확정 금액 ${won(s.released.amount)} 그대로 다음 지급 목록에 올렸어요. 다시 정산 확정하지 않아요.` : '갈래: 지금 파트너가 [정산 계좌]에서 계좌를 바꾸면, 바꾼 뒤 24시간 안에 돌아오는 지급은 정산 보류돼요.' });
      if (!s.req) return app.turn('hq', '[지급] 메뉴에서 지급 목록을 확인하고 [지급 요청]을 누르세요', { rules: R.pay() });
      const rq = ACCTS[s.req.by];
      if (rq.lead) return app.turn('hq', '팀장이 요청하면 다른 팀장이 승인해야 하는데, 이 시나리오의 팀장은 한 명이에요. [요청 취소] 뒤 최정산 계정으로 다시 요청하세요', { rules: R.pay() });
      if (!s.selfDenied && s.acct === s.req.by) return app.turn('hq', `요청한 ${rq.name} 계정 그대로 [지급 승인]을 눌러 보세요. 서버가 막는지 확인해요`, { rules: R.pay() });
      if (s.acct === s.req.by || !a.lead) return app.turn('hq', `요청자(${rq.name})와 다른 팀장 계정 "한재무"로 바꿔 [지급 승인]을 누르세요`, { rules: R.pay(), hint: pgHint });
      return app.turn('hq', '[지급 승인]을 누르면 지급 요청 키를 먼저 저장하고 토스페이먼츠 지급대행으로 돈이 나가요', { rules: R.pay(), hint: pgHint });

      if (h.code === 'ACCOUNT_CHANGED_24H' && within24()) return app.turn('system', `계좌를 바꾼 지 24시간이 지나야 정산 보류가 풀려요. ${fmtDate(new Date(s.acctChange.at.getTime() + holdMs()))}까지 시간을 보내세요(+1일)`, { rules: R.hold() });

  }
  function guideRecv() {

  function hqAgg(s, st) {
    if (!s.closed) {
      return `<div class="note">10월 2주차(${fmtDate(PERIOD.from, false)} ~ ${fmtDate(PERIOD.to, false)}) 정산 이벤트가 쌓이는 중이에요. 마감 배치는 <b>${fmtDate(CLOSE_AT)}</b>, 그날 자동 구매 확정 배치가 끝난 뒤에 돌아요. 그 뒤 기록된 이벤트는 다음 주기로 가요.</div>
        <div class="panel"><div class="panel-h"><h2>쌓이는 중 · 대성포장</h2><span class="xsmall faint">기록될 때 열려 있는 주기에 배정</span></div><div class="panel-b stack">
          <div class="tbl-wrap"><table class="tbl small"><thead><tr><th>기록</th><th>정산 이벤트</th><th class="num">정산액</th></tr></thead><tbody>
          ${events().map((e) => `<tr><td>${fmtDate(e.at)}</td><td>${e.kind} · ${esc(e.item)}</td><td class="num">${won(e.amount)}</td></tr>`).join('')}</tbody></table></div>
          <p class="xsmall faint">다른 파트너 4곳도 같은 방식으로 쌓여요. 식업 직영(DIRECT) 파트너는 정산 배치에서 빠지고 별도 원장으로 관리해요 ${tag('tag-phase', '3차')} · MVP는 모든 파트너가 일반 입점이에요.</p></div></div>`;
    }
    const c = mainCalc(); const oState = s.othersPaid ? 'PAID_OUT' : s.confirmedOnce ? 'CONFIRMED' : 'SCHEDULED';
    const dsFlags = [];
    if (s.cycle === 0 && st === 'SCHEDULED') { if (!s.heldItem) dsFlags.push(tag('tag-warn', '클레임 진행 1건')); if (!s.review.spike) dsFlags.push(tag('tag-warn', '전주 대비 급변')); }
    if (s.heldItem) dsFlags.push(tag('', '정산 보류 항목 1건'));
    if (st === 'ON_HOLD' && s.hold) dsFlags.push(tag('tag-stop', esc(s.hold.label)));
    if (s.payCheck) dsFlags.push(tag('tag-warn', '지급 확인 중'));
    const on = otherCalc('ON'), hb = otherCalc('HB'), br = brCalc(), sb = otherCalc('SB');
    const row = (id, name, ev, ded, pay, state, flags) => `<tr class="row-pick${s.focus === id ? ' is-hl' : ''}" data-act="pick" data-p="${id}"><td><b>${name}</b> <span class="xsmall faint">${planOf(id)}</span><div class="flags">${state}${flags.join('')}</div></td><td class="num">${won(ev)}</td><td class="num">${ded ? '−' + won(ded) : '0원'}</td><td class="num">${won(pay)}</td></tr>`;
    const rows = [
      row('DS', '대성포장', c.res.eventSum, c.ded, c.res.payout, stChip(st), dsFlags),
      row('HB', '한빛위생', hb.eventSum, 0, hb.payout, stChip(oState), []),
      row('ON', '온누리컵', on.eventSum, 0, 0, '<span class="st">0원 · 이월</span>', [tag('tag-warn', '마이너스 정산'), s.recon && !s.recon.resolved ? tag('tag-stop', '대사 불일치') : ''].filter(Boolean)),
      row('BR', '바른용기', br.fin, 0, br.now, stChip(oState), [tag('tag-kraft', `갈래 · ${P('settlement.final_holdback')}% 유보`)]),
      row('SB', '새봄인쇄', sb.eventSum, sum(sb.deductions, (d) => d.amount), 0, '<span class="st st-warn">0원 · 미수</span>', [tag('tag-stop', `갈래 · 미수금 ${won(sum(sb.receivables, (r) => r.amount))}`)]),
      (() => { const d = medCalc(); return row('DO', '다온인쇄', d.res.eventSum, d.taken, d.res.payout, d.res.payout ? stChip(oState) : '<span class="st st-warn">0원 · 미수</span>', [tag('tag-stop', `갈래 · 중재 판정 −${won(d.med)}`), d.recv ? tag('tag-warn', `미수금 ${won(d.recv)}`) : ''].filter(Boolean)); })(),
    ].join('');
    const detail = { DS: dsDetail, HB: hbDetail, ON: onDetail, BR: brDetail, SB: sbDetail, DO: doDetail, GC: gcDetail }[s.focus](s, st);
    return `<div class="panel"><div class="panel-h"><h2>10월 2주차 정산 배치 · ${fmtDate(CLOSE_AT)} 마감</h2><span class="xsmall faint">행을 누르면 상세</span></div><div class="panel-b stack">
      <div class="tbl-wrap"><table class="tbl small"><thead><tr><th>파트너 · 상태</th><th class="num">이벤트 합</th><th class="num">청구 차감</th><th class="num">지급 예정</th></tr></thead><tbody>${rows}
        <tr class="row-pick${s.focus === 'GC' ? ' is-hl' : ''}" data-act="pick" data-p="GC"><td colspan="4" class="faint">식업 직영 · 정산 배치 제외(별도 원장) ${tag('tag-phase', '3차')}</td></tr></tbody></table></div></div></div>
      ${detail}`;
  }

  function dsDetail(s, st) {
    const c = mainCalc(); const k = s.cycle; const now = app.clock.now(); const a = ACCTS[s.acct];
    let review = '';
    if (k === 0 && st === 'SCHEDULED') {
      const e4 = c.ev.find((e) => e.claim);
      const pct = Math.round(((c.res.payout - LAST_WEEK) / LAST_WEEK) * 100);
      review = `<div class="rv"><b class="small" style="padding-top:4px">이상 건 검토 · 마감 배치가 표시함</b>
        <div class="rv-row"><div>${tag('tag-warn', '클레임 진행')} ${esc(e4.item)} · 정산액 ${won(e4.amount)}<br><span class="xsmall faint">${e4.order} · 확정 후 불량 반품 신청(회수 중) · 사유 코드 CLAIM_IN_PROGRESS</span></div>
          ${s.heldItem ? '<span class="st st-warn">정산 보류함 · 다음 주기</span>' : '<button class="btn btn-sm" data-act="holdItem">항목 정산 보류</button>'}</div>
        <div class="rv-row"><div>${tag('tag-warn', '전주 대비 급변')} 지급 예정 ${won(c.res.payout)} · 지난주 ${won(LAST_WEEK)} 대비 +${pct}%<br><span class="xsmall faint">${spikeWhy(c)}</span></div>
          ${s.review.spike ? '<span class="st st-done">확인함</span>' : '<button class="btn btn-sm" data-act="okSpike">사유 확인함</button>'}</div></div>`;
    }
    let actions = '';
    if (st === 'SCHEDULED') {
      const ready = k > 0 || (s.heldItem && s.review.spike && s.recon);
      const early = now < confirmFrom(k);
      const why = !ready ? (s.heldItem && s.review.spike ? '[대사]를 먼저 끝내요' : '이상 건 검토와 대사를 먼저 끝내요') : early ? `정산 확정은 ${fmtDate(confirmFrom(k), false)}부터예요` : !a.lead ? '팀장 플래그 계정(한재무)만 정산 확정할 수 있어요(A-SYS-01)' : `정산 확정하면 파트너 센터에 공개되고 ${fmtDate(payDayOf(k), false)}에 지급해요. 검토가 끝난 다른 파트너 정산서도 함께 정산 확정돼요`;
      actions = `<div class="cluster"><button class="btn btn-primary" data-act="confirmStl" ${ready && !early && a.lead ? '' : 'disabled'}>정산 확정</button><span class="xsmall faint">${why}</span></div>`;
    } else if (st === 'CONFIRMED' && s.payCheck) {
      actions = `<div class="note note-warn small"><b>지급 요청 확인 중</b> · 요청 키 ${keyTxt()} · ${fmtDate(s.payCheck.at)} 요청 뒤 PG 응답이 없어 결과를 몰라요. 정산서는 정산 확정 그대로이고, 다시 보내지 않아요.</div><div class="cluster"><button class="btn" data-act="hqTab" data-t="pay">지급 메뉴에서 조회하기</button></div>`;
    } else if (st === 'CONFIRMED') {
      const rel = s.released ? ` ${fmtDate(s.released.at)} 정산 보류(${esc(s.released.label)})를 풀어 확정 금액 그대로 다음 지급 목록에 올렸어요.` : '';
      actions = `<div class="note note-spot small">${fmtDate(s.confirmedAt)} ${s.confirmedBy} 정산 확정 · 파트너 센터에 공개됐고 ${fmtDate(payDayOf(k), false)}에 지급해요.${rel} 정산 확정된 정산서는 고칠 수 없고, 오류는 다음 주기 '조정' 이벤트로 처리해요.</div><div class="cluster"><button class="btn" data-act="hqTab" data-t="pay">지급 메뉴 열기</button></div>`;
    } else if (st === 'ON_HOLD' && s.hold) {
      const ok = holdReady(); const h = s.hold; const nextPay = fmtDate(payDayOf(nextCycleAfter(now, k + 1)), false);
      const keep = `확정 금액 ${won(c.res.payout)} 그대로 정산 확정으로 돌아가 다음 지급 목록에 올라가요(다시 정산 확정하지 않아요).`;
      const okTxt = h.code === 'PAYOUT_NOT_SENT' ? `해제하면 ${keep} 다음 지급일 ${nextPay}에 같은 요청 키(${keyTxt()})로 다시 보내요. 첫 송금이 나갔더라도 PG가 같은 키를 알아봐 두 번 보내지 않아요.` : `정산 보류 사유가 풀렸어요. 해제하면 ${keep} 다음 지급일 ${nextPay}에 보내요.`;
      actions = `<div class="note note-warn small"><b>정산 보류</b> · ${esc(h.label)} <span class="xsmall faint">사유 코드 ${h.code} · 정산 확정 뒤 보류</span><br>${ok ? okTxt : h.code === 'PAYOUT_FAILED' ? '파트너가 정산 계좌를 다시 인증해야 풀 수 있어요.' : `${fmtDate(new Date(s.acctChange.at.getTime() + holdMs()))}이 지나야 풀 수 있어요.`}</div>
        <div class="cluster"><button class="btn btn-primary" data-act="release" ${ok ? '' : 'disabled'}>정산 보류 해제</button><span class="xsmall faint">지급 실패·지급대행 장애·계좌 변경처럼 확정 뒤 건 보류는 정산 확정으로, 확정 전 보류는 정산 예정으로 돌아가요</span></div>`;
    } else if (st === 'PAID_OUT') {
      actions = `<div class="note note-spot small">${fmtDate(s.paidAt)} 지급 완료 · ${esc(s.account.mask)} · 지급 내역서를 파트너 센터에 공개했어요.</div>`;
    }
    const subs = [['stmt', '정산서'], ['order', '차감 순서·한도']];
    return `<div class="panel"><div class="panel-h"><h2>대성포장 · ${isPro() ? '프로 플랜' : '플랜 없음'} · ${k === 0 ? '10월 2주차' : `10월 2주차(${fmtDate(payDayOf(k), false)} 지급분)`}</h2><span class="cluster">${scnTag()}${stChip(st)}</span></div><div class="panel-b stack">
      ${review}
      <div class="seg" role="group" aria-label="정산서 보기">${subs.map(([v, n]) => `<button data-act="dsSub" data-t="${v}" aria-pressed="${s.dsSub === v}">${n}</button>`).join('')}</div>
      ${s.dsSub === 'order' ? orderSim(s, c) : hqStmt(s, c)}
      ${actions}</div></div>`;
  }

  const phTag = (p) => (p ? ` ${tag('tag-phase', p)}` : '');
  /* 수수료 칸: 요율 + 이 이벤트에서 나눠 저장한 공급가·VAT(D22 — 합계를 다시 나누지 않음) */
  const feeSub = (rateTxt, sp, vt) => `<br><span class="xsmall faint">${rateTxt}</span><br><span class="xsmall faint nw">공급가 ${won(sp)}</span><br><span class="xsmall faint nw">VAT ${won(vt)}</span>`;
  /* 일반 주문(같은 주문의 항목 여러 개)의 항목별 나눔과 합 — 정산서·세금계산서는 이 합만 씀 */
  function generalNote(c) {
    const g = c.inc.filter((e) => e.general); if (g.length < 2) return '';
    const fee = sum(g, (e) => e.fee), sp = sum(g, (e) => e.feeSupply), vt = sum(g, (e) => e.feeVat); const once = GC.vatSplit(fee);
    const shipRow = g.find((e) => e.ship);
    return `일반 주문 ${g[0].order}은 주문 항목마다 정산 이벤트가 따로 생겨 수수료를 항목별로 나눠 저장해요: ${g.map((e) => `${e.short} ${won(e.fee)} = ${won(e.feeSupply)} + ${won(e.feeVat)}`).join(', ')} → 일반 주문 합 ${won(fee)} = 공급가 ${won(sp)} + VAT ${won(vt)}.${once.supply !== sp ? ` 합 ${won(fee)}을 한 번에 나누면 공급가 ${won(once.supply)}로 ${won(Math.abs(once.supply - sp))} 달라져서, 정산서·월 세금계산서는 항목별 저장값의 합만 써요.` : ''}${shipRow ? ` 배송비는 묶음의 마지막 확정 항목인 ${shipRow.short} 행에 붙어요.` : ''}`;
  }
  function hqStmt(s, c) {
    const r = rates();
    const rows = c.ev.map((e) => {
      const held = e.claim && s.heldItem;
      if (e.comp) {
        return `<tr><td>${e.kind} · ${esc(e.item)}<br><span class="xsmall faint">${e.order} · ${compNote(e)}</span></td>
          <td class="num">—</td><td class="num">0원<br><span class="xsmall faint">0%</span></td><td class="num">${won(e.amount)}</td></tr>`;
      }
      const rateTxt = e.reorder ? `${r.custom.rate} − ${r.reorder.parts.reDisc} = ${e.rate}%` : `${e.rate}%`;
      return `<tr class="${held ? 'is-held' : ''}"><td>${e.kind} · ${esc(e.item)}<br><span class="xsmall faint">${e.order} · 판매가 ${won(e.sale)}${e.disc ? ` − ${esc(e.discNote)} ${won(e.disc)}${phTag(e.discPhase)}` : ''}${e.ship ? ` · 배송비 정산 +${won(e.ship)}(${esc(e.shipNote)})${phTag(e.shipPhase)}` : ''}${e.hqNote ? ` · ${esc(e.hqNote)}` : ''}</span>${held ? ` ${tag('tag-warn', '정산 보류 · 클레임 진행')}` : e.claim ? ` ${tag('tag-warn', '정산 보류 후보')}` : ''}</td>
        <td class="num">${won(e.base)}</td><td class="num">−${won(e.fee)}${feeSub(rateTxt, e.feeSupply, e.feeVat)}</td><td class="num">${held ? `<s>${won(e.amount)}</s>` : won(e.amount)}</td></tr>`;
    }).join('');
    const ded = c.res.deductions.length ? c.res.deductions.map((d) => {
      const ch = c.ch.find((x) => x.type === d.type);
      return `<tr class="is-sub"><td>본사 청구 · ${d.name} ${tag('tag-phase', ch.phase)}<br><span class="xsmall faint">${esc(ch.label)}</span></td><td></td><td></td><td class="num">−${won(d.amount)}</td></tr>`;
    }).join('') : '<tr class="is-sub"><td>본사 청구 · 없음<br><span class="xsmall faint">MVP의 본사 청구는 위약금·분쟁 조정뿐이에요</span></td><td></td><td></td><td class="num">0원</td></tr>';
    const foot = isPro()
      ? `최종율 = 기준율 − 프로 플랜 ${pv('commission.plan_discount_pro')}${phTag('2차')} → 일반 ${r.normal.rate}% · 맞춤 ${r.custom.rate}%. 본사 쿠폰 10,000원·포인트 2,000원${phTag('2차')}·멤버십 배송비 쿠폰 3,000원${phTag('2차')}은 플랫폼이 보전해 파트너 몫을 줄이지 않아요. 파트너 쿠폰${phTag('2차')}은 파트너가 부담해요.`
      : `같은 판 재주문은 판비가 0원이라 맞춤 ${r.custom.rate}%에서 재주문 인하 ${pv('commission.reorder_discount')}를 빼요. 취소 보상은 확정 후 취소에서 공제한 판비 = min(증빙한 판 실비, 고객이 낸 판비)이고 수수료가 없어요. 본사 쿠폰 10,000원(수저집 6,000 · 냅킨 4,000 안분)은 플랫폼이 보전해 파트너 몫을 줄이지 않아요(MVP 파트너 할인은 즉시 할인뿐).`;
    return `<div class="tbl-wrap"><table class="tbl small tbl-ev"><thead><tr><th>정산 이벤트</th><th class="num">수수료 기준가</th><th class="num">수수료</th><th class="num">정산액</th></tr></thead><tbody>${rows}
      <tr class="is-sum"><td>정산 이벤트 합<br><span class="xsmall faint">수수료 공급가·VAT = 이벤트별 저장값의 합</span></td><td></td><td class="num">−${won(c.fee)}<br><span class="xsmall faint nw">공급가 ${won(c.feeSupply)}</span><br><span class="xsmall faint nw">VAT ${won(c.feeVat)}</span></td><td class="num">${won(c.res.eventSum)}</td></tr>
      ${ded}<tr class="is-sub"><td>이월(직전 주기)</td><td></td><td></td><td class="num">${won(c.res.carryIn)}</td></tr>
      <tr class="is-sum"><td>이번 주기 지급액</td><td></td><td></td><td class="num">${won(c.res.payout)}</td></tr></tbody></table></div>
      <p class="xsmall faint">수수료는 VAT 포함 금액이라 VAT를 또 더하지 않고, 정산 이벤트(주문 항목)마다 공급가 = round(수수료 ÷ 1.1), VAT = 수수료 − 공급가로 나눠 저장해요. ${generalNote(c)}</p>
      <p class="xsmall faint">${foot} 디자인비는 본사 매출이라 정산 대상이 아니에요.</p>`;
  }

  const SIMS = [
    { id: 'now', label: '이번 주', carry: 0 },
    { id: 'low', label: '정산액 120,000', events: [120000], carry: 0 },
    { id: 'carry', label: '이월 −12,000', events: [80000], carry: -12000 },
    { id: 'neg', label: '정산액 −30,000', events: [-30000], carry: 0 },
    { id: 'dis', label: '분쟁 조정 청구 200,000', events: [120000], carry: 0, charges: [{ type: 'DISPUTE', amount: 200000 }], mvp: true },
  ];
  const PHASE_OF = { PLAN: '2차', AD: '3차' };
  function orderSim(s, c) {
    const sims = SIMS.filter((x) => !x.mvp || !isPro());
    const sim = sims.find((x) => x.id === s.sim) || SIMS[0];
    const evs = sim.events || c.inc.map((e) => e.amount);
    const ch = sim.charges || c.ch.map(({ type, amount }) => ({ type, amount }));
    const r = GC.settle.payout({ events: evs, carryIn: sim.carry, charges: ch });
    const taken = (t) => sum(r.deductions.filter((d) => d.type === t), (d) => d.amount);
    const billed = (t) => sum(ch.filter((x) => x.type === t), (x) => x.amount);
    const line = (t) => {
      const b = billed(t), tk = taken(t);
      if (!b) return PHASE_OF[t] && !isPro() ? `${PHASE_OF[t]} 기능 · MVP에는 없음` : '이번에는 없음';
      return r.base <= 0 ? `청구 ${won(b)} · 차감 없음 → 전액 미수금` : `청구 ${won(b)}${b > tk ? ` · 한도가 모자라 ${won(b - tk)}은 미수금` : ' · 전액 차감'}`;
    };
    const steps = [
      ['이전 마이너스 이월', sim.carry < 0 ? `정산액 계산에 먼저 반영(${won(sim.carry)}) · 차감 항목에 다시 넣지 않음` : '이번에는 없음', sim.carry < 0 ? sim.carry : 0],

          <p class="xsmall faint">지연 일수는 기한 다음 날부터 환불을 마친 날까지의 달력일이고, 환불 계좌 입력을 기다린 날처럼 고객 사정으로 늦은 기간은 빼요.</p></div></div>
      <div class="cluster"><button class="btn btn-ghost" data-act="pick" data-p="DS">대성포장으로 돌아가기</button></div></div></div>`;
  }
  function payoutList(s) {
    const st = app.state('settle'); const c = mainCalc(); const w = within24();
    const chk = !!s.payCheck;
    const note = chk ? '<span class="st st-warn">지급 확인 중</span><br><span class="xsmall faint">결과를 알 때까지 다시 안 올려요</span>' : w ? '<span class="st st-warn">정산 보류 · 계좌 변경 24시간</span>' : stChip(st);
    const rows = [{ id: 'DS', name: '대성포장', acct: s.account.mask, amount: c.res.payout, hold: chk || w || st !== 'CONFIRMED', note }];

    }
    return rows;
  }
  /* PG 응답·조회 결과는 체험용 선택(실제 연동 없음) */
  const PG_MODES = { ok: '성공', fail: '대성포장 계좌 오류', unknown: '응답 없음(시간 초과)' };

  function checkHtml(s) {
    const pc = s.payCheck;

      <dl class="kv small"><dt>지급 요청 키</dt><dd>${keyTxt()}</dd><dt>요청</dt><dd>${fmtDate(pc.at)} · ${won(pc.amount)}</dd><dt>PG 응답</dt><dd>없음(시간 초과) · 결과 모름</dd><dt>정산서 상태</dt><dd>${stChip('CONFIRMED')} 그대로</dd>${pc.tries ? `<dt>PG 조회</dt><dd>${pc.tries}번 · 확인 안 됨</dd>` : ''}</dl>

  function hqPay(s, st) {

      ${isPayDay || done ? '' : `<div class="note small">지급은 지급일(금, 공휴일이면 앞 영업일)에만 실행해요. 지금은 ${fmtDate(now)}이에요.</div>`}

      ${app.state('hb') === 'RELEASED' ? `<tr><td><b>바른용기</b><br><span class="xsmall faint">${esc(OTHERS.BR.acct)}</span></td><td class="num">${won(brCalc().release)}</td><td><span class="xsmall">유보분 · 자동 등록</span></td></tr>` : ''}
      <tr class="is-sum"><td>이번에 보낼 합계</td><td class="num">${won(total)}</td><td></td></tr></tbody></table></div>
      <p class="xsmall faint">지급액이 0원이라 목록에 없는 곳: 온누리컵(이월 −12,000원) · 새봄인쇄(미수금) · 다온인쇄(중재 판정 차감 뒤 미수금). 정산 계좌는 관리자 화면에서 마스킹으로만 보이고 고칠 수 없어요.</p></div></div>`;
    const canReq = st === 'CONFIRMED' && isPayDay && !s.req && !s.payCheck;
    const reqHtml = `<div class="panel"><div class="panel-h"><h2>1. 지급 요청</h2><span class="xsmall faint">정산 담당</span></div><div class="panel-b stack">
      ${s.req ? `<dl class="kv small"><dt>요청자</dt><dd>${ACCTS[s.req.by].name}</dd><dt>요청 시각</dt><dd>${fmtDate(s.req.at)}</dd><dt>요청 금액</dt><dd>${won(total)} · ${go.length}곳</dd></dl><div class="cluster"><button class="btn btn-sm btn-ghost" data-act="cancelReq">요청 취소</button></div>`
        : `<div class="cluster"><button class="btn btn-primary" data-act="reqPayout" ${canReq ? '' : 'disabled'}>지급 요청</button><span class="xsmall faint">${done ? '이번 지급은 끝났어요' : st !== 'CONFIRMED' ? '정산 확정된 정산서가 있어야 해요' : !isPayDay ? `${fmtDate(pd, false)}에 요청할 수 있어요` : `${a.name} 이름으로 요청돼요`}</span></div>`}</div></div>`;
    const nk = nextKey();
    const apHtml = `<div class="panel"><div class="panel-h"><h2>2. 지급 승인</h2><span class="xsmall faint">팀장 플래그 · 요청자와 다른 계정</span></div><div class="panel-b stack">
      <div class="field"><span class="lbl">PG 응답(체험용)</span><div class="seg" role="group" aria-label="PG 응답">${Object.entries(PG_MODES).map(([m, n]) => `<button data-act="pgMode" data-m="${m}" aria-pressed="${s.pgMode === m}">${n}</button>`).join('')}</div></div>
      <dl class="kv small"><dt>지급 요청 키</dt><dd>${keyTxt(nk)} <span class="xsmall faint">정산서 ID + 지급 회차 · 승인하면 PG를 부르기 전에 먼저 저장${nk.retry ? ' · 송금 안 됨이 확인된 건이라 같은 키로 다시 요청' : ''}</span></dd></dl>
      ${s.selfDenied && s.req ? `<div class="denied"><b>서버가 승인을 거부했어요</b><br><span class="small">요청자(${ACCTS[s.req.by].name})와 승인자가 같아요. 팀장 플래그가 있는 다른 계정이 승인해야 해요.</span></div>` : ''}
      <div class="cluster"><button class="btn btn-primary" data-act="approve" ${s.req ? '' : 'disabled'}>지급 승인</button><span class="xsmall faint">지금 계정: ${a.name}${a.lead ? ' (팀장 플래그)' : ' (팀장 플래그 없음)'}</span></div></div></div>`;

      ${lr.rows.map((r) => `<tr><td>${r.name}${r.key ? `<br><span class="xsmall faint">요청 키 ${r.key}</span>` : ''}</td><td class="num">${won(r.amount)}</td><td>${r.query ? RES[r.query === 'sent' ? 'ok' : 'held'] + `<br><span class="xsmall faint">PG 조회로 ${r.query === 'sent' ? '송금 확인' : '송금 안 됨 확인'}</span>` : RES[r.result]}</td></tr>`).join('')}</tbody></table></div></div></div>` : '';

  /* 9월분 발행 내역. 플랜료(2차)·광고비(3차)는 예시 2에서만.
     feeSup = 9월 정산 이벤트마다 나눠 저장한 수수료 공급가의 합(D22). 대성포장은 합계 41,820을 한 번에 나눈 38,018과 1원 다름 */
  const TAX_SEP_ALL = [
    { p: '대성포장', fee: 41820, feeSup: 38019, plan: 108900, ad: 0 },
    { p: '한빛위생', fee: 112400, feeSup: 102182, plan: 0, ad: 0 },
    { p: '새봄인쇄', fee: 9000, feeSup: 8182, plan: 108900, ad: 165000, note: '정산에서 못 뺀 미수분도 청구 기준으로 발행' },
    { p: '온누리컵', fee: 6300, feeSup: 5727, plan: 0, ad: 0, fail: true },
  ];
  const taxSep = () => TAX_SEP_ALL.map((r) => (isPro() ? r : { ...r, plan: 0, ad: 0, note: '' }));
  const CH_TAX_NAME = { PLAN: `프로 플랜 10월 구독료${phTag('2차')}`, AD: `광고비${phTag('3차')}` };
  /* 공급가·세액 표시. 수수료는 이벤트별 저장값의 합(sup)을 그대로 쓰고, 본사 청구(플랜료·광고비)는 청구 한 건이라 그 건을 나눔 */
  const splitTxt = (n, sup) => { const v = sup != null ? { supply: sup, vat: n - sup } : GC.vatSplit(n); return `공급가 ${won(v.supply)} · 세액 ${won(v.vat)}`; };
  function hqTax(s) {

  function hqRecon(s) {

    const same = (o, p, v) => [o, p, v, v, v];
    const refund = cancelComp().refund;
    const ds = isPro()
      ? [same('GC-20261006-0201', '대성포장', 134000), same('GC-20261007-0412', '대성포장', 339000), same('GC-20261009-0533', '대성포장', 48000)]

      <div class="tbl-wrap"><table class="tbl small"><thead><tr><th>주문</th><th class="num">내부 기록</th><th class="num">PG 정산</th><th class="num">은행 입금</th><th>결과</th></tr></thead><tbody>
      ${rows.map(([o, p, a, b, c, bad]) => `<tr${bad && mis ? ' class="is-held"' : ''}><td>${o}<br><span class="xsmall faint">${p}</span></td><td class="num">${won(bad && !mis ? b : a)}</td><td class="num">${won(b)}</td><td class="num">${won(c)}</td><td>${bad && mis ? '<span class="st st-stop">−1,500 · 정산 보류</span>' : '<span class="st st-done">일치</span>'}</td></tr>`).join('')}</tbody></table></div>
      ${mis ? `<div class="note note-warn small">온누리컵 1건이 PG 정산보다 1,500원 많아요. 부분 취소 반영이 빠진 것으로 보여 해당 건을 정산 보류했어요. ${lpv('recon_escalate_days')} 넘게 안 풀리면 팀장에게 알려요.</div><div class="cluster"><button class="btn" data-act="fixRecon">부분 취소 반영 확인 · 조정 전표</button></div>`
        : '<div class="note note-spot small">부분 취소 1,500원 반영 누락을 확인해 조정 전표로 맞췄어요. 마감한 월은 잠그고 수정은 조정 전표로만 해요.</div>'}
      <p class="xsmall faint">대성포장 ${ds.length}건은 모두 일치해 이번 정산 확정에 문제가 없어요.</p></div></div>`;
  }

  /* ── 파트너 센터 ── */
  const PT_TABS = { sum: '정산 요약', stmt: '정산서', tax: '세금계산서', acct: '정산 계좌' };
  VIEWS.partner = (f) => {
    const s = S(); const st = app.state('settle');
    f.nav(PT_TABS[s.ptTab]);
    f.url(`partner.sikup.co.kr/settlement/${{ sum: 'summary', stmt: 'statements', tax: 'tax-invoices', acct: 'account' }[s.ptTab]}`);
    if (st === 'CONFIRMED' && s.ptTab === 'stmt' && !s.partnerSeen) { s.partnerSeen = true; app.log('user', '파트너가 확정 정산서를 열어 봤어요'); queueRefresh(); }
    if (st === 'PAID_OUT' && s.ptTab === 'sum' && !s.partnerPaidSeen) { s.partnerPaidSeen = true; app.log('user', '파트너가 지급 내역을 확인했어요'); queueRefresh(); }
    const head = `<div class="stack-sm"><div class="split hq-head"><h3>${PT_TABS[s.ptTab]}</h3><span class="xsmall faint">대성포장 · 대표 계정 · 2단계 인증</span></div>
      <div class="seg" role="tablist" aria-label="정산 메뉴">${Object.entries(PT_TABS).map(([k, n]) => `<button data-act="ptTab" data-t="${k}" aria-pressed="${s.ptTab === k}">${n}</button>`).join('')}</div></div>`;
    f.body.innerHTML = head + { sum: ptSum, stmt: ptStmt, tax: ptTax, acct: ptAcct }[s.ptTab](s, st);
  };

  function ptSum(s, st) {
    const c = mainCalc(); const amt = c.res.payout; const k = s.cycle;
    const heldItem = s.heldItem ? sum(c.held, (e) => e.amount) : 0;
    const card = (lb, am, sb, on) => `<div class="scard${on ? ` ${on}` : ''}"><span class="lb">${lb}</span><span class="am">${am}</span>${sb ? `<span class="sb">${sb}</span>` : ''}</div>`;
    const reasons = [];
    if (s.heldItem) reasons.push(`종이컵 2박스 ${won(heldItem)} · 클레임 진행 중 · 끝나면 다음 정산에 들어가요`);
    if (st === 'ON_HOLD' && s.hold) reasons.push(`10월 2주차 정산 ${won(amt)} · ${esc(s.hold.label)} · 다음 지급일에 보내요`);
    const cards = [
      card('정산 예정', !s.closed ? won(amt) : st === 'SCHEDULED' ? won(amt) : '0원', !s.closed ? '마감 전 · 집계 중' : st === 'SCHEDULED' ? '본사 정산 확정 전' : '', st === 'SCHEDULED' || !s.closed ? 'is-on' : ''),
      card('정산 보류', won(heldItem + (st === 'ON_HOLD' ? amt : 0)), reasons.length ? `${reasons.length}건 · 아래 사유` : '없음', heldItem || st === 'ON_HOLD' ? 'is-warn' : ''),
      card('정산 확정', st === 'CONFIRMED' ? won(amt) : '0원', st === 'CONFIRMED' ? (s.payCheck ? '지급 결과 확인 중' : '정산서 공개됨') : '', st === 'CONFIRMED' ? 'is-on' : ''),
      card('지급 완료', st === 'PAID_OUT' ? won(amt) : '0원', st === 'PAID_OUT' ? fmtDate(s.paidAt) : '이번 주기', st === 'PAID_OUT' ? 'is-on' : ''),
      card('다음 지급일', fmtDate(payDayOf(st === 'ON_HOLD' ? nextCycleAfter(app.clock.now(), k + 1) : k), false), st === 'PAID_OUT' ? '지급 끝 · 다음 주기' : st === 'ON_HOLD' ? '정산 보류가 풀리면 이날 함께' : '금요일(공휴일이면 앞 영업일)'),
      card('미수금 잔액', '0원', c.ch.length ? '본사 청구를 모두 정산에서 뺐어요' : '본사 청구 없음'),
    ].join('');
    const weeks = [
      [`10월 2주차<br><span class="xsmall faint">${fmtDate(PERIOD.from, false)}~${fmtDate(PERIOD.to, false)}</span>`, !s.closed ? '집계 중' : stName(st), amt, st === 'PAID_OUT' ? fmtDate(s.paidAt, false) : `${fmtDate(payDayOf(st === 'ON_HOLD' ? nextCycleAfter(app.clock.now(), k + 1) : k), false)} 예정`, true],
      ['10월 1주차<br><span class="xsmall faint">9/29(화)~10/5(월)</span>', '지급 완료', LAST_WEEK, '10/9(금)'],
      ['9월 5주차<br><span class="xsmall faint">9/22(화)~9/28(월)</span>', '지급 완료', 96400, '10/2(금)'],
    ];
    return `<div class="sum-grid">${cards}</div>
      ${reasons.length ? `<div class="note note-warn small"><b>정산 보류 사유</b><br>${reasons.join('<br>')}</div>` : ''}
      ${st === 'PAID_OUT' ? `<div class="panel"><div class="panel-h"><h2>지급 내역</h2><span class="xsmall faint">토스페이먼츠 지급대행</span></div><div class="panel-b"><dl class="kv small"><dt>지급일</dt><dd>${fmtDate(s.paidAt)}</dd><dt>계좌</dt><dd>${esc(s.account.mask)} · ${esc(s.account.holder)}</dd><dt>금액</dt><dd>${won(amt)}</dd><dt>정산서</dt><dd>10월 2주차 · 엑셀로 내려받을 수 있어요</dd></dl></div></div>` : ''}
      <div class="panel"><div class="panel-h"><h2>주차별 정산</h2><span class="xsmall faint">화 마감 · 수~목 정산 확정 · 금 지급</span></div><div class="panel-b"><div class="tbl-wrap"><table class="tbl small tbl-nw"><thead><tr><th>정산 주기</th><th>상태</th><th class="num">지급액</th><th>지급일</th></tr></thead><tbody>
        ${weeks.map(([p, sn, a, d, hl]) => `<tr${hl ? ' class="is-hl"' : ''}><td>${p}</td><td>${sn}</td><td class="num">${won(a)}</td><td>${d}</td></tr>`).join('')}</tbody></table></div></div></div>
      ${calcHtml(s)}`;
  }

  function calcHtml(s) {
    const c = s.calc; const r = GC.settle.finalRate({ base: c.base, plan: c.plan, newPartner: c.newP, reorder: c.re, promoAdd: c.promo });
    const fee = GC.settle.commission(300000, r.rate); const v = GC.vatSplit(fee); const p = r.parts;
    const bases = [[8, '8%'], [P('commission.default_rate'), `${P('commission.default_rate')}% 일반`], [P('commission.custom_rate'), `${P('commission.custom_rate')}% 맞춤`], [15, '15%']];
    const plans = [['BASIC', '베이직'], ['PRO', `프로 −${P('commission.plan_discount_pro')}%p`], ['PREMIUM', `프리미엄 −${P('commission.plan_discount_premium')}%p`]];
    return `<div class="panel"><div class="panel-h"><h2>수수료율 계산기</h2><span class="xsmall faint">C-STL-01 최종율</span></div><div class="panel-b stack">
      <div class="field"><span class="lbl">기준율(카테고리 요율 또는 파트너 예외 요율)</span><div class="seg" role="group" aria-label="기준율">${bases.map(([b, n]) => `<button data-act="calcBase" data-v="${b}" aria-pressed="${c.base === b}">${n}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl">파트너 플랜 ${tag('tag-phase', '2차')}</span><div class="seg" role="group" aria-label="플랜">${plans.map(([k, n]) => `<button data-act="calcPlan" data-v="${k}" aria-pressed="${c.plan === k}">${n}</button>`).join('')}</div></div>
      <label class="check"><input type="checkbox" data-change="calcNew" ${c.newP ? 'checked' : ''}><span>신규 입점 3개월 (−${P('commission.new_partner_discount')}%p)</span></label>
      <label class="check"><input type="checkbox" data-change="calcRe" ${c.re ? 'checked' : ''}><span>같은 판 재주문 (−${P('commission.reorder_discount')}%p · 맞춤 재주문, 판비 0원일 때만)</span></label>
      <div class="field"><span class="lbl">기획전 가산 ${tag('tag-phase', '2차')}</span><div class="seg" role="group" aria-label="기획전 가산">${[0, 1, 2].map((x) => `<button data-act="calcPromo" data-v="${x}" aria-pressed="${c.promo === x}">${x ? `+${x}%p` : '없음'}</button>`).join('')}</div></div>
      <div class="split"><span class="formula">max(${p.floor}%, ${p.base} − ${p.planDisc} − ${p.newDisc} − ${p.reDisc} + ${p.promoAdd})</span><span class="calc-out">${r.rate}%</span></div>
      ${r.floored ? `<p class="small">${tag('tag-warn', '하한 적용')} 계산값 ${r.raw}%가 하한 ${pv('commission.floor')}보다 낮아 ${p.floor}%를 써요.</p>` : ''}
      <p class="small">판매가 300,000원(파트너 할인 없음)이면 수수료 <b>${won(fee)}</b> = 공급가 ${won(v.supply)} + VAT ${won(v.vat)}</p>
      <p class="xsmall faint">기준율 8~15%는 카테고리별 범위 예시예요. 수수료율이 기간 중에 바뀌어도 결제 시점 요율을 주문 항목에 저장해 써요.</p></div></div>`;
  }

  function ptItems(c) {
    const inc = c.inc; const pro = isPro();
    const inst = sum(inc.filter((e) => e.discType === 'instant'), (e) => e.disc);
    const cpn = sum(inc.filter((e) => e.discType === 'coupon'), (e) => e.disc);
    const comp = sum(inc.filter((e) => e.comp), (e) => e.amount);
    const dedNames = c.res.deductions.map((d) => `${d.name} ${won(d.amount)}`).join(' → ');
    /* [항목, 가감, 금액, 설명, 단계 태그] */
    const rows = [
      ['판매 금액', '+', sum(inc.filter((e) => e.sale != null), (e) => e.sale), '구간 단가를 적용한 VAT 포함 판매가(할인 전)'],
      ['파트너 즉시 할인', '−', -inst, '파트너 부담'],
      ['파트너 상품 쿠폰 할인', '−', -cpn, pro ? '파트너 부담' : 'MVP에는 없음', '2차'],
      ['본사 쿠폰·멤버십 할인', '0', 0, pro ? '본사 쿠폰 10,000 · 포인트 2,000(2차) · 배송비 쿠폰 3,000(2차) — 플랫폼 보전, 참고 표시' : '본사 쿠폰 10,000 — 플랫폼 보전, 참고 표시'],
      ['배송비', '+', sum(inc, (e) => e.ship || 0), pro ? '고객 1,000 + 멤버십 배송비 쿠폰 보전 3,000(2차) · 수수료 없음' : '고객이 낸 배송비 · 수수료 없음'],
      ['판매 수수료', '−', -c.fee, `VAT 포함 · 공급가 ${won(c.feeSupply)} + VAT ${won(c.feeVat)}(정산 이벤트마다 나눠 저장한 값의 합)`],
      ['반품 배송비', '±', 0, '이번 주기 없음'],
      ['취소 보상(판비 실비)', '+', comp, comp ? `min(증빙 실비 ${won(PLATE.cost)}, 낸 판비 ${won(PLATE.fee)}) · 수수료 0%` : '이번 주기 없음 · 수수료 0%'],
      ['재제작 비용', '+', 0, '이번 주기 없음'],
      ['중재 판정·조정', '±', 0, '이번 주기 없음'],
      ['이월', '±', c.res.carryIn, '지난 주기에서 넘어온 값 하나'],
      ['본사 청구 차감', '−', -c.ded, c.ded ? dedNames + ' (VAT 포함)' : '없음 · MVP의 본사 청구는 위약금·분쟁 조정뿐'],
    ];
    return `<div class="tbl-wrap"><table class="tbl small"><thead><tr><th>정산서 항목</th><th>가감</th><th class="num">금액</th></tr></thead><tbody>
      ${rows.map(([n, sg, v, d, ph]) => `<tr${v === 0 && sg !== '0' ? ' class="is-zero"' : ''}><td>${n}${phTag(ph)}<br><span class="xsmall faint">${esc(d)}</span></td><td>${sg}</td><td class="num">${won(v)}</td></tr>`).join('')}
      <tr class="is-sum"><td>지급액</td><td>=</td><td class="num">${won(c.res.payout)}</td></tr></tbody></table></div>`;
  }

  function ptStmt(s, st) {
    const c = mainCalc();
    let top;
    if (!s.confirmedOnce) {
      top = `<div class="note small">10월 2주차 정산서는 본사 정산 확정(수~목) 뒤에 공개돼요. ${s.closed ? `지금은 예정 금액만 보여요: <b>${won(c.res.payout)}</b>` : '아직 화요일 0시 마감 전이에요.'}</div>`;
    } else {
      const evRow = (e) => (e.comp
        ? `<tr><td>${e.kind} · ${esc(e.item)}<br><span class="xsmall faint">${e.order} · ${compNote(e)}</span></td><td class="num">—</td><td class="num">0원<br><span class="xsmall faint">0%</span></td><td class="num">${won(e.amount)}</td></tr>`
        : `<tr><td>${e.kind} · ${esc(e.item)}<br><span class="xsmall faint">${e.order}${e.disc ? ` · ${esc(e.discNote)} −${won(e.disc)}${phTag(e.discPhase)}` : ''}${e.ship ? ` · 배송비 +${won(e.ship)}${phTag(e.shipPhase)}` : ''}</span></td><td class="num">${won(e.sale)}</td><td class="num">−${won(e.fee)}${feeSub(`${e.rate}%${e.reorder ? ' · 재주문' : ''}`, e.feeSupply, e.feeVat)}</td><td class="num">${won(e.amount)}</td></tr>`);
      const gn = generalNote(c);
      top = `<div class="panel"><div class="panel-h"><h2>10월 2주차 정산서 · ${fmtDate(PERIOD.from, false)}~${fmtDate(PERIOD.to, false)}</h2><span class="cluster">${scnTag()}${stChip(st)}</span></div><div class="panel-b stack">
        <div class="tbl-wrap"><table class="tbl small tbl-ev"><thead><tr><th>정산 이벤트</th><th class="num">판매 금액</th><th class="num">수수료</th><th class="num">정산액</th></tr></thead><tbody>
          ${c.inc.map(evRow).join('')}</tbody></table></div>
        ${gn ? `<p class="xsmall faint">${gn}</p>` : ''}
        ${ptItems(c)}
        ${s.heldItem ? `<p class="xsmall faint">정산 보류 1건(종이컵 2박스 ${won(sum(c.held, (e) => e.amount))} · 클레임 진행)은 이 정산서에 없고, 클레임이 끝나면 그때 생긴 정산 이벤트로 다음 정산에 들어가요.</p>` : ''}
        <div class="cluster"><button class="btn btn-sm" data-act="dlExcel">엑셀 내려받기</button><button class="btn btn-sm btn-ext" data-act="objection">항목 이의 제기</button></div></div></div>`;
    }
    return top + ledgerHtml(s);
  }

  function ledgerHtml(s) {
    const weeks = ledgerRun(); const n = s.ledgerStep;
    const cell = (i, fn) => (i < n ? fn(weeks[i]) : '<span class="faint">·</span>');
    const recvIn = (w) => sum(w.r.deductions.filter((d) => d.fromReceivable), (d) => d.amount);
    const newDed = (w) => sum(w.r.deductions.filter((d) => !d.fromReceivable), (d) => d.amount);
    const rowsDef = [
      ['구매 확정', (w) => GC.signedWon(sum(w.events.filter((e) => e.a > 0), (e) => e.a))],
      ['반품 역분개', (w) => { const v = sum(w.events.filter((e) => e.a < 0), (e) => e.a); return v ? GC.signedWon(v) : '—'; }],
      ['이월(지난 주기)', (w) => won(w.carryIn)],
      ['정산액', (w) => won(w.r.base), 'is-sum'],
      ['미수금 먼저 차감', (w) => (recvIn(w) ? `−${won(recvIn(w))}` : '—')],
      [`이번 주 광고비 차감${phTag('3차')}`, (w) => { const b = sum(w.charges, (x) => x.amount); if (!b) return '청구 없음'; return w.r.base <= 0 ? `0 (청구 ${won(b)})` : `−${won(newDed(w))}${newDed(w) < b ? ` (청구 ${won(b)})` : ''}`; }],
      ['지급액', (w) => won(w.r.payout), 'is-sum'],
      ['넘김 · 이월', (w) => won(w.r.carryOut)],
      ['넘김 · 미수금', (w) => won(sum(w.r.receivables, (x) => x.amount))],
    ];
    const max = 80000;
    const pct = (v) => Math.min(100, Math.round((Math.abs(v) / max) * 100));
    const viz = weeks.slice(0, n).map((w) => {
      const rv = sum(w.r.receivables, (x) => x.amount);
      const bar = (cls, v, t) => (v ? `<i class="lb-bar ${cls}" style="width:${pct(v)}%" title="${t} ${won(v)}"></i>` : '');
      return `<div class="lrow-v"><span>${w.label}</span><div class="ltrack">
        ${bar(w.r.base < 0 ? 'lb-neg' : 'lb-pos', w.r.base, '정산액')}${bar('lb-pay', w.r.payout, '지급액')}${bar('lb-recv', rv, '미수금 잔액')}</div></div>`;
    }).join('');
    return `<div class="panel"><div class="panel-h"><h2>이월·미수금 원장 미리 보기</h2><span class="xsmall faint">C-STL-01 예시 3 · 예시 2 파트너의 이후 3주기</span></div><div class="panel-b stack">
      <p class="small muted">반품 역분개와 본사 청구가 몰리는 주가 이어지면 이렇게 넘어가요. [다음 주기 계산]으로 한 주씩 넘겨 보세요. 광고비${phTag('3차')} 자리에 위약금·분쟁 조정이 오면 MVP에서도 같은 규칙으로 미수금이 생겨요.</p>
      <div class="tbl-wrap"><table class="tbl small"><thead><tr><th>원장</th>${weeks.map((w, i) => `<th class="num">${w.label}<br><span class="xsmall faint">${fmtDate(payDayOf(i + 1), false)} 지급</span></th>`).join('')}</tr></thead><tbody>
        ${rowsDef.map(([lb, fn, cls]) => `<tr${cls ? ` class="${cls}"` : ''}><td>${lb}</td>${weeks.map((_, i) => `<td class="num">${cell(i, fn)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

      const s = S(); s.reauthed = true; s.pgMode = 'ok'; s.account = { ...ACCOUNT_FIXED }; s.acctChange = { at: app.clock.now(), cleared: false };
      app.log('user', '파트너가 정산 계좌를 다시 인증했어요');
      app.notify('NOTI_PARTNER_ACCOUNT_CHANGED', '대성포장', ['알림톡', '이메일', '알림센터'], '정산 계좌 재인증 완료 · 다음 지급일에 보내요');
      refresh();
    },
    dlExcel() { app.toast('정산서를 엑셀로 내려받았어요'); app.log('user', '파트너가 10월 2주차 정산서 엑셀 내려받기'); },
    async objection() { await app.ext({ service: '채널톡', what: '정산서 항목 이의 제기', lines: ['항목 정보(주문번호·이벤트·금액)를 담아 파트너 1:1 문의로 넘겨요', '정산 확정된 정산서는 고치지 않고, 오류면 다음 주기에 조정 이벤트로 반영해요'], result: '문의가 접수된 것으로 처리해요' }); },
    async taxPdf() { await app.ext({ service: '팝빌', what: '세금계산서 PDF 내려받기', lines: ['국세청 전송 상태와 승인번호가 함께 나와요'] }); },
    consent(t) { S().consent = t.checked; app.log('user', `위수탁 발행 ${t.checked ? '동의' : '동의 철회'}`); refresh(); },
    ledgerNext() {
      const s = S(); if (s.ledgerStep >= 3) return;
      const w = ledgerRun()[s.ledgerStep]; s.ledgerStep += 1;
      app.log('money', `원장 미리 보기 ${w.label}: 정산액 ${won(w.r.base)} · 지급 ${won(w.r.payout)} · 이월 ${won(w.r.carryOut)} · 미수금 ${won(sum(w.r.receivables, (x) => x.amount))}`);
      refresh();
    },
    ledgerReset() { S().ledgerStep = 0; refresh(); },
    calcBase(b) { S().calc.base = Number(b.dataset.v); refresh(); },
    calcPlan(b) { S().calc.plan = b.dataset.v; refresh(); },
    calcPromo(b) { S().calc.promo = Number(b.dataset.v); refresh(); },
    calcNew(t) { S().calc.newP = t.checked; refresh(); },
    calcRe(t) { S().calc.re = t.checked; refresh(); },
    runClose() {
      const ms = CLOSE_AT - app.clock.now();
      if (ms > 0) { app.log('user', '시스템: 시계를 화요일 0시로 보냈어요'); app.clock.pass(ms); }
      else if (!S().closed) runClose();
      refresh();
    },
    async payRecv() {
      await app.ext({ service: '토스페이먼츠', what: '청구서 가상계좌 입금 확인', lines: ['새봄인쇄 전용 가상계좌 입금 웹훅을 받아요', '미수금 원장을 0원으로 정리하고 세금계산서는 이미 청구 기준으로 발행돼 있어요'], result: '입금된 것으로 처리해요' });
      const stopped = app.state('recv') === 'SALES_STOPPED';
      app.go('recv', 'pay', { by: stopped ? '납부 확인 · 판매 다시 열림' : '기한 안 납부' });
      app.log('money', `새봄인쇄 미수금 ${won(sum(otherCalc('SB').receivables, (x) => x.amount))} 납부 · 원장 0원`);
      refresh();
    },
    async toRecvDue() {
      const s = S(); const ms = s.recv.due - app.clock.now(); if (ms <= 0) return;
      if (app.state('settle') !== 'PAID_OUT' && !(await app.confirm({ title: '납부 기한까지 시간을 보낼까요?', body: '<p class="small">시계가 함께 움직여서 대성포장 기본 흐름의 기한(정산 확정일·지급일)도 지나갈 수 있어요.</p>', ok: '시간 보내기' }))) return;
      app.clock.advance(ms, `새봄인쇄 납부 기한까지 시간을 보냈어요 → ${fmtDate(s.recv.due)}`);
    },
    async toHoldEnd() {
      const s = S(); const ms = s.hb.releaseAt - app.clock.now(); if (ms <= 0) return;
      if (app.state('settle') !== 'PAID_OUT' && !(await app.confirm({ title: '90일을 한 번에 보낼까요?', body: '<p class="small">시계가 함께 움직여서 대성포장 기본 흐름의 기한도 지나가요.</p>', ok: '시간 보내기' }))) return;
      app.clock.advance(ms, `바른용기 유보 해제일까지 시간을 보냈어요 → ${fmtDate(s.hb.releaseAt)}`);
    },
  });

  /* ── 시간이 흐를 때: 마감 배치·기한·자동 처리 ── */
  app.onAdvance((prev, now) => {
    const s = S();
    if (!s.closed && now >= CLOSE_AT) runClose();
    const st = app.state('settle');
    if (st === 'SCHEDULED' && s.closed && now >= confirmBy(s.cycle)) {
      const old = s.cycle; s.cycle = nextCycleAfter(now, old);
      app.log('warn', `목요일까지 정산 확정하지 않아 지급일이 ${fmtDate(payDayOf(old), false)} → ${fmtDate(payDayOf(s.cycle), false)}로 밀렸어요`);
      app.log('noti', `파트너 공지 → 대성포장: 지급일 변경 안내(${fmtDate(payDayOf(s.cycle), false)})`);
    }
    if (st === 'CONFIRMED' && !s.payCheck && now >= payDayEnd(s.cycle)) { // 확인 중인 지급은 다음 지급일로 자동으로 넘기지 않음
      const old = s.cycle; let k = old; while (payDayEnd(k) <= now) k += 1; s.cycle = k; s.req = null; s.selfDenied = false;
      app.log('warn', `지급일(${fmtDate(payDayOf(old), false)})에 지급을 실행하지 않아 ${fmtDate(payDayOf(k), false)}로 밀렸어요`);
      app.log('noti', `파트너 공지 → 대성포장: 지급 지연 사유와 예정일(${fmtDate(payDayOf(k), false)})`);
    }
    if (s.acctChange && !s.acctChange.cleared && now - s.acctChange.at >= holdMs()) {
      s.acctChange.cleared = true;
      app.log('rule', `계좌 변경 뒤 ${P('settlement.account_change_hold_hours')}시간이 지났어요 → 계좌 변경 정산 보류 사유 해소`);
    }
    if (s.recon && !s.recon.resolved && !s.mismatchNotified && now - s.recon.at >= L('recon_escalate_days') * DAY) {
      s.mismatchNotified = true;
      app.notify('NOTI_INT_RECON_MISMATCH', '정산 팀장(한재무)', ['이메일', '관리자 알림', 'Slack'], `대사 불일치가 ${L('recon_escalate_days')}일 넘게 안 풀렸어요`);
    }
    if (app.state('recv') === 'INVOICED' && s.recv.due) {
      const notice = new Date(s.recv.due.getTime() - L('stop_notice_days') * DAY);
      if (!s.recv.noticed && now >= notice) { s.recv.noticed = true; app.notify('NOTI_PARTNER_SALES_STOP_NOTICE', '새봄인쇄', ['알림톡', '이메일', '알림센터'], `${fmtDate(s.recv.due, false)}까지 미수금을 내지 않으면 판매가 멈춰요`); }
      if (now >= s.recv.due) {
        app.go('recv', 'overdue', { by: `납부 기한(${fmtDate(s.recv.due, false)}) 경과` });
        app.log('rule', '새봄인쇄 판매 중지: 상품 노출을 멈추고 진행 중인 주문·클레임은 계속 처리해요');
      }
    }
    if (app.state('hb') === 'HOLDING' && s.hb.start) {
      if (!s.hb.late && now - s.hb.start >= LATE_CLAIM_DAY * DAY) { s.hb.late = true; app.log('money', `바른용기 늦은 반품 역분개 −${won(LATE_CLAIM)} → 유보분에서 차감`); }
      if (now >= s.hb.releaseAt) {
        if (!s.hb.late) { s.hb.late = true; app.log('money', `바른용기 늦은 반품 역분개 −${won(LATE_CLAIM)} → 유보분에서 차감`); }
        app.go('hb', 'release', { by: `${L('holdback_days')}일 경과 · 유보분 ${won(brCalc().release)} 지급 목록 자동 등록` });
      }
    }
    if (!s.taxIssuedOct && prev < NOV1 && now >= NOV1) {
      s.taxIssuedOct = true;
      app.log('ext', `팝빌 · 10월분 ${isPro() ? '수수료·플랜료·광고비' : '판매 수수료'} 세금계산서 월 합계 일괄 발행(정산 확정분 기준)`);
    }
    guide();
  });
})();
</script>
