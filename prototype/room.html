<style>
  /* 누가 무엇을 보는가 */
  .mx-panel { margin-top: 18px; }
  .mx { font-size: 13px; }
  .mx td, .mx th { padding-block: 6px; }
  .mx td:first-child { min-width: 230px; }
  .mx td:first-child b { font-weight: 600; margin-right: 6px; }
  .mx th .ink { margin-right: 6px; vertical-align: -1px; }
  .mx th.is-me, .mx td.is-me { background: var(--sheet-3); }
  .mx th.is-me { box-shadow: inset 0 -2px 0 var(--ink); color: var(--ink); }
  .mx .on { color: var(--spot); font-weight: 600; }
  .mx .off { color: var(--ink-3); }
  .mx .part { color: var(--ink-2); }
  /* 대화 */
  .chat { display: grid; gap: 8px; padding: 12px 14px 16px; align-content: start; }
  .bubble.me.as-m { background: var(--m-weak); }
  .bubble.me.as-y { background: var(--y-weak); }
  .bubble.is-recalled { background: transparent; border: 1px dashed var(--rule-strong); }
  .bubble.sys.is-warn { border: 1px solid var(--warn); background: var(--warn-weak); color: var(--ink); text-align: left; }
  .bubble.sys.is-stop { border: 1px solid var(--stop); background: var(--stop-weak); color: var(--ink); text-align: left; }
  .bmeta { font-size: 11px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: baseline; }
  .bubble.them .bmeta { justify-content: flex-start; }
  .bmeta button { border: 0; background: none; padding: 0; font: inherit; color: var(--stop); text-decoration: underline; cursor: pointer; }
  .typing { font-size: 12px; color: var(--ink-3); justify-self: start; }
  .rcard { justify-self: stretch; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 8px; font-size: 13.5px; }
  .rcard.is-decision { border-left: 3px solid var(--spot); }
  .rcard .rc-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; }
  .rcard .rc-h small { font-weight: 500; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
  .rcard .kv { font-size: 12.5px; gap: 4px 12px; }
  .proof-mini svg { display: block; width: 100%; height: auto; border-radius: 4px; }
  .file-chip { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
  .file-ico { width: 40px; height: 46px; border: 1px solid var(--rule-strong); border-radius: 4px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--ink-2); background: var(--sheet-2); }
  .file-prev { margin-top: 6px; height: 64px; border-radius: 6px; border: 1px solid var(--rule); background: repeating-linear-gradient(135deg, var(--sheet-3) 0 6px, var(--sheet-2) 6px 12px); display: grid; place-items: center; font-size: 11.5px; color: var(--ink-2); text-align: center; padding: 0 8px; }
  /* 고객 앱 */
  .room-head { padding: 12px 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
  .composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .composer.no-attach { grid-template-columns: minmax(0, 1fr) auto; }
  .composer .input { min-height: 40px; }
  .ex-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; align-items: center; }
  .ex-row .lbl { font-size: 11px; color: var(--ink-3); flex: none; }
  .ex-row .btn { flex: none; white-space: nowrap; min-height: 30px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; }
  .attach-list { display: grid; gap: 6px; }
  .attach-list .btn { justify-content: space-between; font-weight: 500; font-size: 13px; min-height: 36px; }
  .rev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr); gap: 6px; align-items: center; }
  .rev-from { min-height: auto; display: block; color: var(--ink-2); }
  /* 데스크 */
  .chat-box { max-height: 440px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet-2); }
  .room-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
  @media (max-width: 720px) { .room-top { grid-template-columns: minmax(0, 1fr); } }
  .memo { border-left: 3px solid var(--m); background: var(--sheet-2); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 13.5px; display: grid; gap: 2px; }
  .memo .mention { color: var(--m); font-weight: 600; }
  .seg .cnt { font-size: 11px; font-weight: 700; color: var(--stop); margin-left: 4px; }
  .seg button[aria-pressed="true"] .cnt { color: var(--paper); }
</style>

    async reveal(b) {
      const s = S(); const v = s.vault.find((x) => x.id === b.dataset.id); if (!v || !s.hqReason) return;
      const ok = await app.confirm({ title: '가린 원문을 열람할까요?', body: `<p>사유: ${esc(s.hqReason)}</p><p class="small muted">열람한 계정·시각·IP·대상·사유가 감사 로그에 남고, 로그는 고칠 수 없어요.</p>`, ok: '열람하기' });
      if (!ok) return;
      v.revealed = true;
      s.audit.push({ at: app.clock.now(), who: OPS.name, ip: OPS.ip, act: '가린 원문 열람(마스킹 해제)', target: `${v.id} · ${CH_NAME[v.ch]} · ${whoLabel(v.from)}`, reason: s.hqReason });
      app.log('rule', `감사 로그: ${esc(OPS.name)}가 ${v.id} 원문 열람 · 사유 “${esc(s.hqReason)}” (A-SYS-02)`);
      s.f.hqreveal = true; refresh();
    },
    hqOpenRoom() {
      const s = S(); s.hqRoomOpen = true;
      s.audit.push({ at: app.clock.now(), who: OPS.name, ip: OPS.ip, act: '협의 룸 열람', target: `${REQ.id} 협의 룸·생산 협의 채널`, reason: s.hqReason || '모니터링' });
      app.log('rule', '감사 로그: 운영자가 협의 룸 열람(D-ROOM-01)');
      refresh();
    },
    toEvening() {
      const now = app.clock.now();
      let t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0);
      if (t <= now) t = new Date(t.getTime() + GC.DAY);
      app.clock.advance(t - now, `운영시간 밖으로 시간을 보냈어요 → ${fmtDate(t)}`);
    },
    skip90() {
      if (app.state('room') !== 'DONE') return;
      app.clock.advance(RP.reinquiryDays * GC.DAY, `시간을 ${RP.reinquiryDays}일 보냈어요`);
    },
  };
  app.actions(ACT);
  /* 입력 칸에서 Enter로 보내기(한글 조합 중에는 무시) */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    const t = e.target; if (!t || !t.dataset || !t.dataset.send) return;
    e.preventDefault(); const fn = ACT[t.dataset.send]; if (fn) fn(t, e);
  });

  /* ── 시간이 흐를 때: 알림 묶음 · 무응답 · 읽기 전용 ── */
  app.onAdvance((prev, now) => {
    const s = S(); if (!s.msgs) return;
    const dm = GC.Policy.get('notify.room_digest_minutes');
    ['customer', 'partner', 'design', 'dprd'].forEach((t) => { const u = s.unread[t]; if (u.since && now - u.since >= dm * MIN) sendDigest(t); });
    const st = app.state('room');
    if (s.waitSince && ['WAIT_CUSTOMER', 'ON_HOLD'].includes(st)) {
      const days = Math.floor((now - s.waitSince) / GC.DAY);
      const RM = GC.Policy.get('design.no_response_remind_days'), HD = GC.Policy.get('design.no_response_hold_days'), CD = GC.Policy.get('design.no_response_cancel_days');
      if (days >= RM && !s.fired.rm) { s.fired.rm = true; app.notify('NOTI_DESIGN_REMIND', '고객', C4, `시안 확인을 기다리고 있어요 (${RM}일째)`); }
      if (st === 'WAIT_CUSTOMER') noticeStep('hn', HD, days, now, '보류', () => app.notify('NOTI_DESIGN_HOLD_NOTICE', '고객', C5, '내일 보류 처리돼요'), () => {
        app.go('room', 'hold', { by: `${HD}일 무응답 · 예고 뒤 ${GC.Policy.get('notify.notice_min_hours')}시간 지남 · 보류 전 상태(고객 확인 대기) 저장` });
        addMsg({ ch: 'room', from: 'system', kind: 'sys', tone: 'warn', html: `${HD}일 동안 답이 없어 보류했어요. 메시지를 보내거나 [진행 재개]를 누르면 이어서 진행해요.` });
        app.notify('NOTI_DESIGN_ON_HOLD', '고객', C5, '보류 전환');
        app.log('rule', '보류 중에는 SLA 타이머가 멈추고 디자이너 업무량에서도 빠져요');
      });
      if (st === 'ON_HOLD') noticeStep('cn', CD, days, now, '자동 취소', () => app.notify('NOTI_DESIGN_CANCEL_NOTICE', '고객', C5, '내일 자동 취소돼요'), () => {
        app.go('room', 'auto_cancel', { by: `${CD}일 무응답 · 예고 뒤 ${GC.Policy.get('notify.notice_min_hours')}시간 지남 · 자동 취소` });
        s.canceled = true; s.doneAt = now; s.waitSince = null;
        addMsg({ ch: 'room', from: 'system', kind: 'sys', tone: 'stop', html: `${CD}일 동안 답이 없어 자동 취소했어요. 첫 시안을 받은 뒤라 디자인비를 빼고 환불해요. ${RP.reinquiryDays}일 동안은 재문의를 남길 수 있어요.` });
        app.notify('NOTI_DESIGN_AUTO_CANCELED', '고객', C5, '자동 취소 · 공제·환불 내역');
        app.log('money', `자동 취소 · 첫 시안 뒤라 디자인비 ${won(GC.Policy.get('design.fee'))} 공제 후 환불(C-PAY-02)`);
      });
    }
    if (app.state('room') === 'DONE' && s.doneAt && now - s.doneAt >= RP.reinquiryDays * GC.DAY) {
      app.go('room', 'expire', { by: `완료 후 ${RP.reinquiryDays}일` });
      addMsg({ ch: 'room', from: 'system', kind: 'sys', html: `완료 후 ${RP.reinquiryDays}일이 지나 읽기 전용이 됐어요. 기록은 분쟁 3년, 계약·확정 5년 보관해요.` });
      app.log('rule', '룸 읽기 전용 전환 · 보관: 분쟁 기록 3년 / 계약·확정 기록 5년(C-FILE-01)');
    }
    guide();
  });
})();
</script>
