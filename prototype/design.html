<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맞춤 디자인 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  .methods { display: grid; gap: 10px; }
  .method { text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .method .mrow { display: grid; grid-template-columns: 78px minmax(0, 1fr); font-size: 13px; gap: 6px; }
  .method .mrow span:first-child { color: var(--ink-3); }
  .method .mh { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .method .mh small { font-size: 13px; color: var(--spot); font-weight: 700; }
  .method .moff { display: block; }
  .steps-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .steps-mini span { font-size: 11px; text-align: center; padding: 4px 0; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .steps-mini span.on { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips-row .tag { font-size: 12.5px; padding: 3px 9px; }
  .chips-row .tag.med-chip { white-space: normal; text-align: left; cursor: pointer; max-width: 100%; }
  .proof-wrap { position: relative; padding: 18px 16px; color: var(--ink-3); }
  .proof-wrap .pin-hit { position: absolute; inset: 18px 16px; cursor: crosshair; }
  .pin-list { display: grid; gap: 6px; }
  .pin-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; font-size: 13.5px; align-items: start; }
  .pin-no { width: 22px; height: 22px; border-radius: 50%; background: var(--m); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .pin-no.ok { background: var(--kraft); }
  .snapshot { font-size: 12px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; overflow-x: auto; white-space: pre; font-family: var(--body); line-height: 1.5; }
  .ws { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; }
  @media (max-width: 1100px) { .ws { grid-template-columns: minmax(0, 1fr); } }
  .ver-list { display: grid; gap: 8px; }
  .ver { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; }
  .ver b { font-size: 15px; }
  .hold-banner { border: 2px solid var(--stop); background: var(--stop-weak); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
  .money-flow .tbl td.num { white-space: nowrap; }
  .nw { white-space: nowrap; }
  .ptbl { min-width: 560px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate } = GC;
  const esc = UI.esc, pv = UI.pv;

  /* ── 시나리오 데이터 (기획서 06장 협의 룸 예시: 오늘밥상 · 수저집) ── */
  const STORE = { name: '오늘밥상', biz: '한식', phone: '02-000-0000', insta: '@todaybapsang', branch: '강남점' };
  const PRODUCT = {
    name: '크라프트 수저집 40×240mm', partner: '대성포장', unit: '1,000매',
    normalTiers: [{ min: 1, price: 32000 }, { min: 5, price: 30000 }, { min: 10, price: 28000 }],
    tiers: [{ min: 10, price: 30000 }, { min: 30, price: 26000 }], // 맞춤: 1,000매당
    instant: { type: 'amount', value: 1000 }, plateFee: 50000, leadDays: 7,
  };
  const QTYS = [10, 20, 30];
  const DESIGNERS = [{ id: 'kim', name: '김하린', load: 6, today: 1 }, { id: 'park', name: '박도윤', load: 11, today: 3 }, { id: 'lee', name: '이서준', load: 14, today: 2 }];
  const P = (k) => GC.Policy.get(k);
  /* 영업시간 단위 정책값을 문장 안에서 '영업시간 4시간'으로 보여 줌(점선 표시 그대로) */
  const bh = (k) => pv(k, `영업시간 ${P(k)}시간`);
  const TYPES = {
    TEMPLATE: { name: '템플릿형', cost: '무료', rev: () => `${P('design.free_revisions_template')}회`, first: () => `영업일 ${P('design.sla.template_first_draft_days')}일`, right: '회사 보유 · 매장 사용권' },
    CUSTOM: { name: '맞춤형', cost: () => won(P('design.fee')), rev: () => `${P('design.free_revisions_custom')}회`, first: () => `영업일 ${P('design.sla.first_draft_days')}일`, right: '회사 보유 · 매장 사용권' },
    OWN_FILE: { name: '자체 파일', cost: '검수 무료', rev: () => `재업로드 ${P('design.own_file_free_rechecks')}회`, first: () => `검수 영업일 ${P('design.own_file_review_days')}일`, right: '고객 소유' },
    REORDER: { name: '재주문', cost: '없음 · 판비 면제', rev: () => `문구 수정 ${P('design.reorder_free_fixes')}회`, first: '디자인 단계 없음', right: '처음 확정 때와 같음' },
  };
  const val = (v) => (typeof v === 'function' ? v() : v);
  /* 첫 시안 안 개수(design.max_first_drafts, 2026-10-17 ⑫ 키). 그림은 A·B 두 가지만 있어 셋째부터는 A안 모양 */
  const firstOpts = () => ['A', 'B', 'C', 'D'].slice(0, Math.max(1, Math.min(4, P('design.max_first_drafts'))));
  /* 명세 고정값(키 아님 — 명세에 정책값 표시 없음): 시안 회수·수정 요청 취소 10분(D-ROOM-03 · C-STATE-03), 확정 뒤 패키지 전달 SLA 영업시간 4시간(D-PRD-01) */
  const WITHDRAW_MIN = 10;
  const DESIGN_ACTIVE = ['REQUESTED', 'ASSIGNED', 'IN_PROGRESS', 'PROPOSED', 'REVISION', 'ON_HOLD', 'FILE_SUBMITTED', 'FILE_REVIEW', 'FILE_REJECTED'];

  const app = UI.mount({
    domain: 'design',
    title: '맞춤 디자인',
    lede: '사장님이 로고를 넣은 수저집을 주문하면, 본사 디자인팀이 시안을 만들고, 고객이 확정한 파일만 파트너 인쇄소로 넘어갑니다. 고객과 파트너는 서로 직접 만나지 않아요.',
    meta: '근거: 기능 명세서 D-REQ-01~D-RE-01 · C-PRICE-01 · C-PAY-02 · C-STATE-01~03 · U-MY-01·02·03 · P-ORD-03·04·06 · A-ORD-02 · 기획서 06장 · 2026-10-14 부록 B 결정(D1·D3·D4·D17~D19) · 2026-10-15~16 결정(D20·D21·D28·D30·D35·D41·D47) · S11 맞춤 ④(룸 알림 묶음) · 2026-10-16 취소·환불 결정(D54 무료 디자인 공제 없앰 · D55 확정 후 취소 기본 승인 · D59 생산 지연 취소) · 2026-10-17 S12(D66 생산 보류가 풀리면 [인쇄 가능] 기한 새로 · D72 일괄 공지 끝 뒤 하루 유예 · ⑯ 회수품 폐기 확인 · ⑩ 알림 이메일 칸 · ⑫ 정책값 키) 반영',
    actors: [
      { id: 'customer', title: '맞춤 제작', tab: '디자인' },
      { id: 'design' },
      { id: 'partner', nav: ['주문', '맞춤 제작', '상품', '정산'], navOn: '맞춤 제작', url: 'partner.sikup.co.kr/production' },
      { id: 'hq', nav: ['대시보드', '주문', '분쟁 중재', '정산'], navOn: '분쟁 중재', url: 'admin.sikup.co.kr/mediation' },
      { id: 'system' },
    ],
    strips: [
      { id: 'design', machine: 'DESIGN', label: '디자인 요청', note: '디자인팀 작업 단위 · D-STU-01' },
      { id: 'item', machine: 'ORDER_CUSTOM', label: '주문 항목', note: '고객 주문 상세와 파트너 화면에 보이는 상태 · C-STATE-01' },
      { id: 'claim', machine: 'CLAIM_RETURN', label: '클레임', note: 'C-STATE-02', hidden: true },
    ],
    render: (actor, f) => VIEWS[actor](f),
    onReset: init,
    foot: '시나리오: 강남의 한식당 "오늘밥상"이 대성포장의 크라프트 수저집에 로고를 넣어 주문합니다. 시안 그림은 설명용 예시입니다.',
  });
  const S = () => app.S;

  function init() {
    Object.assign(app.S, {
      cs: 'pdp', qty: 10, type: 'CUSTOM', round: 1, checks: {}, pay: 'card',
      paid: null, designer: null, versions: [], viewVer: 0, viewOpt: 'A', pins: [], pinDraft: null,
      freeLeft: 0, revisions: 0, firstProposedAt: null, waitSince: null, fired: {}, notices: {}, prevStatus: null,
      sla: null, hold: false, after: null, afterChange: false, changeFrom: null, plateCost: null, downloaded: false, shipDue: null, deliveredAt: null,
      hash: null, confirmedVer: null, confirmedHash: null, reviseText: '', reviseNote: '', ownFile: null, logo: false, template: 'band', refunded: null, fixStarted: false,
      asking: false, viewedVer: 0, proposeFrom: null, slaBefore: null, revReqAt: null, restoreDue: false, source: null,
      remake: null, settled: false, exchangedAt: null, exchangeSettleDue: null, claims: [],
      handedAt: null, printDue: null, printLate: false, handedNote: null,
      // 생산 지연(P-ORD-03 · D59): 판정 시각은 출고 예정일이 정해질 때 계산해 저장 · delay = 열린 생산 지연 취소(DELAY_CANCEL) 요청
      // bulk = 본사 일괄 공지(지연 예외 기간 { start, end }, A-ORD-01 · D72)
      overdueAt: null, overdue: null, overdueRound: 0, dueFrom: null, delay: null, bulk: null, bulkLogged: false, discard: null, medNote: '',
    });
    app.strips.claim.hidden = true;
    setFlow('normal');
    guide();
  }
  /* 클레임 칩 줄: 확정 후 취소는 CLAIM_CANCEL(CUSTOM_CANCEL), 재제작은 CLAIM_RETURN(REMAKE) */
  function showClaim(machine, label, note, claimType) {
    const c = app.strips.claim;
    Object.assign(c, { machine, label, note, baseNote: note, claimType, result: null, hidden: false, current: null, lastMainIdx: null });
  }
  /* 클레임 끝내기(D30): 전이표 줄의 완료 결과(result)를 함께 저장하고, 라벨은 GC.claim.label로 정함(고객·파트너·관리자 같은 값) */
  function finishClaim(event, by, extra = {}) {
    const c = app.strips.claim; const from = app.state('claim');
    const result = GC.claim.result(c.machine, from, event, c.claimType);
    const to = app.go('claim', event, { by });
    if (to === 'CLAIM_COMPLETED' && result) {
      const label = GC.claim.label(c.machine, to, result);
      c.result = result; c.note = `${c.baseNote} · 완료 결과 ${result}(${label})`;
      S().claims.push({ type: c.claimType, machine: c.machine, result, label, at: app.clock.now(), ...extra });
      app.log('rule', `클레임 완료 결과 ${result} 저장 → 고객·파트너·관리자 라벨 '${label}'(C-STATE-02 · 2026-10-15 D30)`);
    }
    return to;
  }
  const CLAIM_TYPE_NAME = { CUSTOM_CANCEL: '확정 후 취소', DELAY_CANCEL: '생산 지연 취소', REMAKE: '재제작' };
  const lastClaim = () => { const l = S().claims; return l.length ? l[l.length - 1] : null; };
  const CONFIRMED_D = ['APPROVED', 'HANDED_OFF', 'PREFLIGHT_REJECTED'];
  /* 확정 후 변경으로 다시 시안 단계가 된 건(표시, 상태 아님) */
  const changeCase = () => S().afterChange && ['REVISION', 'PROPOSED', 'ON_HOLD'].includes(app.state('design'));
  /* 열린 클레임: 재제작(REMAKE) · 생산 지연 취소(DELAY_CANCEL). 열려 있으면 자동 구매 확정에서 빠짐(C-STATE-02) */
  const remakeOpen = () => { const s = S(); return !!(s.remake && app.state('claim') !== 'CLAIM_COMPLETED'); };
  const delayOpen = () => { const s = S(); return !!(s.delay && app.state('claim') !== 'CLAIM_COMPLETED'); };
  const claimOpen = () => remakeOpen() || delayOpen();
  /* 생산 지연(표시, 상태 아님): 출고 예정일 다음 영업일 끝(판정 시각)까지 송장이 없음 — 출고하면 표시를 내림 */
  const delayShown = () => !!(S().overdue && app.state('design') === 'IN_PRODUCTION');
  const delayLabel = () => GC.claim.label('CLAIM_CANCEL', app.state('claim'), null, 'DELAY_CANCEL'); // '취소 중재 중' · 승인 뒤 회수 대기면 '취소 승인'
  const plateTxt = (v) => (v > 0 ? `판 만들었음 · 실비 ${won(v)} 증빙` : '판 아직 안 만듦');
  /* 재제작(REMAKE)은 반품 상태를 쓰므로 진행 중 단계를 재제작 말로 보여 줌(재제작 요청됨 → 확정본 대조 검수 중 → 재제작 승인 → 재제작품 출고).
     단계 말은 엔진 GC.claim.step(…, 'REMAKE')만 씀(2026-10-17 페이지 상수를 엔진으로 옮김). 끝난 클레임은 저장한 완료 결과로 GC.claim.label(재제작 완료·환불 완료 …, D30) */
  const remakeStep = (rc) => GC.claim.step('CLAIM_RETURN', rc, 'REMAKE');
  /* 고객 라벨은 클레임 유형으로(C-STATE-02, 2026-10-16 맞춤): 진행 중이면 '재제작 진행 중', 거부면 '판매자 거부' — 단계 문구는 라벨 옆에 */
  function remakeBadge(rc) {
    const label = GC.claim.label('CLAIM_RETURN', rc, null, 'REMAKE'); const step = remakeStep(rc);
    return `<span class="st st-warn">${esc(label)}</span>${step !== label ? `<span class="xsmall faint nw">${esc(step)}</span>` : ''}`;
  }
  /* 고객이 낸 판비 = 판비 줄의 결제 금액(파트너 할인·본사 상품 할인 쿠폰 안분 뒤, 결제 스냅샷, D20) — 확정 후 취소 판비 공제 상한 */
  const platePaid = () => (S().paid ? S().paid.platePaid : 0);
  /* 허용 오차(D28): 결제 시점 상품 설정값(이 상품은 기본값 claim.tolerance 그대로). 결제 때 기록해 확정 스냅샷에 저장 */
  const tolNow = () => String(GC.Policy.get('claim.tolerance')).replace(/\s*\/\s*/, '·').replace(/(^|·)위치/, '$1인쇄 위치');
  const tolText = () => (S().paid && S().paid.tolerance) || tolNow();
  const tol = () => pv('claim.tolerance', esc(tolText()));
  const posTol = () => (tolText().match(/위치\s*(±[\d.]+\s*mm)/) || [])[1] || '';

  /* 방식에 따라 상태칩 순서를 바꿔 보여줌(자체 파일은 검수부터, 재주문은 확정부터) */
  function setFlow(kind) {
    const ds = app.strips.design, is = app.strips.item;
    delete ds.main; delete ds.branch; delete is.main;
    if (kind === 'own') { ds.main = ['FILE_SUBMITTED', 'FILE_REVIEW', 'PROPOSED', 'APPROVED', 'HANDED_OFF', 'IN_PRODUCTION', 'SHIPPED', 'COMPLETED']; ds.branch = ['FILE_REJECTED', 'ON_HOLD', 'PREFLIGHT_REJECTED', 'CANCELED']; }
    if (kind === 'reorder') { ds.main = ['APPROVED', 'HANDED_OFF', 'IN_PRODUCTION', 'SHIPPED', 'COMPLETED']; ds.branch = ['PREFLIGHT_REJECTED', 'CANCELED']; is.main = ['PAID', 'DESIGN_CONFIRMED', 'IN_PRODUCTION', 'SHIPPED', 'DELIVERED', 'CONFIRMED']; ds.note = '재주문 · 디자인 단계 생략'; }
    else ds.note = '디자인팀 작업 단위 · D-STU-01';
  }

  /* ── 금액 ── */
  function orderInput(type = S().type, qty = S().qty) {
    const reorder = type === 'REORDER';
    return {
      items: [{ id: 'item1', name: PRODUCT.name, partnerId: 'DS', shipKey: 'DS', qty, unit: PRODUCT.unit, tiers: PRODUCT.tiers, instant: PRODUCT.instant, plateFee: reorder ? 0 : PRODUCT.plateFee, designGroup: 'D1' }],
      designGroups: [{ id: 'D1', type }],
      hqCoupon: reorder ? null : { name: '첫 맞춤 주문 5,000원', type: 'amount', value: 5000 },
      shipping: { DS: { name: '대성포장 맞춤 제작', type: 'free', base: 0 } },
    };
  }
  const calc = (type, qty) => GC.price.calcOrder(orderInput(type, qty));
  /* 취소 계산(C-PAY-02 예시 2): 단계는 상태가 아니라 '첫 시안 전달 시각' 기록과 '확정 후 변경 건' 표시로 정함.
     디자인비 공제(2026-10-16 D54) = 실제로 낸 디자인비(p.designFee — 디자인비 쿠폰으로 깎인 몫은 빼고 기록). 50만원 무료·멤버십 이용권·디자인비 쿠폰으로
     무료였으면 0원이고, 이용권·쿠폰은 첫 시안이 나갔으므로 사용 처리. 예전의 무료 디자인 39,000원 공제(freeCustom)는 없앰.
     판비 공제 = 취소 보상 = min(파트너가 증빙한 실비, 고객이 낸 판비 = 판비 줄 결제 금액 platePaid, D20) */
  const freeWhyOf = (df) => (df && df.type === 'CUSTOM' && df.fee === 0 ? df.reason : df && df.couponDisc && df.fee - df.couponDisc <= 0 ? 'coupon' : null);
  const FREE_WHY = { threshold: '맞춤 품목 50만원 이상', voucher: '멤버십 이용권', coupon: '디자인비 쿠폰' };
  function cancelPreview(extra = {}) {
    const s = S(); const p = s.paid; if (!p) return null;
    return GC.refund.designCancel({
      type: s.type, state: app.state('design'), firstProposed: !!s.firstProposedAt, afterChange: s.afterChange,
      itemsAmount: p.total - p.designFee, paidDesignFee: p.designFee,
      plateFee: p.platePaid, plateCost: s.plateCost || 0, fixFee: p.fix || 0, fixStarted: s.fixStarted, ...extra,
    });
  }
  /* 생산 지연 취소(DELAY_CANCEL, D59): 승인하면 파트너 귀책 → 공제 없이 그 항목에 낸 금액 전부, 돌려준 디자인비는 파트너 부담(designFeeToPartner) */
  const delayPreview = () => cancelPreview({ productionDelay: true });
  /* 생산 지연 판정 시각 저장(공통 용어 '기한은 시작 때 계산해 저장'): 출고 예정일 + order.overdue_grace_bd 영업일, 그날 끝 */
  function setShipDue(due, from) {
    const s = S(); s.shipDue = due; s.dueFrom = from; s.overdueAt = GC.order.overdueAt(due); s.overdue = null; s.bulkLogged = false;
    app.log('rule', `출고 예정일 ${fmtDate(due, false)}${from === 'dismiss' ? '(취소 기각 때 받은 새 예정일)' : ''} · 생산 지연 판정 ${fmtDate(s.overdueAt)} = 출고 예정일 + ${pv('order.overdue_grace_bd')} 끝 · 이때까지 송장이 없으면 고객 [취소 요청]이 열려요(P-ORD-03, 시작 때 계산해 저장)`);
  }
  /* 본사 일괄 공지(관리자 '지연 예외 기간' 기록 { start, end } · A-ORD-01 · P-ORD-03 · 2026-10-17 D72): 기간 안이면 생산 지연을 판정하지 않고,
     끝나면 판정 시각이 기간 안에 들었거나 끝나기 전에 지난 건만 '끝난 날 + order.overdue_grace_bd 영업일의 끝'까지 미룸(GC.order.afterNotice).
     공지 전에 이미 열린 [취소 요청]은 그대로(그때는 파트너 사정) */
  // 화면 표시용 '공지 중' = 끝 시각이 아직 없는 기록(엔진 inNotice는 끝 시각을 기간 안으로 셈 — 끝낸 그 순간에도 '공지 중'으로 보이지 않게). 판정은 엔진 isOverdue
  const bulkOn = () => { const b = S().bulk; return !!b && !b.end && +app.clock.now() >= +b.start; };
  const judgeAt = () => (S().overdueAt ? GC.order.afterNotice({ judgeAt: S().overdueAt, notice: S().bulk }) : null);
  const judgeMoved = () => { const j = judgeAt(); return !!(j && +j !== +S().overdueAt); };
  const bulkSpan = () => { const b = S().bulk; return b ? `${fmtDate(b.start)} ~ ${b.end ? fmtDate(b.end) : '진행 중'}` : ''; };
  /* 파트너 정산: 판매가 = 상품 금액 + 판비(① 단계), 파트너 할인 = 즉시 할인(판비 범위를 골랐으면 판비 할인 포함) */
  function settlePreview() {
    const r = calc();
    const line = r.lines[0];
    const rate = GC.settle.finalRate({ base: GC.Policy.get('commission.custom_rate'), reorder: S().type === 'REORDER' });
    const partnerDisc = line.instantDisc + line.plateInstantDisc;
    const ev = GC.settle.confirmEvent({ sale: line.gross + line.plateFee, partnerDisc, rate: rate.rate });
    return { rate, ev, line, partnerDisc };
  }

      case 'IN_PROGRESS':

        return app.turn('design', s.versions.length ? `요청을 반영한 수정본 v${s.versions.length + 1}을 등록하세요` : `시안 v1을 등록하세요. 첫 시안은 최대 ${P('design.max_first_drafts')}안까지예요`, { rules: [{ k: s.versions.length ? '수정본 기한' : '첫 시안 기한', policy: s.versions.length ? 'design.sla.revision_days' : 'design.sla.first_draft_days' }].concat(s.versions.length ? [] : [{ k: '첫 시안 최대', policy: 'design.max_first_drafts' }]).concat([{ k: '등록 전 확인', v: '재단선·오탈자·목업' }]) });
      case 'PROPOSED':
        if (s.afterChange) return app.turn('customer', '확정 후 변경으로 만든 새 버전이에요. 다시 확정하거나, 취소하려면 [취소 요청]을 누르세요', { hint: `답하지 않으면 리마인드·보류만 하고 자동 취소는 하지 않아요. ${P('design.no_response_cancel_days')}일째에 본사가 이전 확정본으로 복원해요.`, rules: waitRules() });
        return app.turn('customer', '시안을 보고 핀을 찍어 [수정 요청]하거나 [이 시안으로 확정]하세요', { hint: `응답하지 않고 시간을 보내 보면(+1일·+7일) ${P('design.no_response_remind_days')}일째 리마인드, ${P('design.no_response_hold_days') - 1}일째 보류 예고, 예고 ${P('notify.notice_min_hours')}시간 뒤 보류, ${P('design.no_response_cancel_days') - 1}일째 취소 예고, 예고 ${P('notify.notice_min_hours')}시간 뒤 자동 취소가 일어나요.`, rules: [{ k: '남은 무료 수정', v: `${s.freeLeft}회` }, { k: '넘으면 회당', policy: 'design.extra_revision_fee' }, { k: '핀(버전당 최대)', policy: 'design.pins_per_version_max' }].concat(waitRules()) });
      case 'REVISION': return app.turn('design', `수정 요청이 접수됐어요. 반영한 수정본 v${s.versions.length + 1}을 등록하세요`, { hint: `수정 요청을 받으면 디자이너는 바로 새 버전을 등록해요. 고객은 접수 ${WITHDRAW_MIN}분 안·작업 시작 전에만 요청을 취소할 수 있어요.`, rules: [{ k: '수정본 기한', policy: 'design.sla.revision_days' }, { k: '디자이너 실수 정정', v: '횟수 차감 안 함' }] });
      case 'ON_HOLD': return app.turn('customer', `${P('design.no_response_hold_days')}일 동안 답이 없어 보류됐어요. [진행 재개]를 누르면 보류 전 상태로 돌아가요`, { rules: [{ k: s.afterChange ? `${P('design.no_response_cancel_days')}일째` : '자동 취소', v: s.afterChange ? '자동 취소 대신 본사가 이전 확정본 복원' : `처음 기준 ${P('design.no_response_cancel_days')}일째 예고 뒤 ${P('notify.notice_min_hours')}시간` }] });
      case 'FILE_SUBMITTED': return app.turn('design', '자체 파일 검수 담당을 배정하세요', { rules: [{ k: '검수 결과 기한', policy: 'design.own_file_review_days' }] });
      case 'FILE_REVIEW': return app.turn('design', s.fixStarted ? '보정본을 확인해 인쇄 미리보기로 등록하세요. 고객이 다시 확정해요' : '해상도·아웃라인·재단 여백을 확인해 통과 또는 반려하세요', { rules: [{ k: '재업로드 무료 재검수', policy: 'design.own_file_free_rechecks' }, { k: '보정 작업', policy: 'design.own_file_fix_fee' }] });
      case 'FILE_REJECTED': return app.turn('customer', '파일 수정이 필요해요. 재업로드·보정·맞춤형 전환 중에 고르세요', { rules: waitRules() });
      case 'APPROVED': return app.turn('design', s.hold && s.afterChange ? '다시 확정한 새 버전으로 인쇄 패키지를 만들어 전달하세요. 전달하면 생산 보류가 풀려요' : '확정본으로 인쇄 패키지를 만들어 파트너에 전달하세요', { hint: '인쇄용으로 정리하다 눈에 보이는 내용이 바뀌면 고객에게 다시 확정받아요.', rules: [{ k: '전달 기한', v: '확정 후 영업시간 4시간' }, { k: '패키지', v: '인쇄 원본·사양서·해시' }] });
      case 'HANDED_OFF': {
        const due = s.printDue ? fmtDate(s.printDue) : '';
        const what = s.printLate ? `확인 기한(${due})이 지났어요. ${s.downloaded ? '바로 [인쇄 가능] 또는 [반려]를 누르세요' : '패키지를 내려받아 바로 확인하세요'}`
          : s.handedNote ? `생산 보류가 풀려 확인 기한을 새로 셌어요(${due}까지). ${s.downloaded ? '확정본대로 [인쇄 가능] 또는 [반려]를 누르세요' : '패키지를 내려받아 확인하세요'}`
          : s.downloaded ? `인쇄 적합성을 확인하고 ${due}까지 [인쇄 가능] 또는 [반려]를 누르세요` : `맞춤 제작 큐에서 인쇄 패키지를 내려받으세요. 확인 기한(${due}까지)은 전달된 때부터 이미 흐르고 있어요`;
        return app.turn('partner', what, { hint: `[인쇄 가능]을 누르는 순간이 "생산 시작"이에요. 그 뒤로는 고객 사정으로 취소할 수 없고 불량만 재제작해요(출고 예정일 다음 영업일까지 출고하지 않으면 열리는 생산 지연 취소만 예외). 그 전에는 고객이 [확정 후 변경 요청]·[취소 요청]을 할 수 있어요. 내려받아야 [인쇄 가능]을 누를 수 있지만 기한은 내려받기 전에도 흘러요${s.printLate ? '' : '(+1일로 넘겨 보면 파트너 리마인드와 운영 알림이 가요)'}.`, rules: [{ k: '[인쇄 가능]·[반려] 기한', v: due ? `${due}까지` : '-' }, { k: '전달된 때부터(내려받은 때 아님)', policy: 'production.print_check_bd' }, { k: '다시 전달하면(반려 수정·복원·생산 보류 해제)', v: '새로 셈' }, { k: '생산 보류 중', v: '기한 알림 멈춤' }, { k: '제작 기간', v: `[인쇄 가능] 확인일부터 영업일 ${PRODUCT.leadDays}일` }] });
      }
      case 'PREFLIGHT_REJECTED': return app.turn('design', '파트너가 인쇄를 반려했어요. 고쳐서 다시 전달하거나, 보이는 내용이 바뀌면 고객 재확정을 받으세요');
      case 'IN_PRODUCTION': {
        const moved = judgeMoved();
        const R = [{ k: '출고 예정일', v: s.shipDue ? `${fmtDate(s.shipDue, false)}${s.dueFrom === 'dismiss' ? ' (새 예정일)' : ''}` : '-' }, { k: '생산 지연 판정', v: !s.overdueAt ? '-' : delayShown() ? `${fmtDate(judgeAt())} 넘김 · 생산 지연${s.bulk && s.overdue.at < s.bulk.start ? '(공지 전)' : ''}` : bulkOn() ? '일괄 공지 중 · 판정 멈춤' : `${fmtDate(judgeAt())}까지 송장 없음${moved ? ' (공지 끝난 날 + 1영업일)' : ''}` }, { k: '유예', policy: 'order.overdue_grace_bd' }];
        if (s.bulk) R.push({ k: '본사 일괄 공지', v: bulkSpan() });
        if (delayShown()) return app.turn('customer', `출고 예정일이 지나 '생산 지연'이 됐어요. 주문 상세에서 [취소 요청]을 누르세요(파트너 화면에서 송장을 등록해 그대로 출고할 수도 있어요)`, { hint: `${s.overdueRound > 1 ? '취소 기각 때 받은 새 출고 예정일도 넘겨 [취소 요청]이 다시 열렸어요(D59 ③). ' : ''}${bulkOn() ? '본사 일괄 공지 전에 이미 열린 [취소 요청]이라 공지 중에도 그대로예요(D72). ' : ''}요청하면 본사가 판단하고, 그동안 제작은 계속돼요. 승인되면 공제 없이 낸 금액 전부를 돌려줘요.`, rules: R.concat([{ k: '[취소 요청]', v: '본사 중재 · 자동 승인 없음' }, { k: '지연으로 안 봄', v: '인쇄 반려(디자인팀 원인) · 본사 일괄 공지 기간' }]) });
        if (s.dueFrom === 'dismiss') return app.turn('partner', `본사가 생산 지연 취소를 기각하고 출고를 독촉했어요. 새 출고 예정일(${fmtDate(s.shipDue, false)})까지 송장을 등록해 출고하세요`, { hint: '새 예정일 다음 영업일이 끝날 때까지도 송장이 없으면 고객의 [취소 요청]이 다시 열려요(+1일로 넘겨 보세요).', rules: R });
        const hint = bulkOn() ? '본사 일괄 공지(택배 파업) 기간이라 출고 예정일을 넘겨도 생산 지연으로 보지 않아요. 시스템 탭에서 공지를 끝내 보세요.'
          : moved ? `일괄 공지가 끝나 판정 시각을 끝난 날 + ${pv('order.overdue_grace_bd')}의 끝(${fmtDate(judgeAt())})으로 미뤘어요(쌓인 물량을 보낼 하루, D72). 그때까지 송장이 없으면 고객에게 [취소 요청]이 열려요(+1일로 넘겨 보세요).`
            : '송장 없이 +1일·+7일로 판정 시각(출고 예정일 다음 영업일 끝)을 넘기면 생산 지연이 되고 고객에게 [취소 요청]이 열려요.';
        return app.turn('partner', '생산이 끝나면 송장을 등록해 출고하세요', { hint, rules: R });
      }
      case 'SHIPPED':
        if (it === 'SHIPPED') return app.turn('system', '택배 조회로 배송 완료를 감지해요(시스템 탭에서 실행)');
        // 불량 신청 기한 3개월·30일은 법정 값(전자상거래법 — 키로 두지 않음, S12 ⑫)
        if (it === 'DELIVERED') return app.turn('customer', '받은 상품을 확인하고 [구매 확정]을 누르세요. 인쇄가 확정본과 다르면 [재제작 요청]을 누르세요', { hint: `맞춤 제작이라 단순 변심 반품·교환은 안 되고 불량만 재제작해요. ${P('order.auto_confirm_days')}일이 지나면 자동으로 확정돼요(클레임이 열린 항목은 빼고).`, rules: [{ k: '자동 구매 확정', policy: 'order.auto_confirm_days' }, { k: '불량 신청 기한(법정)', v: '받은 날부터 3개월 · 안 날부터 30일' }] });
        if (it === 'EXCHANGED') return app.turn('system', `재제작품 배송 완료 ${GC.Policy.get('order.auto_confirm_days')}일 뒤 구매 확정과 같이 정산돼요(+7일)`, { rules: [{ k: 'EXCHANGED', v: '끝 상태(구매 확정으로 바꾸지 않음)' }] });
        if (it === 'RETURNED') return app.done(`재제작 대신 환불했어요. 주문 항목은 반품 완료, 클레임은 '${claimDoneLabel()}'예요.`, { next: '[처음부터]로 다른 길도 가 볼 수 있어요.' });
        break;
      case 'COMPLETED':
        if (it === 'RETURNED' && lastClaim() && lastClaim().type === 'DELAY_CANCEL') {
          // ⑯ 요청 중 출고된 건의 승인·회수: 디자인 요청은 마지막 클레임이 끝날 때 COMPLETED, 회수품은 파트너가 받아 폐기 확인(출고 전 승인의 인쇄물·판 폐기와 같음 — 판단)
          if (s.discard && !s.discard.done) return app.turn('partner', '플랫폼이 회수한 물건이 파트너에게 돌아와요. 받은 회수품을 폐기하고 [폐기 확인 올리기]를 누르세요', { hint: '회사 저작권 디자인이라 다른 곳에 쓸 수 없어요. 출고 전에 승인된 생산 지연 취소의 인쇄물·판 폐기와 같은 처리예요. 고객 환불은 회수 완료 때 이미 끝났어요(검수 없음).', rules: [{ k: '회수품', v: '파트너가 받아 폐기 · 폐기 확인 기록' }, { k: '회수 배송비', v: '파트너' }, { k: '돌려준 디자인비', v: `${won(s.refunded.designFeeToPartner)} · '중재 판정' −` }, { k: '디자인 요청', v: '마지막 클레임이 끝나 완료' }] });
          return app.done(`생산 지연 취소를 승인했고, 이미 출고된 물건을 플랫폼이 회수해 검수 없이 전액 ${won(s.refunded.refund)}을 돌려드렸어요. 주문 항목은 반품 완료, 클레임은 '${claimDoneLabel()}'예요.`, { next: `회수 배송비는 파트너가 내고, 돌려준 디자인비 ${won(s.refunded.designFeeToPartner)}은 파트너 정산에서 빼요('중재 판정'). 회수품은 파트너가 받아 폐기 확인을 올렸어요. 재주문 연결 보장은 '생산 지연 취소' 사유로 풀렸어요.` });
        }
        if (it === 'EXCHANGED') return app.done(`재제작품을 받았어요. 주문 항목은 '교환·재제작 완료'(끝 상태), 클레임은 '${claimDoneLabel()}'예요.${s.remake && s.remake.settledBefore ? ' 이미 구매 확정·정산된 항목이라 새 정산은 없어요.' : ''}`, { next: '재제작품이 또 불량이면 그 물건을 받은 날부터 3개월 안에 다시 [재제작 요청]을 할 수 있어요(2026-10-14 확정). [같은 디자인으로 재주문]도 돼요.' });
        if (it === 'RETURNED') return app.done(`재제작 대신 환불했어요. 주문 항목은 반품 완료, 클레임은 '${claimDoneLabel()}'예요.`, { next: '이미 정산된 항목이면 다음 정산 주기에서 되돌려요(역분개).' });
        return app.done('주문 한 건이 끝났어요. 파트너 정산 대상이 됐어요.', { next: '고객 화면에서 [같은 디자인으로 재주문]을 눌러 보세요. 디자인 단계 없이 바로 파트너에게 넘어가고, 판비가 면제되며 파트너 수수료가 3%p 내려가요. 인쇄 불량이면 [재제작 요청]도 할 수 있어요.' });
      case 'CANCELED':
        if (s.refunded && s.refunded.claimType === 'DELAY_CANCEL') {
          if (s.discard && !s.discard.done) return app.turn('partner', '생산 지연 취소가 승인됐어요. 이미 만든 인쇄물과 판을 폐기하고 [폐기 확인 올리기]를 누르세요', { hint: '회사 저작권 디자인이라 다른 곳에 쓸 수 없어요. 인쇄물·판 손실은 파트너가 지고(대금을 받지 않음), 돌려준 디자인비도 파트너 정산에서 빼요.', rules: [{ k: '인쇄물·판', v: '파트너 폐기 · 손실 파트너' }, { k: '돌려준 디자인비', v: `${won(s.refunded.designFeeToPartner)} · '중재 판정' −` }, { k: '정산액이 모자라면', v: '미수금(분쟁 조정)' }] });
          return app.done(`생산 지연 취소가 승인됐어요. 공제 없이 낸 금액 전부 ${won(s.refunded.refund)}(디자인비·판비 포함)을 돌려드리고 쿠폰을 되살렸어요.`, { next: `돌려준 디자인비 ${won(s.refunded.designFeeToPartner)}은 파트너 정산에서 빼요('중재 판정'). 재주문 연결 보장이 '생산 지연 취소' 사유로 풀려, 같은 디자인을 다른 판매자로 다시 주문하면 디자인비 없이 판비만 내요. [처음부터]로 기각 갈래도 볼 수 있어요.` });
        }
        return app.done(`디자인 요청이 취소됐어요.${s.refunded ? ` 환불 ${won(s.refunded.refund)}${s.refunded.deduction ? ` (공제 ${won(s.refunded.deduction)})` : ''}.` : ''}${s.refunded && s.refunded.plateToPartner ? ` 파트너 '취소 보상' ${won(s.refunded.plateToPartner)}.` : ''}`, { next: '[처음부터]를 눌러 다른 길로 다시 가 볼 수 있어요.' });
    }
    app.turn('customer', '주문 상세에서 진행 상황을 확인하세요');
  }
  function refresh() { guide(); app.refresh(); }
  /* 마지막으로 끝난 클레임의 라벨(완료 결과에서, D30) */
  function claimDoneLabel() { const c = lastClaim(); return c ? c.label : GC.claim.label('CLAIM_RETURN', 'CLAIM_COMPLETED'); }

  /* ── 상태 이동 묶음 ── */

    if (shipped) {
      // 요청 중 출고된 건: '이미 출고' 취소 이의 인정과 같이 플랫폼이 회수 → 회수 완료 뒤 검수 없이 환불(배송 중이면 배송 완료 뒤 회수)
      await app.ext({ service: '계약 택배사 · 스윗트래커', what: '플랫폼 회수 접수(생산 지연 취소 승인)', lines: ['배송 중이면 배송 완료 뒤 회수를 접수해요', '회수 완료 뒤 파트너 검수 없이 환불 · 회수 배송비 파트너', '출고 뒤 취소 이의 인정과 같은 처리(C-STATE-02)'] });
      app.go('claim', 'mediation_approve', { by: `본사 중재 · 생산 지연 취소 승인 · 이미 출고돼 회수 뒤 환불${note ? ` · 근거 ${note}` : ''}` });
      s.medNote = '';
      noti('NOTI_MEDIATION_DECIDED', '고객', '생산 지연 취소 승인 · 받으신 물건을 회수한 뒤 낸 금액 전부 환불');
      noti('NOTI_PARTNER_MEDIATION_DECIDED', '파트너', `생산 지연 취소 승인 · 회수 뒤 환불(회수 배송비 파트너) · 돌려준 디자인비 ${won(dp.designFeeToPartner)} 정산 차감 · 회수품은 받아 폐기 확인을 올려 주세요`);
      if (app.state('item') === 'DELIVERED') await collectDelay(); else refresh();
      return;
    }
    await app.ext({ service: '토스페이먼츠', what: '결제 취소(판매자별 부분 취소)', lines: [`고객 환불 ${won(dp.refund)} · 공제 없음(디자인비·판비 포함)`, '파트너 몫과 본사 몫(디자인비)을 판매자별로 나눠 취소해요', '요청 키(취소 건 ID + 회차)를 먼저 저장하고 같은 키로만 다시 요청해요'] });
    app.go('claim', 'mediation_approve', { by: `본사 중재 · 생산 지연 취소 승인(파트너 귀책)${note ? ` · 근거 ${note}` : ''}` });
    goDesign('delay_cancel_approved', '생산 지연 취소 중재 승인 · 생산 중단');
    goItem('delay_cancel_approved');
    delaySettled(dp, false);
    s.discard = { at: app.clock.now(), done: null };
    refresh();
  }
  /* 승인 뒤 배송 완료된 건: 플랫폼 회수 → 검수 없이 환불(주문 항목 RETURNED) */
  async function collectDelay() {
    const dp = delayPreview();
    await app.ext({ service: '계약 택배사', what: '플랫폼 회수', lines: ['배송 완료된 물건을 플랫폼이 회수 접수 · 회수 완료 확인', '파트너 검수 없이 환불', '회수 배송비 파트너'] });
    app.clock.pass(2 * GC.DAY);
    goItem('delay_cancel_collected');
    goDesign('complete', '연결 항목이 생산 지연 취소로 회수·환불돼 마지막 클레임이 끝날 때 완료(⑯)');
    delaySettled(dp, true);
    S().discard = { at: app.clock.now(), done: null, collected: true };
    refresh();
  }

  function doConfirm(by) {
    const s = S();
    goItem('confirm');
    goDesign('complete', '연결된 주문 항목이 모두 구매 확정');
    const sp = settlePreview();
    s.settled = true;
    app.log('money', `정산 이벤트 생성: 구매 확정 ${won(sp.ev.amount)} (상품 금액 ${won(sp.line.gross)} + 판비 ${won(sp.line.plateFee)} − 파트너 할인 ${won(sp.partnerDisc)} − 수수료 ${sp.rate.rate}% ${won(sp.ev.fee)})`);
    app.log('user', by);
    refresh();
  }

  /* ── 시간이 흐를 때: 무응답(예고 먼저)·SLA·재제작 검수 기한·자동 확정 ── */
  app.onAdvance((prev, now) => {
    const s = S(); const d = app.state('design');
    if (s.sla && !s.sla.warned && now > s.sla.due && ['REQUESTED', 'ASSIGNED', 'IN_PROGRESS', 'REVISION', 'FILE_SUBMITTED', 'FILE_REVIEW'].includes(d)) {
      s.sla.warned = true;
      app.log('warn', `SLA 초과: ${{ assign: '배정', first: '첫 시안', revision: '수정본' }[s.sla.kind]} 기한 ${fmtDate(s.sla.due)}을 넘겼어요 → 사유 기록 필요`);
      app.notify('NOTI_INT_SLA_OVER', '담당 디자이너·디자인 리드', ['관리자 알림', 'Slack'], 'SLA 초과');
    }
    if (s.waitSince && waitingNow()) {
      const days = Math.floor((now - s.waitSince) / GC.DAY);
      const R = GC.Policy.get('design.no_response_remind_days'), H = GC.Policy.get('design.no_response_hold_days'), C = GC.Policy.get('design.no_response_cancel_days');
      const NH = GC.Policy.get('notify.notice_min_hours');
      const late = (k) => app.log('rule', `예고 없이 ${k}하지 않아요 → 지금 예고를 보내고 ${NH}시간 뒤에 ${k}해요(D-ROOM-07 예고 먼저)`);
      if (days >= R && !s.fired[R]) { s.fired[R] = true; noti('NOTI_DESIGN_REMIND', '고객', `${s.asking ? '디자이너 질문에 답을' : d === 'FILE_REJECTED' ? '파일 수정을' : '시안 확인을'} 기다리고 있어요 (${R}일째)`); }
      // 보류: 13일째 예고 → 예고 뒤 24시간이 지나야 14일째 보류
      if (d !== 'ON_HOLD' && days >= H - 1 && !s.notices.hold) {
        s.notices.hold = now;
        noti('NOTI_DESIGN_HOLD_NOTICE', '고객', '내일 보류 처리돼요');
        if (days >= H) late('보류');
      }
      if (d !== 'ON_HOLD' && days >= H && GC.notice.elapsed(s.notices.hold, now)) {
        s.prevStatus = d;
        goDesign('hold', `${H}일 무응답 · 예고 뒤 ${NH}시간 지남 · 보류 전 상태(${GC.sm.stateName('DESIGN', d)}) 저장`);
        noti('NOTI_DESIGN_ON_HOLD', '고객', '보류됐어요 · [진행 재개]로 이어 갈 수 있어요');
        app.log('rule', '보류 중에는 SLA 타이머가 멈추고 디자이너 업무량에서도 빠져요');
      }
      if (s.afterChange) {
        // 확정 후 변경 건: 자동 취소 없이 30일째 운영 확인 목록 → 본사가 이전 확정본 복원(D3)
        if (days >= C && !s.restoreDue) {
          s.restoreDue = true;
          app.log('warn', `확정 후 변경 건이 ${C}일 동안 답이 없어요 → 자동 취소하지 않고 운영 확인 목록에 올렸어요`);
          app.notify('NOTI_INT_MEDIATION_NEW', '운영팀(CS)', ['관리자 알림', 'Slack'], '확정 후 변경 건 30일 무응답 · 이전 확정본 복원 판단');
        }
      } else {
        if (days >= C - 1 && !s.notices.cancel) {
          s.notices.cancel = now;
          noti('NOTI_DESIGN_CANCEL_NOTICE', '고객', '내일 자동 취소돼요');
          if (days >= C) late('자동 취소');
        }
        if (days >= C && GC.notice.elapsed(s.notices.cancel, now)) {
          const cp = cancelPreview();
          s.refunded = cp;
          goDesign('cancel', `${C}일 무응답 · 예고 뒤 ${NH}시간 지나 자동 취소`);
          goItem('cancel', '디자인 자동 취소');
          app.log('money', `자동 취소 환불 ${won(cp.refund)} · 공제 ${won(cp.deduction)}(${cp.stage === 'BEFORE_PROPOSAL' ? '첫 시안 전이라 전액 환불' : cp.deduction ? `첫 시안 뒤라 ${cp.lines.map((l) => l.label).join(' · ')} 공제` : '첫 시안 뒤지만 공제할 디자인비 없음'})`);
          noti('NOTI_DESIGN_AUTO_CANCELED', '고객', '자동 취소 · 공제·환불 내역');
          s.waitSince = null; s.notices = {};
        }
      }
    }
    // 생산 지연(P-ORD-03 · D59): 저장한 판정 시각(출고 예정일 다음 영업일 끝)을 넘겼는데 송장이 없으면 '생산 지연' 표시 + 고객·파트너 알림 → 고객 [취소 요청]
    // 본사 일괄 공지 기간이면 판정하지 않고, 끝난 뒤는 GC.order.isOverdue({ notice })가 '끝난 날 + 1영업일의 끝'으로 판정(D72).
    // 인쇄 반려(디자인팀 원인)는 출고 예정일을 [인쇄 가능]부터 세므로 들어오지 않음
    if (d === 'IN_PRODUCTION' && s.shipDue && s.overdueAt && !s.overdue) {
      if (GC.order.isOverdue({ promisedAt: s.shipDue, now, notice: s.bulk })) markOverdue(now);
      else if (bulkOn() && now > s.overdueAt && !s.bulkLogged) { s.bulkLogged = true; app.log('rule', `판정 시각(${fmtDate(s.overdueAt)})을 넘겼지만 본사 일괄 공지 기간이라 생산 지연으로 보지 않아요(P-ORD-03 · 공지가 끝나면 끝난 날 + 1영업일의 끝까지 유예, D72)`); }
    }
    // [인쇄 가능] 확인 기한(전달된 때부터, D47)을 넘기면 파트너 리마인드 + 운영 알림. 내려받기 전이어도 셈.
    // 생산 보류 중에는 [인쇄 가능]이 막혀 있어 보내지 않음(D46 정지 중 알림 멈춤과 같은 취지 — 판단)
    if (d === 'HANDED_OFF' && s.printDue && !s.printLate && !s.hold && now > s.printDue) {
      s.printLate = true;
      noti('NOTI_PARTNER_PRINT_CHECK_DUE', '파트너(주문 담당)', `[인쇄 가능] 확인 기한 ${fmtDate(s.printDue)} 지남${s.downloaded ? '' : ' · 패키지를 아직 내려받지 않았어요'}`);
      app.notify('NOTI_INT_PRINT_CHECK_LATE', '운영팀 · 담당 MD', ['관리자 알림', 'Slack'], '파트너 [인쇄 가능] 확인 기한 초과');
      app.log('warn', `확인 기한을 넘겼어요(전달된 때부터 셈 — ${s.downloaded ? '내려받은 뒤' : '아직 내려받지 않았어도'}) → 지연 기록 · MVP는 기록만, 평가·페널티는 2차(A-PTN-03) · 2일을 넘기면 담당 MD가 연락`);
    }
    // 재제작 검수 기한(영업일 2일)을 넘기면 재제작 승인으로 봄(환불 아님)
    if (s.remake && app.state('claim') === 'RETURN_INSPECTING' && s.remake.inspectDue && now > s.remake.inspectDue) {
      app.go('claim', 'approve', { by: '검수 기한 넘김 → 재제작 승인으로 봄(환불 아님) · 출고 독촉' });
      noti('NOTI_PARTNER_CLAIM_AUTO_APPROVED', '대성포장(주문 담당)', '검수 기한 초과 · 재제작 승인 처리 · 출고해 주세요');
    }
    // EXCHANGED: 재제작품 배송 완료 7일 뒤 구매 확정과 같이 정산(상태는 그대로)
    if (s.exchangeSettleDue && now >= s.exchangeSettleDue) {
      const sp = settlePreview();
      app.log('money', `EXCHANGED 7일 경과 → 정산 이벤트 생성 ${won(sp.ev.amount)} · 주문 항목은 '교환·재제작 완료' 그대로`);
      s.settled = true; s.exchangeSettleDue = null;
      if (app.state('design') === 'SHIPPED') goDesign('complete', '재제작으로 EXCHANGED가 된 항목을 7일 뒤 확정으로 봄');
    }
    if (app.state('item') === 'DELIVERED' && s.deliveredAt && !claimOpen() && now - s.deliveredAt >= GC.Policy.get('order.auto_confirm_days') * GC.DAY) {
      doConfirm('자동 구매 확정 배치 · 확정 시각은 배송 완료 + 7일로 기록');
      return;
    }
    guide();
  });

  async function sha256(text) {
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* 보안 컨텍스트가 아니면 아래 간이 해시 */ }
    let h = 2166136261; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ('00000000' + (h >>> 0).toString(16)).slice(-8).repeat(8);
  }
})();
</script>
