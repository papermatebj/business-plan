<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맞춤 디자인 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  .methods { display: grid; gap: 10px; }
  .method { text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .method .mrow { display: grid; grid-template-columns: 78px minmax(0, 1fr); font-size: 13px; gap: 6px; }
  .method .mrow span:first-child { color: var(--ink-3); }
  .method .mh { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .method .mh small { font-size: 13px; color: var(--spot); font-weight: 700; }
  .method .moff { display: block; }
  .steps-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .steps-mini span { font-size: 11px; text-align: center; padding: 4px 0; border-top: 3px solid var(--rule); color: var(--ink-3); }
  .steps-mini span.on { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips-row .tag { font-size: 12.5px; padding: 3px 9px; }
  .proof-wrap { position: relative; padding: 18px 16px; color: var(--ink-3); }
  .proof-wrap .pin-hit { position: absolute; inset: 18px 16px; cursor: crosshair; }
  .pin-list { display: grid; gap: 6px; }
  .pin-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; font-size: 13.5px; align-items: start; }
  .pin-no { width: 22px; height: 22px; border-radius: 50%; background: var(--m); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .pin-no.ok { background: var(--kraft); }
  .snapshot { font-size: 12px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; overflow-x: auto; white-space: pre; font-family: var(--body); line-height: 1.5; }
  .ws { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; }
  @media (max-width: 1100px) { .ws { grid-template-columns: minmax(0, 1fr); } }
  .ver-list { display: grid; gap: 8px; }
  .ver { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; }
  .ver b { font-size: 15px; }
  .hold-banner { border: 2px solid var(--stop); background: var(--stop-weak); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
  .money-flow .tbl td.num { white-space: nowrap; }
  .nw { white-space: nowrap; }
  .ptbl { min-width: 560px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate } = GC;
  const esc = UI.esc, pv = UI.pv;

  /* ── 시나리오 데이터 (기획서 06장 협의 룸 예시: 오늘밥상 · 수저집) ── */
  const STORE = { name: '오늘밥상', biz: '한식', phone: '02-000-0000', insta: '@todaybapsang', branch: '강남점' };
  const PRODUCT = {
    name: '크라프트 수저집 40×240mm', partner: '대성포장', unit: '1,000매',
    normalTiers: [{ min: 1, price: 32000 }, { min: 5, price: 30000 }, { min: 10, price: 28000 }],
    tiers: [{ min: 10, price: 30000 }, { min: 30, price: 26000 }], // 맞춤: 1,000매당
    instant: { type: 'amount', value: 1000 }, plateFee: 50000, leadDays: 7,
  };
  const QTYS = [10, 20, 30];
  const DESIGNERS = [{ id: 'kim', name: '김하린', load: 6, today: 1 }, { id: 'park', name: '박도윤', load: 11, today: 3 }, { id: 'lee', name: '이서준', load: 14, today: 2 }];
  const TYPES = {
    TEMPLATE: { name: '템플릿형', cost: '무료', rev: () => `${GC.Policy.get('design.free_revisions_template')}회`, first: '영업일 1일', right: '회사 보유 · 매장 사용권' },
    CUSTOM: { name: '맞춤형', cost: () => won(GC.Policy.get('design.fee')), rev: () => `${GC.Policy.get('design.free_revisions_custom')}회`, first: () => `영업일 ${GC.Policy.get('design.sla.first_draft_days')}일`, right: '회사 보유 · 매장 사용권' },
    OWN_FILE: { name: '자체 파일', cost: '검수 무료', rev: '재업로드 3회', first: '검수 영업일 1일', right: '고객 소유' },
    REORDER: { name: '재주문', cost: '없음 · 판비 면제', rev: '문구 수정 1회', first: '디자인 단계 없음', right: '처음 확정 때와 같음' },
  };
  const val = (v) => (typeof v === 'function' ? v() : v);
  const DESIGN_ACTIVE = ['REQUESTED', 'ASSIGNED', 'IN_PROGRESS', 'PROPOSED', 'REVISION', 'ON_HOLD', 'FILE_SUBMITTED', 'FILE_REVIEW', 'FILE_REJECTED'];

  const app = UI.mount({
    domain: 'design',
    title: '맞춤 디자인',
    lede: '사장님이 로고를 넣은 수저집을 주문하면, 본사 디자인팀이 시안을 만들고, 고객이 확정한 파일만 파트너 인쇄소로 넘어갑니다. 고객과 파트너는 서로 직접 만나지 않아요.',
    meta: '근거: 기능 명세서 D-REQ-01~D-RE-01 · C-PRICE-01 · C-PAY-02 · C-STATE-01~03 · U-MY-01·03 · P-ORD-06 · 기획서 06장 · 2026-10-14 부록 B 결정(D1·D3·D4·D17~D19) · 2026-10-15~16 결정(D20·D21·D28·D30·D35·D41) 반영',
    actors: [
      { id: 'customer', title: '맞춤 제작', tab: '디자인' },
      { id: 'design' },
      { id: 'partner', nav: ['주문', '맞춤 제작', '상품', '정산'], navOn: '맞춤 제작', url: 'partner.sikup.co.kr/production' },
      { id: 'hq', nav: ['대시보드', '주문', '분쟁 중재', '정산'], navOn: '분쟁 중재', url: 'admin.sikup.co.kr/mediation' },
      { id: 'system' },
    ],
    strips: [
      { id: 'design', machine: 'DESIGN', label: '디자인 요청', note: '디자인팀 작업 단위 · D-STU-01' },
      { id: 'item', machine: 'ORDER_CUSTOM', label: '주문 항목', note: '고객 주문 상세와 파트너 화면에 보이는 상태 · C-STATE-01' },
      { id: 'claim', machine: 'CLAIM_RETURN', label: '클레임', note: 'C-STATE-02', hidden: true },
    ],
    render: (actor, f) => VIEWS[actor](f),
    onReset: init,
    foot: '시나리오: 강남의 한식당 "오늘밥상"이 대성포장의 크라프트 수저집에 로고를 넣어 주문합니다. 시안 그림은 설명용 예시입니다.',
  });
  const S = () => app.S;

  function init() {
    Object.assign(app.S, {
      cs: 'pdp', qty: 10, type: 'CUSTOM', round: 1, checks: {}, pay: 'card',
      paid: null, designer: null, versions: [], viewVer: 0, viewOpt: 'A', pins: [], pinDraft: null,
      freeLeft: 0, revisions: 0, firstProposedAt: null, waitSince: null, fired: {}, notices: {}, prevStatus: null,
      sla: null, hold: false, after: null, afterChange: false, changeFrom: null, plateCost: null, downloaded: false, shipDue: null, deliveredAt: null,
      hash: null, confirmedVer: null, confirmedHash: null, reviseText: '', reviseNote: '', ownFile: null, logo: false, template: 'band', refunded: null, fixStarted: false,
      asking: false, viewedVer: 0, proposeFrom: null, slaBefore: null, revReqAt: null, restoreDue: false, source: null,
      remake: null, settled: false, exchangedAt: null, exchangeSettleDue: null, claims: [],
    });
    app.strips.claim.hidden = true;
    setFlow('normal');
    guide();
  }
  /* 클레임 칩 줄: 확정 후 취소는 CLAIM_CANCEL(CUSTOM_CANCEL), 재제작은 CLAIM_RETURN(REMAKE) */
  function showClaim(machine, label, note, claimType) {
    const c = app.strips.claim;
    Object.assign(c, { machine, label, note, baseNote: note, claimType, result: null, hidden: false, current: null, lastMainIdx: null });
  }
  /* 클레임 끝내기(D30): 전이표 줄의 완료 결과(result)를 함께 저장하고, 라벨은 GC.claim.label로 정함(고객·파트너·관리자 같은 값) */
  function finishClaim(event, by, extra = {}) {
    const c = app.strips.claim; const from = app.state('claim');
    const result = GC.claim.result(c.machine, from, event, c.claimType);
    const to = app.go('claim', event, { by });
    if (to === 'CLAIM_COMPLETED' && result) {
      const label = GC.claim.label(c.machine, to, result);
      c.result = result; c.note = `${c.baseNote} · 완료 결과 ${result}(${label})`;
      S().claims.push({ type: c.claimType, machine: c.machine, result, label, at: app.clock.now(), ...extra });
      app.log('rule', `클레임 완료 결과 ${result} 저장 → 고객·파트너·관리자 라벨 '${label}'(C-STATE-02 · 2026-10-15 D30)`);
    }
    return to;
  }
  const CLAIM_TYPE_NAME = { CUSTOM_CANCEL: '확정 후 취소', REMAKE: '재제작' };
  const lastClaim = () => { const l = S().claims; return l.length ? l[l.length - 1] : null; };
  const CONFIRMED_D = ['APPROVED', 'HANDED_OFF', 'PREFLIGHT_REJECTED'];
  /* 확정 후 변경으로 다시 시안 단계가 된 건(표시, 상태 아님) */
  const changeCase = () => S().afterChange && ['REVISION', 'PROPOSED', 'ON_HOLD'].includes(app.state('design'));
  const claimOpen = () => { const s = S(); return !!(s.remake && app.state('claim') !== 'CLAIM_COMPLETED'); };
  const plateTxt = (v) => (v > 0 ? `판 만들었음 · 실비 ${won(v)} 증빙` : '판 아직 안 만듦');
  /* 재제작(REMAKE)은 반품 상태를 쓰므로 진행 중 단계만 재제작 말로 보여 줌(접수 → 검수 → 승인 → 발송).
     끝난 클레임은 이 표가 아니라 저장한 완료 결과로 GC.claim.label(재제작 완료·환불 완료 …, D30) */
  const REMAKE_STEP = { RETURN_REQUESTED: '재제작 요청됨', RETURN_COLLECTING: '회수 중', RETURN_INSPECTING: '확정본 대조 검수 중', RETURN_APPROVED: '재제작 승인', RETURN_REJECTED: '판매자 거부', EXCHANGE_SHIPPED: '재제작품 보내는 중' };
  /* 고객 라벨은 클레임 유형으로(C-STATE-02, 2026-10-16 맞춤): 진행 중이면 '재제작 진행 중', 거부면 '판매자 거부' — 단계 문구는 라벨 옆에 */
  function remakeBadge(rc) {
    const label = GC.claim.label('CLAIM_RETURN', rc, null, 'REMAKE'); const step = REMAKE_STEP[rc] || GC.claim.step('CLAIM_RETURN', rc);
    return `<span class="st st-warn">${esc(label)}</span>${step !== label ? `<span class="xsmall faint nw">${esc(step)}</span>` : ''}`;
  }
  /* 고객이 낸 판비 = 판비 줄의 결제 금액(파트너 할인·본사 상품 할인 쿠폰 안분 뒤, 결제 스냅샷, D20) — 확정 후 취소 판비 공제 상한 */
  const platePaid = () => (S().paid ? S().paid.platePaid : 0);
  /* 허용 오차(D28): 결제 시점 상품 설정값(이 상품은 기본값 claim.tolerance 그대로). 결제 때 기록해 확정 스냅샷에 저장 */
  const tolNow = () => String(GC.Policy.get('claim.tolerance')).replace(/\s*\/\s*/, '·').replace(/(^|·)위치/, '$1인쇄 위치');
  const tolText = () => (S().paid && S().paid.tolerance) || tolNow();
  const tol = () => pv('claim.tolerance', esc(tolText()));
  const posTol = () => (tolText().match(/위치\s*(±[\d.]+\s*mm)/) || [])[1] || '';

  /* 방식에 따라 상태칩 순서를 바꿔 보여줌(자체 파일은 검수부터, 재주문은 확정부터) */
  function setFlow(kind) {
    const ds = app.strips.design, is = app.strips.item;
    delete ds.main; delete ds.branch; delete is.main;
    if (kind === 'own') { ds.main = ['FILE_SUBMITTED', 'FILE_REVIEW', 'PROPOSED', 'APPROVED', 'HANDED_OFF', 'IN_PRODUCTION', 'SHIPPED', 'COMPLETED']; ds.branch = ['FILE_REJECTED', 'ON_HOLD', 'PREFLIGHT_REJECTED', 'CANCELED']; }
    if (kind === 'reorder') { ds.main = ['APPROVED', 'HANDED_OFF', 'IN_PRODUCTION', 'SHIPPED', 'COMPLETED']; ds.branch = ['PREFLIGHT_REJECTED', 'CANCELED']; is.main = ['PAID', 'DESIGN_CONFIRMED', 'IN_PRODUCTION', 'SHIPPED', 'DELIVERED', 'CONFIRMED']; ds.note = '재주문 · 디자인 단계 생략'; }
    else ds.note = '디자인팀 작업 단위 · D-STU-01';
  }

  /* ── 금액 ── */
  function orderInput(type = S().type, qty = S().qty) {
    const reorder = type === 'REORDER';
    return {
      items: [{ id: 'item1', name: PRODUCT.name, partnerId: 'DS', shipKey: 'DS', qty, unit: PRODUCT.unit, tiers: PRODUCT.tiers, instant: PRODUCT.instant, plateFee: reorder ? 0 : PRODUCT.plateFee, designGroup: 'D1' }],
      designGroups: [{ id: 'D1', type }],
      hqCoupon: reorder ? null : { name: '첫 맞춤 주문 5,000원', type: 'amount', value: 5000 },
      shipping: { DS: { name: '대성포장 맞춤 제작', type: 'free', base: 0 } },
    };
  }
  const calc = (type, qty) => GC.price.calcOrder(orderInput(type, qty));
  /* 취소 계산(C-PAY-02 예시 2): 단계는 상태가 아니라 '첫 시안 전달 시각' 기록과 '확정 후 변경 건' 표시로 정함.
     디자인비 공제(2026-10-16 D41) = 낸 디자인비(p.designFee — 디자인비 쿠폰으로 깎인 몫은 빼고 기록, 그 몫은 본사 부담이라 쿠폰으로 전액 무료면 0원).
     39,000원 공제(freeCustom)는 50만원 무료·멤버십 이용권으로 무료가 된 맞춤형만(p.freeBy)
     판비 공제 = 취소 보상 = min(파트너가 증빙한 실비, 고객이 낸 판비 = 판비 줄 결제 금액 platePaid, D20) */
  const FREE_BY = ['threshold', 'voucher'];
  const freeByOf = (df) => (df && df.type === 'CUSTOM' && FREE_BY.includes(df.reason) ? df.reason : null);
  function cancelPreview() {
    const s = S(); const p = s.paid; if (!p) return null;
    return GC.refund.designCancel({
      type: s.type, state: app.state('design'), firstProposed: !!s.firstProposedAt, afterChange: s.afterChange,
      itemsAmount: p.total - p.designFee, paidDesignFee: p.designFee, freeCustom: s.type === 'CUSTOM' && !!p.freeBy,
      plateFee: p.platePaid, plateCost: s.plateCost || 0, fixFee: p.fix || 0, fixStarted: s.fixStarted,
    });
  }
  /* 파트너 정산: 판매가 = 상품 금액 + 판비(① 단계), 파트너 할인 = 즉시 할인(판비 범위를 골랐으면 판비 할인 포함) */
  function settlePreview() {
    const r = calc();
    const line = r.lines[0];
    const rate = GC.settle.finalRate({ base: GC.Policy.get('commission.custom_rate'), reorder: S().type === 'REORDER' });
    const partnerDisc = line.instantDisc + line.plateInstantDisc;
    const ev = GC.settle.confirmEvent({ sale: line.gross + line.plateFee, partnerDisc, rate: rate.rate });
    return { rate, ev, line, partnerDisc };
  }

  /* ── 시안 그림: 수저집 40×240mm (가로로 눕힘) ── */
  function proofSvg(ver, opt, { watermark = true, blank = false } = {}) {
    const v2 = ver >= 2;
    const green = '#007749';
    const contact = v2 ? STORE.insta : STORE.phone;
    const body = blank ? `<text x="360" y="68" text-anchor="middle" font-size="16" fill="#8a7353" font-family="IBM Plex Sans KR">무지 크라프트 · 로고 인쇄 영역 40×240mm</text>` :
      opt === 'B' ? `
        <circle cx="250" cy="66" r="${v2 ? 30 : 26}" fill="none" stroke="#1b1b1b" stroke-width="3"/>
        <text x="250" y="${v2 ? 78 : 75}" text-anchor="middle" font-size="${v2 ? 30 : 26}" font-weight="800" fill="#1b1b1b" font-family="Hahmlet, serif">밥</text>
        <text x="300" y="${v2 ? 82 : 78}" font-size="${v2 ? 44 : 38}" font-weight="800" fill="#1b1b1b" font-family="Hahmlet, serif">오늘밥상</text>
        <text x="360" y="108" text-anchor="middle" font-size="13" fill="#1b1b1b" font-family="IBM Plex Sans KR">${esc(contact)}</text>` : `
        <circle cx="74" cy="66" r="${v2 ? 34 : 28}" fill="none" stroke="#1b1b1b" stroke-width="3"/>
        <text x="74" y="${v2 ? 79 : 76}" text-anchor="middle" font-size="${v2 ? 34 : 28}" font-weight="800" fill="#1b1b1b" font-family="Hahmlet, serif">밥</text>
        <text x="${v2 ? 124 : 118}" y="${v2 ? 84 : 80}" font-size="${v2 ? 48 : 40}" font-weight="800" fill="#1b1b1b" font-family="Hahmlet, serif">오늘밥상</text>
        <text x="${v2 ? 126 : 120}" y="104" font-size="12" fill="#1b1b1b" font-family="IBM Plex Sans KR" letter-spacing="1">한식 · ${esc(STORE.branch)}</text>
        <text x="690" y="74" text-anchor="end" font-size="15" font-weight="600" fill="#1b1b1b" font-family="IBM Plex Sans KR">${esc(contact)}</text>`;
    const wm = watermark && !blank ? Array.from({ length: 5 }, (_, i) => `<text x="${60 + i * 150}" y="${i % 2 ? 46 : 96}" font-size="15" font-weight="700" fill="#ffffff" opacity=".28" transform="rotate(-12 ${60 + i * 150} 70)" font-family="IBM Plex Sans KR">시안 · 식업</text>`).join('') : '';
    const crop = 'stroke="currentColor" stroke-width="1"';
    return `<svg viewBox="-24 -24 768 168" role="img" aria-label="수저집 시안 ${blank ? '무지' : 'v' + ver + ' ' + opt + '안'}">
      <g ${crop}><line x1="-24" y1="0" x2="-6" y2="0"/><line x1="0" y1="-24" x2="0" y2="-6"/><line x1="744" y1="0" x2="726" y2="0"/><line x1="720" y1="-24" x2="720" y2="-6"/>
      <line x1="-24" y1="120" x2="-6" y2="120"/><line x1="0" y1="144" x2="0" y2="126"/><line x1="744" y1="120" x2="726" y2="120"/><line x1="720" y1="144" x2="720" y2="126"/></g>
      <rect x="0" y="0" width="720" height="120" fill="#C9A36A"/>
      <rect x="0" y="0" width="720" height="120" fill="url(#kraftgrain)" opacity=".35"/>
      <defs><pattern id="kraftgrain" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 L9 0" stroke="#a9854f" stroke-width=".6"/></pattern></defs>
      ${blank ? '' : `<rect x="0" y="0" width="720" height="${v2 ? 18 : 13}" fill="${green}"/>`}
      ${body}${wm}
    </svg>`;
  }

  /* ── 지금 차례 안내 ── */
  function guide() {
    const s = S(); const d = app.state('design'); const it = app.state('item');

    async uploadOwn() { await app.ext({ service: 'AWS S3 · GuardDuty · convert 작업', what: '인쇄 파일 업로드와 자동 점검', lines: [`최대 ${GC.Policy.get('file.max_size_original')}MB(file.max_size_original), 이어 올리기 지원`, '악성코드 검사 → 미리보기 변환(DB·결제 권한 없는 격리 작업)'] }); S().ownFile = true; refresh(); },

    },
    payMethod(b) { S().pay = b.dataset.m; refresh(); },
    async pay() {
      const s = S(); const r = calc();
      await app.ext({ service: '토스페이먼츠', what: '결제창 호출', lines: [`결제 금액 ${won(r.totals.pay)}`, '서버가 금액을 다시 계산해 화면 금액과 같을 때만 결제창을 열어요', '결과는 리다이렉트로 받고 PG 조회로 한 번 더 확인해요'], result: '결제가 승인된 것으로 처리해요' });
      const df = r.designFees[0]; const fee = df.fee; const ln = r.lines[0];
      // 결제 스냅샷: 판비(목록 금액)·고객이 낸 판비(판비 줄 결제 금액, D20)·허용 오차(결제 시점 상품 설정값, D28)
      // 디자인비: 낸 디자인비(디자인비 쿠폰 몫을 뺀 금액, D41)와 무료 사유(50만원·멤버십 이용권일 때만 — 첫 시안 뒤 취소 39,000원 공제 대상)
      s.paid = { at: app.clock.now(), total: r.totals.pay, designFee: fee - (df.couponDisc || 0), designCoupon: df.couponDisc || 0, freeBy: freeByOf(df), plate: r.totals.plates, platePaid: ln.platePaid, tolerance: tolNow() };
      s.paidCalc = r;
      app.log('money', `결제 ${won(r.totals.pay)} = 파트너 몫 ${won(r.totals.gross + r.totals.plates - r.totals.instantDisc)} + 디자인비 ${won(fee)} − 본사 상품 할인 쿠폰 ${won(r.totals.hqDisc)}`);
      if (r.totals.plates) app.log('rule', `고객이 낸 판비 = 판비 ${won(ln.plateFee)}${ln.plateInstantDisc ? ` − 즉시 할인 ${won(ln.plateInstantDisc)}` : ''} − 본사 쿠폰 안분 ${won(ln.plateHqAlloc)} = ${won(ln.platePaid)} (판비 줄 결제 금액 · 결제 스냅샷 · 확정 후 취소 판비 공제 상한)`);
      app.setState('item', 'PAID', { by: '카드 승인' });
      app.notify('NOTI_ORDER_PAID', '고객', ['알림톡', '푸시'], '주문·결제 완료');
      if (s.type === 'REORDER') {
        setFlow('reorder');
        goItem('reorder');
        app.setState('design', 'APPROVED', { by: '이전 확정 스냅샷 복사' });
        goDesign('hand_off', '인쇄 패키지 재사용');
        s.downloaded = false; s.after = null; s.hold = false; s.plateCost = null;
        app.notify('NOTI_PARTNER_PACKAGE_HANDED_OFF', '파트너', ['알림톡', '이메일'], '재주문 인쇄 파일 도착');
        app.log('rule', `재주문: 디자인비 0원 · 판비 면제 · 파트너 수수료 ${settlePreview().rate.rate}%(재주문 −${GC.Policy.get('commission.reorder_discount')}%p)`);
      } else {
        goItem('design_created');
        setFlow(s.type === 'OWN_FILE' ? 'own' : 'normal');
        app.setState('design', s.type === 'OWN_FILE' ? 'FILE_SUBMITTED' : 'REQUESTED', { by: '결제 후 자동 생성 · 협의 룸 생성' });
        s.freeLeft = s.type === 'CUSTOM' ? GC.Policy.get('design.free_revisions_custom') : s.type === 'TEMPLATE' ? GC.Policy.get('design.free_revisions_template') : 0;
        setSla('assign', GC.addBusinessHours(s.paid.at, GC.Policy.get('design.sla.assign_hours')));
        app.notify('NOTI_INT_DESIGN_NEW', '디자인 리드', ['관리자 알림', 'Slack'], '신규 디자인 요청');
      }
      s.cs = 'done'; s.csState = app.state('design'); s.checks = {}; refresh();
    },
    cs(b) { const s = S(); s.cs = b.dataset.to; if (b.dataset.to === 'proposal') { s.viewVer = s.versions.length; s.viewedVer = Math.max(s.viewedVer, s.versions.length); } refresh(); },
    assign() {
      const s = S(); const sel = app.lastFrame.querySelector('#dsSel');
      app.clock.pass(45 * 60000);
      s.designer = DESIGNERS.find((x) => x.id === (sel ? sel.value : 'kim'));
      if (app.state('design') === 'FILE_SUBMITTED') {
        goDesign('assign', `검수 담당 ${s.designer.name}`);
        setSla('first', GC.addBusinessDays(app.clock.now(), 1));
      } else {
        goDesign('assign', `팀장이 ${s.designer.name} 배정`);
        const days = GC.Policy.get('design.sla.first_draft_days');
        setSla('first', GC.addBusinessDays(app.clock.now(), days));
        app.notify('NOTI_DESIGN_ASSIGNED', '고객', ['알림톡', '푸시'], `디자이너 ${s.designer.name} 배정 · 첫 시안 ${fmtDate(s.sla.due)}까지`);
      }
      refresh();
    },
    startWork() { app.clock.pass(20 * 60000); goDesign('start', `${S().designer.name}이 작업 시작`); refresh(); },
    async propose() {
      const s = S();
      await app.ext({ service: 'AWS S3 · convert 작업', what: `시안 v${s.versions.length + 1} 파일 올리기`, lines: ['시안 이미지(워터마크 자동), 목업, 인쇄 원본(고객 비공개)', `인쇄 원본은 AI·PDF만, 최대 ${GC.Policy.get('file.max_size_original')}MB(file.max_size_original) · PSD·SVG는 서버가 거절해요`, '인쇄 원본은 해시를 저장해 나중에 전달 파일과 대조해요'] });
      const v = s.versions.length + 1;
      app.clock.pass(v === 1 ? 26 * 3600000 : 5 * 3600000);
      if (s.cs === 'done') s.cs = 'progress';
      s.proposeFrom = app.state('design'); s.slaBefore = s.sla;
      s.versions.push({ v, opts: v === 1 ? ['A', 'B'] : ['A'], at: app.clock.now(), note: v === 1 ? '' : s.afterChange ? '확정 후 변경 · 인스타 계정 철자 수정' : '로고 키움 · 띠 색 3415C · 전화번호 → 인스타 계정' });
      s.pins.filter((p) => p.v === v - 1).forEach((p) => { p.resolved = true; });
      const onTime = !s.sla || app.clock.now() <= s.sla.due;
      goDesign('propose', `${s.proposeFrom === 'REVISION' ? '수정본' : '시안'} v${v} 등록${onTime ? ' · SLA 안' : ' · SLA 초과'}`);
      if (!s.firstProposedAt) { s.firstProposedAt = app.clock.now(); app.log('rule', '첫 시안 전달 시각 기록 → 이제부터 취소하면 디자인비를 공제해요(상태가 아니라 이 기록으로 판단)'); }
      s.sla = null; s.revReqAt = null; setWait(); s.viewVer = v; s.viewOpt = 'A';
      app.notify(v === 1 ? 'NOTI_DESIGN_PROPOSED' : 'NOTI_DESIGN_REVISED', '고객', ['알림톡', '푸시', '이메일'], `시안 v${v} 도착`);
      refresh();
    },
    viewVer(b) { S().viewVer = Number(b.dataset.v); refresh(); },
    viewOpt(b) { S().viewOpt = b.dataset.o; refresh(); },
    addPin(b, e) {
      const s = S(); const rect = b.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      const y = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
      s.pinDraft = { n: s.pins.length + 1, x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000, text: '' };
      refresh();
      const inp = app.lastFrame.querySelector('#pinText'); if (inp) inp.focus();
    },
    pinPreset(b) { S().pinDraft.text = b.dataset.t; refresh(); },
    pinType(t) { S().pinDraft.text = t.value; },
    pinCancel() { S().pinDraft = null; refresh(); },
    pinSave() {
      const s = S(); const dft = s.pinDraft; if (!dft || !dft.text.trim()) { app.toast('의견을 적어 주세요'); return; }
      const m = GC.mask(dft.text);
      const html = m.parts.map((p) => (p.t === 'mask' ? `<span class="masked">${esc(p.v)}</span>` : esc(p.v))).join('');
      s.pins.push({ n: dft.n, x: dft.x, y: dft.y, v: s.versions.length, html, resolved: false });
      app.log('user', `핀 ${dft.n} (좌표 ${dft.x}, ${dft.y} · 이미지 크기 대비 비율)`);
      if (m.hits.length) { app.log('rule', `핀 코멘트의 연락처를 가렸어요 (${m.hits.map((h) => h.kind).join(', ')}) · 원문은 암호화해 운영자만 열람`); app.toast('연락처는 대화로 공유할 수 없어요'); }
      s.pinDraft = null; refresh();
    },
    reviseNote(t) { S().reviseNote = t.value; const s = S(); clearTimeout(s._rt); s._rt = setTimeout(() => { refresh(); const ta = app.lastFrame.querySelector('#rvNote'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 450); },
    async sendRevision() {
      const s = S();
      if (s.freeLeft <= 0) await app.ext({ service: '토스페이먼츠', what: '추가 수정 결제', lines: [`${won(GC.Policy.get('design.extra_revision_fee'))} · 디자인 부가 결제(본사 매출)`, '원 주문에 연결해 기록해요'] });
      const m = GC.mask(s.reviseNote || '');

      app.clock.pass(3 * 3600000);

      s.waitSince = null; s.notices = {}; s.cs = 'progress'; s.reviseNote = ''; s.revReqAt = app.clock.now();
      app.notify('NOTI_INT_ROOM_MESSAGE', '담당 디자이너', ['관리자 알림'], '수정 요청 도착');
      refresh();
    },
    /* REVISION → PROPOSED: 접수 10분 안·작업 시작 전 고객이 요청 취소(횟수 돌려줌) */
    revWithdraw() {

      refresh();
    },
    /* PROPOSED → 등록 전 상태: 고객이 보기 전·등록 10분 안 회수 */
    withdrawProposal() {
      const s = S(); const ver = s.versions.pop(); const back = s.proposeFrom || 'IN_PROGRESS';
      app.setState('design', back, { by: `시안 v${ver.v} 회수 · 고객이 보기 전 10분 안 → 등록 전 상태` });
      if (ver.v === 1) { s.firstProposedAt = null; app.log('rule', '회수한 첫 버전은 첫 시안 전달로 보지 않아요 → 첫 시안 전달 시각 기록을 지웠어요'); }

    /* '고객 답변 대기' 표시(상태 아님): SLA 멈춤, 무응답 규칙 적용 */

      app.log('user', '디자이너 질문: "로고 초록색을 간판색(PANTONE 3415C)으로 맞출까요?" · 고객 답변 대기 표시');
      app.log('rule', '"고객 답변 대기"는 상태가 아니라 표시예요. 상태는 IN_PROGRESS 그대로, SLA는 멈추고 고객에게 "답변 필요"가 보여요');

      refresh();
    },
    answerQ() {
      const s = S(); app.clock.pass(20 * 60000);
      s.asking = false; s.waitSince = null; s.notices = {}; s.fired = {};
      if (s.slaPaused) { s.sla = { ...s.slaPaused, due: new Date(s.slaPaused.due.getTime() + (app.clock.now() - s.askAt)) }; s.slaPaused = null; }
      app.log('user', `고객 답변: "네, 간판색으로 맞춰 주세요" · 답변 대기 표시 해제, 기다린 시간만큼 SLA를 미뤄 다시 흐름${s.sla ? `(기한 ${fmtDate(s.sla.due)})` : ''}`);
      refresh();
    },
    /* 템플릿형·자체 파일 → 맞춤형 전환 결제(D-REQ-02·D-REQ-04, C-STATE-03 → REQUESTED) */

    const s = S(); const d = app.state('design');

    if (s.waitSince && waitingNow()) {
      const days = Math.floor((now - s.waitSince) / GC.DAY);
      const R = GC.Policy.get('design.no_response_remind_days'), H = GC.Policy.get('design.no_response_hold_days'), C = GC.Policy.get('design.no_response_cancel_days');

          s.restoreDue = true;
          app.log('warn', `확정 후 변경 건이 ${C}일 동안 답이 없어요 → 자동 취소하지 않고 운영 확인 목록에 올렸어요`);
          app.notify('NOTI_INT_MEDIATION_NEW', '운영팀(CS)', ['관리자 알림', 'Slack'], '확정 후 변경 건 30일 무응답 · 이전 확정본 복원 판단');
        }
      } else {
        if (days >= C - 1 && !s.notices.cancel) {
          s.notices.cancel = now;
          app.notify('NOTI_DESIGN_CANCEL_NOTICE', '고객', ['알림톡', '푸시', '이메일'], '내일 자동 취소돼요');
          if (days >= C) late('자동 취소');
        }
        if (days >= C && GC.notice.elapsed(s.notices.cancel, now)) {
          const cp = cancelPreview();
          s.refunded = cp;
          goDesign('cancel', `${C}일 무응답 · 예고 뒤 ${NH}시간 지나 자동 취소`);
          goItem('cancel', '디자인 자동 취소');
          app.log('money', `자동 취소 환불 ${won(cp.refund)} · 공제 ${won(cp.deduction)}(${cp.stage === 'BEFORE_PROPOSAL' ? '첫 시안 전이라 전액 환불' : cp.deduction ? `첫 시안 뒤라 ${cp.lines.map((l) => l.label).join(' · ')} 공제` : '첫 시안 뒤지만 공제할 디자인비 없음'})`);
          app.notify('NOTI_DESIGN_AUTO_CANCELED', '고객', ['알림톡', '푸시', '이메일'], '자동 취소 · 공제·환불 내역');
          s.waitSince = null; s.notices = {};
        }
      }
    }
    // 재제작 검수 기한(영업일 2일)을 넘기면 재제작 승인으로 봄(환불 아님)
    if (s.remake && app.state('claim') === 'RETURN_INSPECTING' && s.remake.inspectDue && now > s.remake.inspectDue) {
      app.go('claim', 'approve', { by: '검수 기한 넘김 → 재제작 승인으로 봄(환불 아님) · 출고 독촉' });
      app.notify('NOTI_PARTNER_CLAIM_AUTO_APPROVED', '대성포장', ['알림톡'], '검수 기한 초과 · 재제작 승인 처리 · 출고해 주세요');
    }
    // EXCHANGED: 재제작품 배송 완료 7일 뒤 구매 확정과 같이 정산(상태는 그대로)
    if (s.exchangeSettleDue && now >= s.exchangeSettleDue) {
      const sp = settlePreview();
      app.log('money', `EXCHANGED 7일 경과 → 정산 이벤트 생성 ${won(sp.ev.amount)} · 주문 항목은 '교환·재제작 완료' 그대로`);
      s.settled = true; s.exchangeSettleDue = null;
      if (app.state('design') === 'SHIPPED') goDesign('complete', '재제작으로 EXCHANGED가 된 항목을 7일 뒤 확정으로 봄');
    }
    if (app.state('item') === 'DELIVERED' && s.deliveredAt && !claimOpen() && now - s.deliveredAt >= GC.Policy.get('order.auto_confirm_days') * GC.DAY) {
      doConfirm('자동 구매 확정 배치 · 확정 시각은 배송 완료 + 7일로 기록');
      return;
    }
    guide();
  });

  async function sha256(text) {
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* 보안 컨텍스트가 아니면 아래 간이 해시 */ }
    let h = 2166136261; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ('00000000' + (h >>> 0).toString(16)).slice(-8).repeat(8);
  }
})();
