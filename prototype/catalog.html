<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상품 등록·검수·검색 · 식업 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/gc.css">
<style>
  /* 파트너 센터 · 등록 양식 */
  .desk-main .stack-lg > *, .desk-main .panel-b > *, .pform > *, .ws2 > * { min-width: 0; }
  .desk-main .tbl-wrap > .tbl { min-width: 480px; }
  .desk-main .tbl-wrap > .tier-tbl.t4 { min-width: 340px; }
  .desk-main .tbl-wrap > .tbl.promo-tbl { min-width: 380px; }
  .promo-tbl tr.is-err td { background: var(--warn-weak); }
  .seg.sorts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .seg.sorts button { padding: 7px 2px; font-size: 12.5px; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
  .pform .full { grid-column: 1 / -1; }
  @media (max-width: 900px) { .pform { grid-template-columns: minmax(0, 1fr); } }
  .ro { min-height: auto; background: var(--sheet-2); color: var(--ink-2); }
  .tier-tbl td { vertical-align: middle; }
  .tier-tbl.fx { table-layout: fixed; }
  .tier-tbl.fx th, .tier-tbl.fx td { padding-inline: 4px; }
  .tier-tbl.fx th:first-child { width: 34px; }
  .tier-tbl.t6 th:nth-child(5) { width: 50px; }
  .tier-tbl.t6 th:nth-child(6) { width: 40px; }
  .tier-tbl.t4 th:nth-child(4) { width: 50px; }
  .tier-tbl.t5 th:nth-child(5) { width: 50px; }
  .desk-main .tbl-wrap > .tier-tbl.t5 { min-width: 400px; }
  .tier-tbl .ro-v { display: block; text-align: right; font-variant-numeric: tabular-nums; padding: 4px 8px; color: var(--ink-2); }
  .tier-tbl .input { min-height: 34px; padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  .tier-tbl tr.is-err td { background: var(--stop-weak); }
  .errs { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--stop); font-weight: 600; display: grid; gap: 2px; }
  .togs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tog { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); font: inherit; font-size: 13px; }
  .tog[aria-pressed="true"] { border-color: var(--spot); color: var(--spot); background: var(--spot-weak); font-weight: 600; }
  .chk-list { display: grid; }
  .chk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13.5px; align-items: center; }
  .chk-row:first-child { border-top: 0; }
  .chk-row .sub { display: block; font-size: 12px; color: var(--ink-3); }
  .opt-card { text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .ws2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
  .psteps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .psteps button { font: inherit; font-size: 12.5px; line-height: 1.35; text-align: left; padding: 7px 2px 2px; border: 0; border-top: 3px solid var(--rule); background: none; color: var(--ink-3); cursor: pointer; }
  .psteps button.done { border-color: var(--kraft); color: var(--ink-2); }
  .psteps button[aria-pressed="true"] { border-color: var(--spot); color: var(--ink); font-weight: 600; }
  .qrow { display: flex; gap: 6px; align-items: center; }
  .qrow .input { flex: 1; min-width: 0; }
  .qrow .btn, .nw { flex: none; white-space: nowrap; }
  #gc-aside .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  #gc-aside .seg.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #gc-aside .seg button { padding: 7px 4px; }
  #gc-aside .seg.four button:nth-child(3) { border-left: 0; }
  #gc-aside .seg.four button:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .mini { border: 1px solid var(--rule-strong); border-radius: 14px; padding: 10px 12px; background: var(--sheet-2); display: grid; gap: 8px; }
  .dieline { color: var(--ink-3); border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 6px; background: var(--sheet); }
  /* 고객 앱 */
  .sbar { display: flex; align-items: center; gap: 8px; width: 100%; border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: var(--sheet); font: inherit; font-size: 14px; color: var(--ink-3); cursor: pointer; text-align: left; }
  .sbar::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--ink-2); border-radius: 50%; flex: none; }
  .biz-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .biz-grid button { font: inherit; font-size: 12px; padding: 8px 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); cursor: pointer; color: var(--ink); }
  .pcard { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); cursor: pointer; }
  .pcard:first-child { border-top: 0; }
  .pcard.is-out { opacity: .5; }
  .thumb { aspect-ratio: 1 / 1; border-radius: 8px; background: var(--sheet-3); border: 1px solid var(--rule); overflow: hidden; display: grid; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .pinfo { display: grid; gap: 4px; align-content: start; min-width: 0; }
  .pname { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pprice { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .gallery { aspect-ratio: 4 / 3; background: var(--sheet-3); border-radius: 10px; border: 1px solid var(--rule); display: grid; position: relative; overflow: hidden; }
  .gallery svg { width: 100%; height: 100%; }
  .gallery .cnt { position: absolute; right: 8px; bottom: 8px; font-size: 11px; background: var(--sheet); border-radius: 10px; padding: 1px 8px; color: var(--ink-2); }
  .ac-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 14px; cursor: pointer; }
  .ac-row:first-child { border-top: 0; }
  .ac-row b { color: var(--spot); }
  .x-btn { white-space: nowrap; border: 0; background: none; color: var(--ink-3); cursor: pointer; font: inherit; font-size: 12px; padding: 2px 6px; }
  .phone-top .back, .phone-tabbar span { cursor: pointer; }
  .linkish { border: 0; background: none; padding: 0; color: var(--c); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
  #gc-aside .seg.two-c { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* 상세 설명 에디터(P-PRD-09) */
  .ed { border: 1px solid var(--rule-strong); border-radius: var(--r-ctl); background: var(--sheet); overflow: hidden; }
  .ed-bar { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 6px 8px; border-bottom: 1px solid var(--rule); background: var(--sheet-2); font-size: 12px; color: var(--ink-2); }
  .ed-bar span { padding: 2px 6px; border-radius: 5px; border: 1px solid var(--rule); background: var(--sheet); }
  .ed-bar span.off { color: var(--ink-3); border-style: dashed; text-decoration: line-through; background: transparent; }
  .ed-body { padding: 10px; display: grid; gap: 8px; }
  .ed-body > * { min-width: 0; }
  .ed-img { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; }
  .ed-img .sl { display: grid; gap: 3px; }
  .ed-img .sl svg { display: block; width: 40px; height: auto; border: 1px solid var(--rule); }
  .ed-img.is-fail { border-color: var(--stop); background: var(--stop-weak); }
  .ed-ph { width: 40px; aspect-ratio: 1 / 2; border: 1px dashed var(--stop); border-radius: 4px; display: grid; place-items: center; font-size: 11px; color: var(--stop); }
  .ed-sec { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .pv-frame { border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--sheet); padding: 12px; max-height: 560px; overflow: auto; margin-inline: auto; }
  .pv-frame.m { max-width: 360px; }
  .pv-frame.pc { max-width: 1000px; }
  /* 상세 설명 보기(U-PDP-07) */
  .dv { display: grid; gap: 8px; }
  .dv-body { position: relative; overflow: hidden; }
  .dv.is-fold .dv-body { max-height: 360px; }
  .dv.is-fold .dv-body::after { content: ""; position: absolute; inset: auto 0 0 0; height: 96px; background: linear-gradient(to bottom, transparent, var(--sheet)); pointer-events: none; }
  .dv-img { display: block; width: 100%; border: 0; padding: 0; margin: 0; background: none; cursor: zoom-in; position: relative; }
  .dv-img svg { display: block; width: 100%; height: auto; }
  .dv-img.is-add { outline: 3px solid var(--spot); outline-offset: -3px; }
  .dv-img.is-del { opacity: .45; outline: 3px dashed var(--stop); outline-offset: -3px; }
  .dv-tag { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 600; background: var(--sheet); border-radius: 6px; padding: 1px 6px; }
  .dv-txt { font-size: 14px; line-height: 1.7; padding-top: 12px; display: grid; gap: 6px; }
  .dv-txt h5 { font-size: 15px; font-weight: 700; margin-top: 6px; }
  .dv-txt mark.dv-add { background: var(--spot-weak); color: inherit; padding: 0 2px; }
  .dv-txt del { color: var(--stop); }
  .dv-tbl { overflow-x: auto; }
  .dv-tbl .tbl { min-width: 460px; }
  .dv.is-pc .dv-body { max-width: 1000px; margin-inline: auto; }
  .dv-miss { display: grid; place-items: center; gap: 8px; padding: 32px 8px; background: var(--sheet-2); border: 1px dashed var(--rule-strong); font-size: 12px; color: var(--ink-3); }
  .dv-report { text-align: right; }
  .dv-mini { max-height: 420px; overflow: auto; border: 1px solid var(--rule); border-radius: 10px; padding: 10px; background: var(--sheet); }
  .zoom-box { overflow: auto; max-height: 560px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
  .zoom-in { width: 160%; }
  .zoom-in svg { display: block; width: 100%; height: auto; }
  /* 옵션 3단·추가 구성품(P-PRD-02 · U-PDP-02 · 2026-10-15 D24) */
  .opt-row { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
  @media (max-width: 600px) { .opt-row { grid-template-columns: minmax(0, 1fr) 44px; } .opt-row .ov { grid-column: 1 / -1; grid-row: 2; } }
  .desk-main .tbl-wrap > .tbl.opt-tbl { min-width: 420px; }
  .desk-main .tbl-wrap > .tbl.ad-tbl { min-width: 440px; }
  .opt-tbl .input, .ad-tbl .input { min-height: 32px; padding: 3px 8px; text-align: right; font-variant-numeric: tabular-nums; width: 96px; }
  .opt-tbl td:nth-child(3) .input, .ad-tbl td:nth-child(3) .input { width: 76px; }
  .opt-tbl td:not(:first-child), .ad-tbl td:not(:first-child) { width: 1%; white-space: nowrap; }
  .opt-tbl tr.is-err td, .ad-tbl tr.is-err td { background: var(--stop-weak); }
  .osel { display: grid; gap: 6px; }
  .osel label { font-size: 12.5px; color: var(--ink-2); }
  .sel-line { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; background: var(--sheet-2); }
  .add-line { margin-left: 6px; padding-left: 10px; border-left: 2px solid var(--rule-strong); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .add-line span:first-child { min-width: 0; }
  .add-line span:last-child { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .addon-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
  .addon-row:first-child { border-top: 0; }
  .addon-row.is-out .an { color: var(--ink-3); }
  .addon-row .an small { display: block; font-size: 12px; color: var(--ink-3); }
  .qty.sm button { width: 32px; height: 32px; font-size: 16px; }
  .qty.sm input { width: 40px; height: 32px; }
  .qty button:disabled { opacity: .4; cursor: not-allowed; }
  .calc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13.5px; align-items: baseline; margin: 0; }
  .calc dt { min-width: 0; }
  .calc dt small { display: block; font-size: 11.5px; color: var(--ink-3); }
  .calc dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .calc .tot { font-weight: 700; border-top: 1px solid var(--rule); padding-top: 6px; }
  .mcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
  /* 일회용품 규제 안내(A-PRD-02 · U-PDP-04 · 2026-10-15 D29) */
  .regbox { border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--sheet-2); }
  .regbox summary { cursor: pointer; padding: 10px 12px; font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; list-style: none; }
  .regbox summary::-webkit-details-marker { display: none; }
  .regbox summary::after { content: "펼치기"; font-weight: 400; color: var(--ink-3); font-size: 12px; flex: none; }
  .regbox[open] summary::after { content: "접기"; }
  .regbox .rb { padding: 0 12px 12px; font-size: 13px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; }
  .reg-ta { min-height: 120px; }
  @media (max-width: 600px) { .psteps { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  const { won, fmtDate, num } = GC;
  const esc = UI.esc, pv = UI.pv;

  /* ── 엔진에 없는 정책값: 페이지 상수(관리자 설정값, 임시 기본값) ──
     엔진 키로 옮긴 것(2026-10-16 S10 맞춤 ⑪·⑬): 검수 처리 목표 product.review_bd · 우선 검수 product.review_priority_hours(2차) ·
     옵션 조합 최대 product.option_combo_max · 옵션 추가 금액 범위 product.option_extra_range(숫자는 GC.price.optionExtraRange()) ·
     (2026-10-16 S11 맞춤 ⑧) 가격 오입력 경고 product.price_change_alert(판단은 GC.price.priceChangeCheck, 숫자는 priceChangeAlert()) */
  const PC = {
    doc_valid_months: { v: 12, unit: '개월', label: '시험성적서 유효기간(발급 후, P-PRD-06, 키 없음)' },
    doc_notice_days: { v: 30, unit: '일', label: '서류 만료 사전 알림(P-PRD-06)' },
    ship_days_max: { v: 2, unit: '영업일', label: '일반 상품 출고 소요일 최대(P-PRD-04)' },
    fix_repeat_md: { v: 3, unit: '회', label: '같은 사유 보완 요청 시 MD 상담 안내(P-PRD-07)' },
    detail_slice_px: { v: 3000, unit: 'px', label: '세로로 긴 상세 이미지를 자르는 높이(P-PRD-09)' },
    detail_html_kb: { v: 200, unit: 'KB', label: '상세 설명 HTML 최대 크기(P-PRD-09)' },
    detail_fold_px: { v: 1200, unit: 'px', label: '상세 설명 처음 보이는 높이(U-PDP-07)' },
    detail_ver_keep: { v: 6, unit: '개월', label: '주문에 연결되지 않은 이전 버전 보관(P-PRD-09)' },
  };
  const pc = (k) => PC[k].v;
  const pvc = (k, text) => `<span class="pv" title="관리자 설정값(임시 기본값) · ${esc(PC[k].label)} — 엔진에 없어 이 페이지 상수로 둠">${text != null ? text : PC[k].v + PC[k].unit}</span>`;
  /* 엔진 정책값 읽기: 검수 처리 목표(영업일) · 옵션 조합 최대 · 옵션 추가 금액 범위(기본가 대비 %) */
  const reviewBd = () => GC.Policy.get('product.review_bd');
  const comboMax = () => GC.Policy.get('product.option_combo_max');
  /** 기본가 → 옵션 추가 금액 허용 범위(원). 하한은 기본가 × 하한율의 원 단위 내림에 − */
  function extraBounds(base) {
    const r = GC.price.optionExtraRange();
    return { lo: -Math.floor((base * -r.down) / 100), hi: Math.floor((base * r.up) / 100), down: r.down, up: r.up };
  }
  /** 옵션 추가 금액 범위 표시(점선 · product.option_extra_range): '−50%~+200%' */
  const pvExtra = () => { const r = GC.price.optionExtraRange(); return pv('product.option_extra_range', `−${num(-r.down)}%~+${num(r.up)}%`); };
  /** 가격 오입력 경고 기준(P-PRD-03 · product.price_change_alert '−50% / +200%') → 말로: 직전 가격의 '절반' 이하 · '3배' 이상 */
  function alertWords() {
    const r = GC.price.priceChangeAlert(); const lo = 1 + r.down / 100; const hi = 1 + r.up / 100;
    return { lo: lo === 0.5 ? '절반' : `${num(lo * 100)}%`, hi: Number.isInteger(hi) ? `${hi}배` : `${num(hi * 100)}%`, down: r.down, up: r.up };
  }
  /** 오입력 경고 기준 표시(점선): '직전 가격의 절반 이하·3배 이상' */
  const pvAlert = () => { const w = alertWords(); return pv('product.price_change_alert', `직전 가격의 ${w.lo} 이하·${w.hi} 이상`); };

  /* ── 페이지 상태 머신: 인증 서류 ── */
  GC.sm.define('CATALOG_DOC', {
    name: '인증 서류(시험성적서)',
    states: { MISSING: { name: '미등록' }, UPLOADED: { name: '제출' }, VERIFIED: { name: '검수 통과' }, EXPIRING: { name: '만료 임박' }, EXPIRED: { name: '만료' } },
    main: ['MISSING', 'UPLOADED', 'VERIFIED'],
    branch: ['EXPIRING', 'EXPIRED'],
    stop: ['EXPIRED'],
    transitions: [
      { from: 'MISSING', event: 'upload', to: 'UPLOADED', actor: 'partner', label: '서류 올리기(S3 · 악성코드 검사)' },
      { from: 'UPLOADED', event: 'verify', to: 'VERIFIED', actor: 'hq', label: '상품 검수에서 확인 → 배지 노출' },
      { from: 'VERIFIED', event: 'notice', to: 'EXPIRING', actor: 'system', label: '만료 30일 전 알림' },
      { from: ['VERIFIED', 'EXPIRING'], event: 'expire', to: 'EXPIRED', actor: 'system', label: '유효기간 만료 → 배지 내림 · 상품 본사 중지' },
      { from: ['EXPIRED', 'EXPIRING', 'VERIFIED'], event: 'renew', to: 'UPLOADED', actor: 'partner', label: '새 서류 올리기' },
    ],
  });
  /* 판매 중 상품 수정본은 엔진 상태 머신 PRODUCT_REVISION(P-PRD-07 · A-PRD-01, 2026-10-14 B15)을 씀 */

  /* ── 시나리오 데이터 ── */

      const s = S(); const p = pdpP(); if (!hasMain(p)) { app.toast('맞춤 옵션을 골라 주세요'); return; }
      const r = customCalc(p, s.member, true);
      app.log('user', `맞춤 옵션·수량 확정: ${hasOpts(p) ? `${esc(selCombo(p).vs.join(' / '))} · ` : ''}${num(s.cqty * 1000)}매${r.totals.addons ? ` · 추가 구성품 ${won(r.totals.addons)}` : ''} → 디자인 방식 선택(D-REQ-01)`);
      app.log('rule', `판비 ${won(r.totals.plates)}은 ① 상품 금액 줄(상품 금액 바로 아래)${r.lines[0].plateInstantDisc ? ` · 즉시 할인 범위 '상품 대금 + 판비'라 판비 할인 ${won(r.lines[0].plateInstantDisc)}` : ''} · 디자인비 50만원 판정 금액 ${won(r.designFees[0].basis)}(판비·추가 구성품 제외)`);
      s.cs = 'method'; refresh();
    },
    backPdp() { S().cs = 'pdp'; refresh(); },
    /* 고객: 상세 설명 보기(U-PDP-07) */
    dvOpen() { const s = S(); s.dvOpen = true; s.viewed.desc = true; app.log('user', '고객이 [상세 설명 펼치기] · 이미지는 화면에 가까워질 때 불러옴(lazy loading)'); refresh(); },
    dvClose() { S().dvOpen = false; refresh(); },
    zoom(b) { const s = S(); const sc = app.lastFrame && app.lastFrame.querySelector('.phone-screen'); s.pdpScroll = sc ? sc.scrollTop : 0; s.zoomI = Number(b.dataset.i); s.cs = 'zoom'; app.log('user', `상세 이미지 ${s.zoomI + 1}번 크게 보기`); refresh(); },
    zoomClose() { backToPdp(); },
    reloadImg() { const s = S(); s.imgFail = false; app.log('user', '[다시 불러오기] → 그 이미지만 다시 불러옴'); refresh(); },
    async report() {
      const s = S(); const p = findP(s.pid);
      const ok = await app.confirm({ title: '이 상품을 신고할까요?', body: '<div class="field"><label for="rpReason">신고 사유</label><select class="select" id="rpReason"><option>연락처 노출</option><option>사실과 다른 정보</option><option>저작권 침해(다른 업체 사진 무단 사용)</option></select></div><p class="xsmall">운영팀이 확인해요.</p>', ok: '신고하기' });
      if (!ok) return;
      const sel = document.getElementById('rpReason'); const reason = sel ? sel.value : '연락처 노출';
      s.reports.unshift({ at: app.clock.now(), reason, name: p.name, ver: p.det ? p.det.ver : '-' });
      app.log('user', `고객 신고: ${esc(reason)} · 상세 설명 v${p.det ? p.det.ver : '-'} → 운영팀 모니터링(A-PRD-01)`);
      if (reason.startsWith('저작권')) app.log('rule', '다른 업체 사진을 무단으로 썼다는 신고 → 운영팀이 확인 뒤 노출을 멈추고 파트너 소명을 받아요(사진·글 권리는 파트너가 보증)');
      app.notify('NOTI_INT_PRODUCT_REPORTED', '운영팀', ['관리자 알림', 'Slack'], `상품 신고 접수 · ${esc(p.name)} · ${esc(reason)}`); app.toast('신고를 접수했어요'); refresh();
    },
    async ask() { await app.ext({ service: '채널톡', what: '상품 문의 상담 열기', lines: ['상품·판매자 정보가 붙은 상담으로 열려요', '운영팀이 파트너에게 확인해 답해요(상품 Q&A는 2차)'] }); },
    async reqItem() {
      const s = S(); const q = s.ctx ? s.ctx.v : '';
      await app.ext({ service: '채널톡', what: '찾는 상품 요청 접수', lines: [`검색어 "${esc(q)}"가 붙은 상담으로 열려요`, '담당 MD가 파트너 소싱에 활용해요'] });
      const z = s.zeroQ.find((x) => x.q === q); if (z) z.req = true; refresh();
    },
  });

  /* 폰 상단 뒤로 버튼과 하단 홈 탭(공통 틀에는 동작이 없어 이 페이지에서 연결) */
  document.getElementById('gc-device').addEventListener('click', (e) => {
    if (app.current !== 'customer') return;
    const s = S(); const kind = s.ctx && s.ctx.kind;
    if (e.target.closest('.phone-top .back')) { if (s.cs === 'zoom') { backToPdp(); return; } s.cs = { pdp: s.ctx ? 'results' : 'home', results: kind === 'q' ? 'search' : 'home', search: 'home', corder: 'pdp', method: 'corder', added: 'pdp' }[s.cs] || 'home'; refresh(); return; }
    const tab = e.target.closest('.phone-tabbar span'); if (tab && tab.textContent.trim().startsWith('홈')) { s.cs = 'home'; refresh(); }
  });

  /* ── 시간이 흐를 때: 검수 기한·서류 만료 ── */
  app.onAdvance((prev, now) => {
    const s = S(); const st = app.state('product');
    if (st === 'IN_REVIEW' && s.review.due && !s.review.warned && now > s.review.due) {
      s.review.warned = true;
      app.log('warn', `상품 검수 기한(${fmtDate(s.review.due)})을 넘겼어요 → 담당자·팀장 알림`);
      app.notify('NOTI_INT_PRODUCT_REVIEW_LATE', '검수 담당 MD·팀장', ['관리자 알림', 'Slack'], `상품 검수 기한 초과 · ${esc(s.name)} · 처리 목표 ${UI.fmtPolicy('product.review_bd')}`);
    }
    /* 판매 중 상품 수정본도 같은 처리 목표(product.review_bd '신규·수정본') → 넘기면 같은 알림 */
    if (app.state('rev') === 'IN_REVIEW' && s.dreview.due && !s.dreview.warned && now > s.dreview.due) {
      s.dreview.warned = true;
      app.log('warn', `수정본 검수 기한(${fmtDate(s.dreview.due)})을 넘겼어요 → 담당자·팀장 알림`);
      app.notify('NOTI_INT_PRODUCT_REVIEW_LATE', '검수 담당 MD·팀장', ['관리자 알림', 'Slack'], `수정본 검수 기한 초과 · ${esc(s.live ? s.live.name : s.name)} 상세 설명 v${s.det.ver}`);
    }
    const d = s.docs.test; const dst = app.state('doc');
    if (d) {
      const notice = new Date(d.expires.getTime() - pc('doc_notice_days') * GC.DAY);
      if (dst === 'VERIFIED' && now >= notice && now < d.expires) {
        goDoc('notice', `만료 ${pc('doc_notice_days')}일 전`);
        app.notify('NOTI_PARTNER_DOC_EXPIRY_NOTICE', '파트너(대성포장 담당자)', ['알림톡', '이메일', '알림센터'], `시험성적서가 ${ymd(d.expires)}에 만료돼요 · 새 서류를 올려 주세요`);
      }
      if (['VERIFIED', 'EXPIRING'].includes(app.state('doc')) && now >= d.expires) {
        goDoc('expire', '유효기간 만료 배치');
        app.log('rule', '시험성적서 만료 → 상품 상세의 인증 배지를 자동으로 내림');
        if (['APPROVED', 'PAUSED'].includes(app.state('product'))) {
          s.suspend = { kind: 'doc', reason: `식품용 기구 시험성적서 유효기간 만료(${ymd(d.expires)})` };
          goP('suspend', '서류 만료 배치 → 본사 중지');
          app.notify('NOTI_PARTNER_PRODUCT_SUSPENDED', '파트너(대성포장 담당자)', ['알림톡', '이메일', '알림센터'], '시험성적서 만료로 판매가 멈췄어요 · 새 서류를 올리면 본사가 풀어요');
        }
      }
    }
    guide();
  });
})();
</script>
</body>
